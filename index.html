{q:"Quelles sont les différentes formes de l'engagement politique ?",
a:`<p><b>L'engagement politique — le fait de participer à une action individuelle ou collective dans le but de participer au pouvoir ou de le conquérir — prend quatre formes principales : le vote, le militantisme, l'engagement associatif et la consommation engagée.</b></p><p>Car le vote est la forme d'engagement minimale au niveau individuel ; le militantisme désigne l'activité d'une personne qui lutte activement pour une cause (adhésion à un parti, syndicat ou association, avec participation active : réunions, tracts, manifestations) ; l'engagement associatif passe par les dons, le bénévolat ou le service civique ; la consommation engagée utilise les achats ou le boycott pour défendre des causes.</p><p>En effet, chacune a ses conditions : le vote n'est un engagement politique que s'il est suivi d'une pratique régulière et s'accompagne d'autres pratiques (discussions politiques, information sur les candidats) ; l'engagement associatif n'est politique que s'il cherche à influencer l'accès au pouvoir ou à politiser une cause.</p><p>Illustration : au moins 40&nbsp;% des Français considèrent le vote comme une forme d'action politique efficace, mais chez les 18-30 ans son importance perd en signification.</p>`},
{q:"Qu'est-ce que la consommation engagée ?",
a:`<p><b>La consommation engagée correspond au choix de consommation d'un individu qui cherche à être en accord avec ses convictions : c'est la manifestation d'un engagement politique par le biais de la consommation.</b></p><p>Car elle implique de renoncer à la posture du consommateur rationnel économiquement pour adopter une position en accord avec des valeurs — donc être prêt à payer plus cher ou à accepter des contraintes d'usage particulières.</p><p>En effet, cette forme d'engagement cherche à transformer le fonctionnement des marchés depuis la position de consommateur, par les achats ou le boycott, pour défendre des causes éthiques ou politiques.</p>`},
{q:"Qu'est-ce qui distingue le militant du simple adhérent ?",
a:`<p><b>Le militant se distingue du simple adhérent car il prend part activement aux activités de l'organisation.</b></p><p>Car le militantisme désigne l'activité d'une personne qui lutte activement pour une cause — par l'adhésion à un parti politique, un syndicat ou une association.</p><p>En effet, cette participation active passe par les réunions, la distribution de tracts, le collage d'affiches ou les manifestations, et vise à transformer l'organisation de la société.</p><p>De plus, son engagement est durable et impacte sa manière de vivre.</p>`}
]},

{num:"6.2", short:"Le paradoxe de l'action collective et ses solutions",
text:"Comprendre pourquoi, malgré le paradoxe de l'action collective, les individus s'engagent (incitations sélectives, rétributions symboliques, structure des opportunités politiques).",
cours:`
<h4>C — Les motifs de l'engagement</h4>
<h5>1 / Le paradoxe de l'action collective</h5>
<div class="exo"><div class="exo-t">Exercice — action collective (schéma)</div>
<p><b>Q8)</b> Le paradoxe repose sur une conception rationnelle et intéressée de l'action humaine : chaque individu calcule son intérêt personnel. Comme s'engager coûte du temps et de l'argent, chacun préfère laisser les autres agir tout en espérant bénéficier du résultat. C'est la logique du «&nbsp;passager clandestin&nbsp;».</p>
<p><b>Q9)</b> Il n'est pas toujours vérifié parce que les individus n'agissent pas uniquement par intérêt personnel. Il existe : des valeurs (solidarité, justice, devoir moral) ; la pression sociale et le regard des autres ; des incitations (récompenses, sanctions) ; des leaders ou organisations qui coordonnent l'action. Tout cela peut pousser les gens à s'engager malgré le coût.</p></div>
<p>Le paradoxe de l'action s'illustre par le principe du «&nbsp;passager clandestin&nbsp;». L'action individuelle n'est pas porteuse de gain d'autant qu'ils sont collectifs. Ainsi faire grève apporte le même gain que pour celui qui ne la fait pas alors que ce dernier n'a pas supporté le coût financier ou de temps. Le choix rationnel serait donc de ne pas participer mais d'autres évènements pèsent sur l'arbitrage notamment les convictions idéologiques ce qui peut amener à une estime de soi et une estime sociale. De plus l'action collective est source de sociabilité et d'éléments structurants comme pour l'action des gilets jaunes.</p>
<h5>2 / Les incitations et les rétributions symboliques</h5>
<div class="def">
<p><b>Incitation sélective :</b> mécanisme de récompense ou de sanctions afin de rendre l'action collective rentable individuellement.</p>
<p><b>Rétribution symbolique :</b> avantage immatériel qu'un individu retire de sa participation à l'action collective.</p></div>
<div class="exo"><div class="exo-t">Exercice — motifs de l'engagement</div>
<p><b>Q1) Qu'est-ce que le mouvement des Gilets jaunes a apporté à Coralie ?</b><br>Le mouvement a apporté à Coralie du lien social, de la reconnaissance et un sentiment d'utilité. Elle rencontre de nouvelles personnes, partage des moments de convivialité (repas, discussions), se sent valorisée et a le sentiment de «&nbsp;faire quelque chose pour elle&nbsp;». Cela change son quotidien et son moral.</p>
<p><b>Q2) Donnez 2 raisons pour lesquelles les Gilets jaunes [s'engagent] :</b><br>– Pour créer du lien et de la solidarité (rencontres, compagnie, entraide).<br>– Pour obtenir une forme de satisfaction personnelle et de reconnaissance (se sentir utile, exister socialement, rompre l'isolement).</p>
<p><b>Q3) Dans quelle mesure ces «&nbsp;rétributions symboliques&nbsp;» peuvent-elles expliquer la longue durée du mouvement des Gilets jaunes ?</b><br>Ces rétributions symboliques (prestige, sentiment d'appartenance, nouvelles relations, utilité personnelle) donnent des bénéfices non matériels aux participants. Même si les résultats politiques sont incertains, ces gains humains et sociaux encouragent les personnes à continuer de venir, ce qui aide le mouvement à durer dans le temps.</p></div>
<p>Il existe plusieurs manières de limiter le comportement opportuniste des acteurs sociaux. Ainsi <b>Olson</b> enrichit son modèle avec la notion d'incitation sélective qui correspond à l'ensemble des bénéfices de l'action collective réservés à l'ensemble des participants et/ou des coûts supplémentaires peuvent être imposés aux non-participants. Les incitations sélectives permettent d'abaisser le coût de participation et ainsi résoudre le paradoxe de l'action collective. Elles peuvent prendre différentes formes telles que des prestations sociales directes, des avantages économiques réservés aux membres de l'organisation. L'existence de l'incitation collective a notamment été mise en évidence grâce au syndicalisme. Ainsi en Belgique ou en Islande par exemple, les prestations chômage sont principalement versées par des syndicats à leurs membres. Le tx de syndicalisation en Belgique est d'environ 50&nbsp;% contre 92&nbsp;% en Islande là où la France en comparaison est d'environ 10&nbsp;%.</p>
<p>Les rétributions symboliques permettent une satisfaction d'ordre moral ou identitaire avec notamment l'estime de soi, le plaisir de lutter ensemble. L'attachement à la cause ou encore la satisfaction de défendre ses idées constituent une forme de rétribution de l'activité pô et militante. Cela se manifeste notamment pour les Gilets jaunes et explique la longévité du mouvement. L'engagement pô peut également donner une sorte de respectabilité sociale et modifier la position sociale des individus en faisant de celui qui s'engage, un leader d'opinion.</p>
<h5>3 / Les opportunités politiques</h5>
<p>Il existe des facteurs structurels liés au contexte politique pour favoriser l'essor d'actions collectives. L'expression <b>structure des opportunités politiques</b> désigne l'environnement politique au sens large et porte notamment sur la nature du pouvoir, l'accès aux décisions politiques, l'opinion publique, etc. La structure des opportunités politiques dépend :</p>
<ul>
<li><b>de l'ouverture du système politique aux mouvements sociaux</b>, CAD le degré d'ouverture auquel le système pô cherche à encourager ou au contraire décourager les mouvements sociaux ou encore décourager l'existence ou non de multiples centres de pouvoir autonomes auxquels les mouvements sociaux peuvent s'adresser pour leurs revendications. Ainsi par exemple la répression policière décourage les manifestants ou au contraire dans les régimes qui favorisent l'accès à des leaders de mouvements à opposition de pouvoir augmente la probabilité de développement de mouvements sociaux car l'espérance de gains augmente ;</li>
<li><b>du degré de stabilité des alliances politiques :</b> CAD la proba plus ou moins élevée de voir un parti unique rester au pouvoir sur une longue durée. Ainsi par exemple dans un régime instable du fait de la volatilité des préférences politiques des citoyens engendrant un changement fréquent de majorité comme par exemple sous la 4e république, l'émergence de mouvements socio est réalisée. En effet dans ce type de système les candidats à l'exercice des responsabilités politiques seront plus réceptifs aux revendications des mouvements sociaux car cela attire l'électorat. À l'opposé dans un régime où les pouvoirs sont en place pour une longue durée, ils bénéficient d'une base solide. Ils n'auront donc pas besoin de prendre en compte les revendications pour rester au pouvoir. Cela ne favorise donc pas l'émergence de mouvements sociaux ;</li>
<li><b>de la division ou l'unité des élites au pouvoir.</b> S'il existe des tensions pô entre les responsables au pouvoir notamment en cas de coalitions partisanes, les mouvements sociaux pourront tenter d'appuyer sur les divisions pour faire valoir leurs revendications. En effet un ministre pourra relayer les revendications d'un mouvement pour faire gagner sa lignée pô ;</li>
<li><b>de la capacité des régimes à développer des politiques publiques favorables aux mouvements sociaux</b> avec l'existence d'un ministère dédié en lien avec un mouvement social et disposant de moyens importants ainsi que d'une administration dédiée comme par exemple le ministère de la famille, l'agriculture. Ce ministère aura donc la capacité de mettre en œuvre des réformes et ainsi répondre aux demandes des mouvements sociaux.</li>
</ul>`,
savoir:[
"<b>Le paradoxe à exposer (Olson) :</b> conception rationnelle et intéressée de l'action — l'action individuelle n'apporte pas de gain supplémentaire puisque les gains sont collectifs (faire grève apporte le même gain que ne pas la faire, sans en supporter le coût) → le choix rationnel serait de ne pas participer : c'est la logique du passager clandestin.",
"<b>Solution 1 — les incitations sélectives (Olson) :</b> bénéfices réservés aux participants et/ou coûts imposés aux non-participants, qui abaissent le coût de participation. Exemple à citer : en Belgique et en Islande, les prestations chômage sont versées par les syndicats à leurs membres → taux de syndicalisation de 50 % (Belgique) et 92 % (Islande) contre ≈ 10 % en France.",
"<b>Solution 2 — les rétributions symboliques :</b> avantages immatériels (estime de soi, plaisir de lutter ensemble, attachement à la cause, respectabilité sociale, statut de leader d'opinion). Exemple : les Gilets jaunes — lien social, reconnaissance, sentiment d'utilité expliquant la longévité du mouvement.",
"<b>Solution 3 — la structure des opportunités politiques :</b> environnement politique au sens large, qui dépend de 4 éléments : ouverture du système politique (répression vs accès au pouvoir), degré de stabilité des alliances politiques (ex. 4e République), division ou unité des élites, capacité des régimes à développer des politiques publiques favorables (ministères dédiés).",
"<b>Définitions :</b> incitation sélective, rétribution symbolique, structure des opportunités politiques, passager clandestin."
],

<div class="ts"><span class="tsn">2</span><div class="ts-body"><span class="ts-lbl">Partie 1 — incitations sélectives et rétributions symboliques</span>Les <b>incitations sélectives</b> (Olson : bénéfices réservés aux participants — ex. prestations chômage versées par les syndicats en Belgique 50&nbsp;%, Islande 92&nbsp;% vs 10&nbsp;% en France) et les <b>rétributions symboliques</b> (estime de soi, plaisir de lutter — ex. Gilets jaunes).</div></div>
<div class="ts"><span class="tsn">3</span><div class="ts-body"><span class="ts-lbl">Partie 2 — la structure des opportunités politiques</span>L'environnement politique favorise ou freine la mobilisation : ouverture du système, stabilité des alliances, division des élites, capacité à développer des politiques publiques.</div></div>
<div class="ts concl"><span class="tsn">→</span><div class="ts-body"><span class="ts-lbl">Conclusion</span>Malgré le paradoxe, les individus s'engagent grâce à ces trois mécanismes — l'engagement ne se réduit donc pas aux variables sociodémographiques.</div></div>
</div>`,

{num:"6.3", short:"Les variables sociodémographiques de l'engagement",
text:"Comprendre que l'engagement politique dépend notamment de variables sociodémographiques (catégorie socioprofessionnelle, diplôme, âge et génération, sexe).",
cours:`
<div class="exo"><div class="exo-t">Exercice — formes d'engagement (suite vidéo)</div>
<p><b>Q2 : Quelles sont les variables socio-démographiques qui déterminent l'engagement ?</b><br>La vidéo identifie quatre variables majeures qui influencent qui s'engage et comment :</p>
<ul><li><b>Le niveau de diplôme :</b> plus on est diplômé, plus on a tendance à s'engager.</li>
<li><b>La Catégorie Socio-Professionnelle (PCS) :</b> les cadres et professions intellectuelles sont plus mobilisés que les ouvriers et employés.</li>
<li><b>L'âge et la génération :</b> les seniors votent davantage, tandis que les jeunes privilégient souvent des formes d'action comme les manifestations ou la consommation engagée.</li>
<li><b>Le sexe :</b> si le vote est paritaire, les hommes militent davantage dans les syndicats ou partis, alors que les femmes s'investissent plus dans le caritatif.</li></ul>
<p><b>Q3 : Comment justifier l'importance de ces variables ? Faire le lien avec le capital culturel.</b><br>L'importance de ces variables s'explique par le concept de capital culturel et le sentiment de compétence :</p>
<ul><li><b>Le lien avec le capital culturel :</b> plus les individus possèdent un capital culturel dense (souvent lié au niveau de diplôme), plus ils se sentent légitimes pour prendre des décisions politiques et participer à la vie publique.</li>
<li><b>Le phénomène d'autocensure :</b> à l'inverse, les personnes moins diplômées ou issues de catégories populaires (ouvriers/employés) ont tendance à s'autocensurer. Elles ne se sentent pas assez «&nbsp;compétentes&nbsp;» ou expertes pour faire un choix politique, ce qui freine leur engagement.</li>
<li><b>Socialisation différentielle :</b> pour le sexe, les différences s'expliquent par les valeurs transmises durant l'éducation, le militantisme politique demandant souvent un goût pour la contestation et une disponibilité de temps dont les femmes disposent parfois moins.</li></ul></div>
<div class="exo"><div class="exo-t">Exercice — militantisme</div>
<p><b>Q1-</b> D'après le document «&nbsp;Une génération contestataire ?&nbsp;», les jeunes générations adhèrent davantage à des formes de participation politique non conventionnelles. Elles privilégient notamment la manifestation, la pétition, le boycott, la grève ou encore l'occupation de bâtiments. Ces modes d'action ont vu leur légitimité progresser entre 1981 et 2008 et sont désormais perçus par les générations récentes comme des moyens normaux et efficaces d'expression politique, contrairement aux générations plus anciennes qui y restent plus réticentes.</p>
<p><b>Q2-</b> On ne peut pas dire que les jeunes générations s'engagent moins politiquement que celles nées dans les années 1930-1940, mais plutôt qu'elles s'engagent différemment. Le document montre une hausse importante de la participation aux manifestations et une reconnaissance accrue des formes d'action contestataires.</p>
<p><b>Q3-</b> La forte adhésion aux formes de participation non conventionnelles permet de réduire certaines inégalités de participation politique, notamment entre les hommes et les femmes, dont les comportements se sont rapprochés au fil du temps. Toutefois, ces nouvelles formes d'engagement ne suffisent pas à effacer les inégalités sociales, car le renouvellement générationnel ne réduit pas les écarts de participation entre les catégories sociales, en particulier entre cadres et ouvriers. Ainsi, si la participation politique s'élargit, elle demeure socialement inégalitaire.</p></div>

<h4>B — Les variables socio-démographiques</h4>
<h5>1 / Le niveau de diplôme et la PCS</h5>
<p>L'intérêt pour la politique et la compétence sont fortement liés au milieu social. Plus l'individu est issu d'une CSP favorisée, plus la proba qu'il s'intéresse à la politique est forte car il y a un sentiment de capacité politique. Les études montrent que l'accumulation de connaissances et de compétences scolaires favorise l'acquisition des connaissances pour se repérer dans l'univers pô, comprendre les enjeux du scrutin et exprimer une opinion. Par ailleurs le fait d'être socialisé dans une famille politisée augmente la proba que l'individu s'intéresse à la pô. Ainsi les hauts diplômés sont souvent plus engagés politiquement et le milieu social influence l'orientation du vote.</p>
<p>Le diplôme joue un rôle dans l'engagement associatif. Les diplômés du supérieur ont 5.5&nbsp;% de plus de chances d'appartenir à une asso de défense de droits et d'intérêts communs que les non-diplômés.</p>
<h5>2 / L'âge</h5>
<p>L'engagement politique des jeunes comparé aux autres classes d'âge comporte des spécificités :</p>
<ul><li>ils ont moins recours au vote et s'abstiennent plus fréquemment ;</li>
<li>leur comportement dominant est intermittent CAD qu'ils ne se mobilisent que pour les élections jugées importantes ;</li>
<li>ils ont une défiance très importante vis-à-vis des partis politiques et vis-à-vis de leurs responsables politiques.</li></ul>
<p>Les jeunes sont moins fidèles à un camp politique et sont surreprésentés dans les partis radicaux tels que LFI et RN, ils sont aussi moins représentés dans les syndicats.</p>
<p>Les jeunes participent sous différentes formes à l'engagement politique en s'investissant notamment dans des associations ce qui contredit l'idée d'une jeunesse individualiste et repliée sur elle-même. Leur mode d'action est peut-être plus contestataire avec les manifestations ou des pétitions. Ils valorisent la possibilité de faire circuler les informations notamment avec le numérique, de participer à des initiatives et de peser sur les décisions.</p>
<p>Les sociologues expliquent l'engagement des jeunes par <b>l'effet «&nbsp;âge&nbsp;»</b>. Quelle que soit la génération, les jeunes sont moins constants et plus radicaux et ont tendance à être politisés à gauche. Cela peut s'expliquer par l'imparfaite connaissance des règles de fonctionnement du jeu politique, leur position sociale encore instable, mais aussi par la culture «&nbsp;jeune&nbsp;» qui valorise leur protestation.</p>
<p>Il existe aussi un <b>effet génération</b> suivant le contexte économique, politique ou social dans lequel la société évolue. Les individus n'ont pas la même possibilité de recourir à l'action protestataire. Par exemple mai 1968 est marqué par l'influence de groupes militants d'extrême gauche sur les campus universitaires, dans les usines, etc. Ainsi c'est moins l'âge que le contexte historique d'entrée qui joue un rôle dans la définition des comportements d'engagement d'une génération. Ainsi l'arrivée au 2nd tour du FN en 2002, le réchauffement climatique ou encore les attentats ou la crise de 2008 peuvent avoir une influence sur l'attitude politique des jeunes et marquer durablement leur comportement politique quand ils vieillissent.</p>
<h5>Le sexe</h5>
<p>L'engagement des femmes par rapport aux hommes est moindre, cela s'explique par la socialisation de genre, en effet il paraît plus «&nbsp;naturel&nbsp;» pour un homme d'exprimer une opinion politique que pour une femme (cf sentiment de capacité politique). La transmission des dispositions militantes s'opère plus facilement des pères vers les fils, ce qui pousse les femmes à moins ressentir d'attirance pour l'engagement politique. L'inégal partage du travail domestique est également un frein à l'engagement politique des femmes car l'engagement nécessite du temps et de l'énergie.</p>
<p>On peut tout de même noter qu'il y a une convergence dans l'engagement politique selon le genre ces dernières années.</p>
<table>

cards:[
{q:"Comment le diplôme et la PCS influencent-ils l'engagement politique ?",
a:`<p><b>L'intérêt pour la politique et la compétence politique sont fortement liés au milieu social : plus l'individu est issu d'une CSP favorisée, plus la probabilité qu'il s'intéresse à la politique est forte.</b></p><p>Car il existe un sentiment de capacité politique : l'accumulation de connaissances et de compétences scolaires favorise l'acquisition des repères pour comprendre l'univers politique, les enjeux du scrutin et exprimer une opinion. Plus les individus possèdent un capital culturel dense, plus ils se sentent légitimes pour participer à la vie publique.</p><p>En effet, à l'inverse, les personnes moins diplômées ou issues de catégories populaires ont tendance à s'autocensurer : elles ne se sentent pas assez «&nbsp;compétentes&nbsp;» pour faire un choix politique, ce qui freine leur engagement. Le fait d'être socialisé dans une famille politisée augmente aussi la probabilité de s'intéresser à la politique.</p><p>Illustration chiffrée : les diplômés du supérieur ont 5,5&nbsp;% de plus de chances d'appartenir à une association de défense de droits et d'intérêts communs que les non-diplômés.</p>`},
{q:"Quelles sont les spécificités de l'engagement politique des jeunes ?",
a:`<p><b>L'engagement politique des jeunes comporte des spécificités : moins de vote, mobilisation intermittente et défiance envers les partis — mais ils ne s'engagent pas moins, ils s'engagent différemment.</b></p><p>Car ils s'abstiennent plus fréquemment, ne se mobilisent que pour les élections jugées importantes, sont moins fidèles à un camp politique, surreprésentés dans les partis radicaux (LFI, RN) et moins présents dans les syndicats.</p><p>En effet, ils s'investissent dans des associations — ce qui contredit l'idée d'une jeunesse individualiste — et privilégient des modes d'action contestataires : manifestations, pétitions, circulation de l'information par le numérique. Ces formes non conventionnelles (boycott, grève, occupation de bâtiments) ont vu leur légitimité progresser entre 1981 et 2008.</p><p>Explication sociologique : l'effet âge (les jeunes de toutes générations sont moins constants, plus radicaux, politisés à gauche — position sociale instable, culture jeune valorisant la protestation) se combine à l'effet génération (le contexte historique d'entrée — mai 68, le FN en 2002, la crise de 2008, le réchauffement climatique — marque durablement les comportements).</p>`},
{q:"Comment expliquer le moindre engagement politique des femmes ?",
a:`<p><b>L'engagement des femmes par rapport aux hommes est moindre, et cela s'explique par la socialisation de genre.</b></p><p>Car il paraît plus «&nbsp;naturel&nbsp;» pour un homme d'exprimer une opinion politique que pour une femme (sentiment de capacité politique), et la transmission des dispositions militantes s'opère plus facilement des pères vers les fils.</p><p>En effet, l'inégal partage du travail domestique est également un frein : l'engagement nécessite du temps et de l'énergie, dont les femmes disposent parfois moins ; le militantisme demande aussi un goût pour la contestation, valeur inégalement transmise durant l'éducation.</p><p>Nuances du cours : si le vote est paritaire, les hommes militent davantage dans les syndicats ou partis tandis que les femmes s'investissent plus dans le caritatif ; et on note une convergence dans l'engagement politique selon le genre ces dernières années — les nouvelles formes d'action collective sont d'ailleurs de plus en plus féminines.</p>`},
{q:"L'engagement politique dépend-il seulement de variables sociodémographiques ?",
a:`<p><b>Non : si l'engagement dépend fortement des variables sociodémographiques (diplôme, PCS, âge et génération, sexe), il s'explique aussi par les motifs individuels qui résolvent le paradoxe de l'action collective.</b></p><p>Car les variables sociodémographiques pèsent : les cadres et diplômés s'engagent plus (capital culturel, sentiment de compétence), les jeunes privilégient les formes contestataires, les femmes sont freinées par la socialisation de genre.</p><p>Mais en effet, malgré le paradoxe de l'action collective (logique du passager clandestin), les individus s'engagent grâce aux incitations sélectives (avantages réservés aux participants, comme les prestations chômage syndicales en Belgique ou Islande), aux rétributions symboliques (estime de soi, lien social, reconnaissance — comme pour les Gilets jaunes) et à la structure des opportunités politiques (ouverture du système, stabilité des alliances, division des élites).</p><p>Illustration : la participation s'élargit avec les formes non conventionnelles, mais demeure socialement inégalitaire — les écarts entre cadres et ouvriers persistent malgré le renouvellement générationnel.</p>`}
]},

{num:"6.4", short:"Objets, acteurs et répertoires de l'action collective",
text:"Comprendre la diversité et les transformations des objets de l'action collective (conflits du travail, nouveaux enjeux de mobilisation, luttes minoritaires), des acteurs (partis politiques, syndicats, associations, groupements) et de leurs répertoires.",
cours:`
<h4>II — La diversité et la transformation des objets</h4>
<div class="exo"><div class="exo-t">Exercice — diversité des objets</div>
<p><b>Q1 Quels sont les objets de mobilisation ? Illustrez.</b><br>L'engagement vise à influencer le pouvoir pour transformer la société. Les causes défendues sont variées : elles peuvent être idéologiques, sociales comme la lutte contre la précarité, ou éthiques comme la protection de l'environnement à travers des choix de consommation.</p>
<p><b>Q2 Illustrez la diversité des acteurs de l'engagement politique.</b><br>Le profil des engagés dépend fortement du capital culturel et social. Les cadres et les diplômés sont les plus actifs, tandis que les jeunes et les femmes privilégient souvent des formes d'action différentes, comme les marches ou le secteur associatif caritatif.</p>
<p><b>Q3 Quelles sont les principales évolutions (+ dates clés) ?</b><br>Les modes d'engagement changent avec les générations. Par exemple, les jeunes de 1968 n'avaient pas les mêmes priorités que ceux nés dans les années 2000, ces derniers étant beaucoup plus portés sur la consommation engagée et les enjeux écologiques.</p>
<p><b>Q4 Qu'est-ce qui justifie l'évolution du type de conflit ?</b><br>L'évolution des conflits s'explique par un besoin d'expression plus direct. Aujourd'hui, l'individu utilise son identité et son mode de vie comme un levier politique, transformant des actes quotidiens en outils de pression pour faire valoir ses valeurs éthiques.</p>
<p><b>Q5 Quels sont les répertoires de l'action collective ?</b><br>L'action politique utilise plusieurs outils : le vote (classique), le militantisme (tracts, réunions), et des formes plus modernes comme la consommation engagée (boycott) ou les manifestations de rue, qui permettent d'agir en dehors des partis traditionnels.</p></div>

<h4>A — La diversité des objets de l'action collective</h4>
<h5>1 / Les conflits au travail</h5>
<p>Tout au long du XXe siècle les conflits au travail ont été portés par les ouvriers, les salariés et les organisations syndicales qui les représentent. Ils se battent notamment pour les conditions de travail, le salaire, etc. Jusque dans les années 70, les conflits portaient principalement sur le travail, les syndicats étaient puissants et éprouvaient des relais pô. Des grèves et des manifestations interprofessionnelles étaient massivement suivies mais la désindustrialisation ainsi que la montée du chômage et de la précarisation s'est accompagnée d'un recul des grèves et de la syndicalisation. On assiste à une modification des conflits du travail avec des salariés qui préfèrent les arrêts maladie de courte durée car peu de perte de salaire à d'autres formes de manifestations qui peuvent paraître plus risquées. Ainsi les conflits au travail n'ont pas disparu mais ont changé de forme.</p>
<h5>2 / Les nouveaux mouvements sociaux</h5>
<p>Les nouveaux mouvements sociaux désignent les nouvelles actions collectives qui se développent autour des revendications post-matérialistes. Les revendications des nouveaux mouvements sociaux portent donc sur la distribution du bien-être et ne portent plus seulement sur le travail. Cela peut porter sur des motifs culturels, des repères d'identité (régionales, sexuelles). Ces nouvelles revendications émergent du fait de l'affaiblissement des mouvements ouvriers qui s'est produit en parallèle de la moyennisation de la société. Ces nouveaux mouvements sociaux sont portés par de nouveaux acteurs tels que les étudiants, les femmes, les minorités. On peut toutefois nuancer cette nouveauté avec notamment les mouvements féministes qui existaient déjà au début du 20e siècle avec les suffragettes.</p>
<h5>3 / Les luttes minoritaires</h5>
<p>Les luttes minoritaires sont des actions collectives menées par des groupes minoritaires qui cherchent une forme de reconnaissance de leur identité sociale et/ou une extension de leurs droits en tant que membres du groupe. On peut ainsi placer dans ces catégories les mouvements LGBT, les mouvements antiracistes (portés par des descendants d'immigrés), les mobilisations contre les discriminations en tout genre. Ainsi le mouvement BLM s'est développé aux USA à partir de 2013 et est porté par une minorité pô et défend ses droits notamment contre la violence faite par différentes institutions (police, justice, etc.).</p>

<h4>B — Les répertoires de l'action collective</h4>
<p>La participation politique ne se résume pas aux seuls évènements des agendas de campagne politique et de la vie des partis. En effet les mouvements sociaux sont considérés comme une forme de participation comme par exemple avec les Nuits debout. Il s'agit d'intervenir dans la vie pô et donc dans la vie de cité. Si l'effort d'engagement traditionnel tel que l'engagement dans un parti ou dans un syndicat est en déclin, il existe des structures autour de problématiques précises qui peuvent motiver l'individu à participer. Cela peut prendre la forme de manifestations locales, nationales ou internationales notamment si la cause dépasse le cadre des États-nations.</p>
<p>Le sociologue <b>Charles Tilly</b> a montré que les mobilisations collectives en France ont connu plusieurs types d'actions :</p>
<ul><li>du milieu du 17e jusqu'au milieu du 19e : les mobilisations étaient très locales et liées à une entreprise ou une région ;</li>
<li>dans un contexte de nationalisation de la vie pô les mobilisations ont été plus ciblées et plus autonomes (exemple Mai '68).</li></ul>
<p>L'institutionnalisation des conflits a permis de pacifier les actions et de protéger les protagonistes. Les syndicats sont autorisés depuis 1884. Il n'en reste pas moins que les groupes sociaux disposent de répertoires d'actions collectives (grève, manifestations, occupation de bâtiments, grève de la faim). Le choix du répertoire d'actions dépend de la culture du groupe qui proteste, de l'époque mais aussi de la lutte des autorités qui cherchent à les encadrer par la loi.</p>

<h4>C — Les organisations permettant l'engagement</h4>
<p>Une action collective émerge rarement d'elle-même ou de manière spontanée, le plus souvent elle est instituée par des organisations de nature différente, cela peut venir aussi bien d'un parti politique que de la société civile. Ainsi la société civile organise et regroupe des organisations syndicales ou des associations ou toute forme d'organisations citoyennes en dehors de la sphère économique ou de l'État. Elle a un triple rôle :</p>
<ul><li>permettre aux opinions minoritaires de s'exprimer sans céder à la tyrannie de la majorité (confère Alexis de Tocqueville) ;</li>
<li>assurer la participation des citoyens à la vie de la cité en dehors des élections ;</li>
<li>garantir la stabilité politique.</li></ul>
<p>Les partis politiques et dans une moindre mesure les syndicats connaissent une diminution de leurs effectifs ainsi que du crédit qu'ils ont dans l'opinion publique. Grève, manifestation sont les modes d'action traditionnels, on peut noter qu'il y a une baisse tendancielle de la grève dans le secteur privé mais qui est compensée par la hausse dans le secteur public et dans les grandes entreprises de transports. La conflictualité est donc plus élevée lorsque les salariés sont moins exposés.</p>
<p>Selon Charles Tilly, ces mobilisations s'inscrivent dans un répertoire institutionnalisé ou patronné car ces manifestations sont le plus souvent encadrées. Ce répertoire peut également être national car il y a des règles juridiques communes et vise des interlocuteurs clairs, l'employeur mais également l'État.</p>
<p>Les conflits du travail mobilisent davantage les milieux populaires ou moyennement diplômés même si la participation varie en fonction des secteurs, les revendications sont centrées sur des besoins matériels ou redistributifs.</p>
<p>De nouveaux acteurs s'affirment sous la forme de groupements citoyens, organisés de manière souple et décentralisée en vue de défendre une cause ou une idéologie ; cela peut se traduire par la formation d'associations locales pour défendre un espace naturel ou un patrimoine, cela peut être à une échelle nationale comme les associations de victimes (accidents de la route, terrorisme etc.), cela peut également être supra-national avec des ONG (comme Médecins sans frontières).</p>
<p>La cause écologique illustre l'évolution des acteurs et des modes d'action. En effet, l'occupation d'une ZAD (zone à défendre) caractérise les nouveaux mouvements sociaux car le projet est jugé nuisible à l'environnement ou socialement injuste. Les zadistes sont le plus souvent des jeunes, diplômés, issus de la classe moyenne supérieure, on peut également noter une forte participation féminine car il y a des valeurs de solidarité, de justice sociale et d'écologie. Cela relève du répertoire d'action non conventionnel fondé sur l'action directe et la désobéissance civile, c'est un répertoire ancré et faiblement patronné car l'encadrement se fait loin des partis politiques et des syndicats.</p>
<div class="def">
<p><b>Syndicat :</b> association dont l'objectif est de défendre les intérêts professionnels communs à ses membres.</p>
<p><b>Association :</b> groupement de personnes volontaires autour d'un projet commun et partageant des activités sans but lucratif.</p>
<p><b>Groupement militant :</b> rassemblement de citoyens qui se réunissent pour défendre une cause / une idéologie.</p></div>`,
savoir:[
"<b>Les 3 objets à exposer :</b> ① conflits du travail (portés par ouvriers et syndicats au XXe siècle ; recul des grèves avec la désindustrialisation, le chômage et la précarisation ; mutation des formes — arrêts maladie courts ; les conflits n'ont pas disparu, ils ont changé de forme) ; ② nouveaux mouvements sociaux (revendications post-matérialistes : bien-être, culture, identités régionales/sexuelles ; nouveaux acteurs : étudiants, femmes, minorités ; nuance : les suffragettes existaient déjà au début du XXe) ; ③ luttes minoritaires (reconnaissance d'identité et extension de droits : LGBT, antiracisme, BLM aux USA depuis 2013).",

a:`<p><b>Les conflits au travail n'ont pas disparu mais ont changé de forme.</b></p><p>Car tout au long du XXe siècle, ils ont été portés par les ouvriers, les salariés et les organisations syndicales, qui se battaient pour les conditions de travail et le salaire ; jusque dans les années 70, les syndicats étaient puissants et les grèves interprofessionnelles massivement suivies.</p><p>En effet, la désindustrialisation, la montée du chômage et la précarisation se sont accompagnées d'un recul des grèves et de la syndicalisation : les salariés préfèrent désormais des formes moins risquées, comme les arrêts maladie de courte durée (peu de perte de salaire).</p><p>Illustration : la baisse tendancielle de la grève dans le secteur privé est compensée par sa hausse dans le secteur public et les grandes entreprises de transport — la conflictualité est plus élevée lorsque les salariés sont moins exposés.</p>`},
{q:"Que sont les nouveaux mouvements sociaux et les luttes minoritaires ?",
a:`<p><b>Les nouveaux mouvements sociaux désignent les actions collectives qui se développent autour de revendications post-matérialistes ; les luttes minoritaires sont menées par des groupes cherchant la reconnaissance de leur identité et l'extension de leurs droits.</b></p><p>Car les revendications des NMS portent sur la distribution du bien-être et non plus seulement sur le travail : motifs culturels, repères d'identité (régionales, sexuelles). Elles émergent de l'affaiblissement des mouvements ouvriers, parallèle à la moyennisation de la société, et sont portées par de nouveaux acteurs : les étudiants, les femmes, les minorités.</p><p>En effet, les luttes minoritaires regroupent les mouvements LGBT, les mouvements antiracistes (portés par des descendants d'immigrés) et les mobilisations contre les discriminations — comme le mouvement BLM, développé aux USA à partir de 2013 contre les violences institutionnelles (police, justice).</p><p>Nuance du cours : cette «&nbsp;nouveauté&nbsp;» est relative — les mouvements féministes existaient déjà au début du XXe siècle avec les suffragettes.</p>`},
{q:"Qu'est-ce qu'un répertoire d'action collective selon Charles Tilly ?",
a:`<p><b>Le répertoire d'action collective désigne l'ensemble des moyens d'action dont disposent les groupes sociaux : grève, manifestation, occupation de bâtiments, grève de la faim.</b></p><p>Car Charles Tilly a montré que les mobilisations collectives en France ont connu plusieurs types d'actions : du milieu du 17e au milieu du 19e siècle, elles étaient très locales et liées à une entreprise ou une région ; puis, dans un contexte de nationalisation de la vie politique, elles sont devenues plus ciblées et plus autonomes (exemple : Mai 68).</p><p>En effet, le choix du répertoire dépend de la culture du groupe qui proteste, de l'époque, mais aussi de la lutte des autorités qui cherchent à l'encadrer par la loi — l'institutionnalisation des conflits (syndicats autorisés depuis 1884) a pacifié les actions et protégé les protagonistes.</p><p>Illustration : les manifestations syndicales relèvent d'un répertoire institutionnalisé ou «&nbsp;patronné&nbsp;» (encadrées, interlocuteurs clairs : employeur, État), tandis que l'occupation d'une ZAD relève d'un répertoire non conventionnel fondé sur l'action directe et la désobéissance civile, faiblement patronné car loin des partis et syndicats.</p>`},
{q:"Comment les acteurs de l'action collective se sont-ils transformés ?",
a:`<p><b>Les acteurs traditionnels (partis politiques, syndicats) connaissent un déclin, tandis que s'affirment de nouveaux groupements citoyens souples et décentralisés.</b></p><p>Car les partis et, dans une moindre mesure, les syndicats connaissent une diminution de leurs effectifs et du crédit qu'ils ont dans l'opinion publique.</p><p>En effet, les nouveaux acteurs prennent la forme d'associations locales (défense d'un espace naturel, d'un patrimoine), nationales (associations de victimes d'accidents de la route ou du terrorisme) ou supranationales (ONG comme Médecins sans frontières). La société civile joue un triple rôle : permettre aux opinions minoritaires de s'exprimer sans céder à la tyrannie de la majorité (Tocqueville), assurer la participation des citoyens hors élections, garantir la stabilité politique.</p><p>Illustration : la cause écologique — les zadistes sont le plus souvent des jeunes diplômés issus de la classe moyenne supérieure, avec une forte participation féminine (valeurs de solidarité, justice sociale et écologie).</p>`}
]}
]});

CH.push({
id:7, theme:"Regard croisé", color:"#16a34a",
title:"Quelle action publique pour l'environnement ?",
objectifs:[
{num:"7.1", short:"Les acteurs, la construction du problème public et la mise à l'agenda",
text:"Savoir identifier les différents acteurs (pouvoirs publics, ONG, entreprises, experts, partis, mouvements citoyens) qui participent à la construction des questions environnementales comme problème public et à leur mise à l'agenda politique ; comprendre que ces acteurs entretiennent des relations de coopération et de conflit.",
cours:`
<h4>A — La mobilisation des différents acteurs</h4>
<h5>1 / Les différents acteurs</h5>
<div class="def">
<p><b>Environnement :</b> ensemble des éléments biologiques qui permettent une activité humaine, il se compose des ressources naturelles et de l'écosystème.</p>
<p><b>Partie prenante :</b> ce sont des acteurs situés autour de la société qui peuvent affecter ou être affectés par la société sans forcément qu'il y ait de lien contractuel (autorité publique, collectivité locale, association, entreprises, etc.).</p></div>
<div class="exo"><div class="exo-t">Exercices — acteurs et parties prenantes</div>
<p><b>1) Quel est le problème soulevé par le document ?</b><br>Le document traite du déboisement de l'Amazonie et de ses causes profondes. Il montre que la déforestation résulte de politiques publiques favorisant l'expansion agro-industrielle (routes, mines, barrages, agriculture). Malgré des politiques de protection mises en place dans les années 2000, la déforestation repart à la hausse depuis 2012 sous la pression de l'agrobusiness et à cause de l'affaiblissement des lois et des contrôles. Le texte souligne aussi que la protection passe par le développement durable et la reconnaissance des territoires autochtones.</p>
<p><b>2) Quelles sont les parties prenantes ? Préciser leurs rôles.</b></p></div>
<p>Les parties prenantes ont des intérêts opposés. Si les pô s'emparent d'une mobilisation citoyenne ou des revendications d'une association, cela peut conduire à la mise à l'agenda politique. Les parties prenantes alternent entre conflit et coopération.</p>
<h5>2 / La mise à l'agenda politique</h5>
<p>La mise à l'agenda pô est un processus par lequel des problèmes d'ordre privé sont progressivement étudiés pour une prise en charge des institutions publiques. Elle suppose l'intervention d'acteurs tels que les assos, ONG, médias, experts scientifiques, etc.</p>
<div class="exo"><div class="exo-t">Exercice — mise à l'agenda</div>
<p><b>Question 6)</b> On dit d'une construction des questions environnementales comme d'un long processus car ces dernières nécessitent en moyenne pas moins de 5 étapes avant de pouvoir être inscrites à l'agenda pô. De l'identification à la mise en politique publique, pas moins de 5 acteurs sont nécessités et plusieurs expertises mais aussi mise en page du problème pour attirer l'attention et donc du poids à ce problème.</p>
<p><b>Question 7)</b> L'étape de la popularisation est importante car c'est cette dernière qui va donner du poids, de la visibilité et du crédit au problème soulevé. En effet plus l'opinion publique a un avis sur le problème, plus sa portée et sa place dans les discussions politiques gagnent du terrain. Ainsi cela va de soi que plus le problème prend de l'ampleur sur la scène politique, plus il sera alors proposé et discuté par les pouvoirs publics.</p>
<p><b>Question 8)</b></p>
<ul>
<li><b>Rapport du Club de Rome (1972) → Étape 1 : Identification.</b> Il alerte pour la première fois à grande échelle sur les limites de la croissance et les risques environnementaux. Le problème est formulé et rendu visible publiquement.</li>
<li><b>Création du GIEC (1988) → Étape 2 : Cadrage.</b> Des experts produisent des rapports scientifiques, mesurent le phénomène, définissent ses causes et ses conséquences : on structure le problème.</li>
<li><b>Campagne du WWF (ours polaire) → Étapes 3 + 4 : Justification et Popularisation.</b> Justification : mobilisation d'images, d'émotions, d'arguments pour montrer la gravité. Popularisation : sensibilisation du grand public et des décideurs.</li>
<li><b>Accord de Paris (COP21, 2015) → Étape 5 : Mise en politique publique.</b> Adoption de mesures et d'engagements internationaux concrets pour agir contre le réchauffement climatique.</li>
</ul></div>
<p>Un problème public n'existe pas en soi mais il résulte de la confrontation de différentes positions et aboutit à un travail collectif. La mise à l'agenda politique résulte d'un travail de longue haleine. Cela lui confère un format politique qui permet une éventuelle action publique.</p>
<h5>3 / Entre conflit et coopération</h5>
<div class="exo"><div class="exo-t">Exercice — entre conflit et coopération</div>
<p><b>Q12)</b> La déforestation progresse car le nouveau président brésilien soutient le développement agricole et minier et encourage l'ouverture des terres indigènes à l'exploitation. Les politiques menées favorisent donc l'exploitation économique de la forêt amazonienne plutôt que sa protection.</p>
<p><b>Q13)</b> Ils peuvent compter sur différents acteurs : les ONG (comme Greenpeace), les consommateurs des pays occidentaux, certaines entreprises étrangères (ex : une chaîne suédoise qui bannit des produits brésiliens), les partenaires commerciaux du Brésil (UE, etc.).</p>
<p><b>Q14)</b> Parce que si d'autres entreprises ou distributeurs étrangers boycottent les produits brésiliens, cela peut réduire les exportations et pénaliser l'économie du pays. Ce type d'action peut créer une pression économique et une mauvaise image internationale.</p>
<p><b>Q15)</b> Greenpeace estime que cet accord va encourager davantage d'échanges de produits (viande, céréales, automobiles), donc plus de production agricole et industrielle, ce qui entraîne plus de déforestation et plus d'émissions polluantes. Selon eux, cela aggrave le changement climatique au lieu de le freiner.</p></div>
<p>L'environnement se caractérise par différents types de conflits entre les différentes parties prenantes car elles ont des intérêts divergents. La mobilisation des différents acteurs peut être très locale comme pour lutter contre l'implantation d'une entreprise ou au contraire plus globale dans le cadre du réchauffement climatique. Les différents acteurs peuvent avoir recours à une multitude d'actions suivant le répertoire choisi. On distingue 3 principales causes de conflits environnementaux :</p>
<ul>
<li><b>lorsqu'il y a une vision opposée ou concurrente sur un problème public</b>, cela concerne notamment les climatosceptiques pour qui l'intervention des pouvoirs publics pour lutter contre le réchauffement climatique n'est pas légitime et donc ne devrait pas figurer à l'agenda pô. Ce conflit peut se résoudre grâce aux travaux d'experts reconnus prouvant le rôle de l'activité humaine ;</li>
<li><b>le partage des ressources environnementales :</b> constitue l'une des principales sources de conflits, on peut prendre l'exemple du pétrole de schiste aux États-Unis qui pollue les eaux fluviales et les nappes avoisinantes ce qui crée de vives oppositions à son exploitation ;</li>
<li><b>la responsabilité des pouvoirs publics</b>, qui peut se traduire de manière juridique. En effet, des collectifs et associations ont porté plainte contre l'État français car ils jugeaient les mesures insuffisantes pour lutter contre le réchauffement climatique, plus de deux millions de personnes ont soutenu ce recours au travers d'une pétition. L'État français a été condamné.</li>
</ul>
<div class="def">
<p><b>Conflit :</b> affrontement entre des acteurs ayant des intérêts divergents.</p>
<p><b>Coopération :</b> comportement où chacun poursuit ses intérêts en prenant ceux des autres en compte.</p></div>
<p>Si le conflit est souvent présent, les acteurs peuvent faire le choix de la coopération. Dans cette logique les citoyens peuvent participer à la définition des pô en collaboration avec les collectivités et les entreprises. Ainsi les agents alternent souvent entre conflit et coopération. Les ONG négocient régulièrement avec les pouvoirs publics. Elles pratiquent une forme de lobbyisme.</p>
<p>La COP 21, où 21 ONG ont pu intervenir ainsi que des experts, s'est traduite par un accord non-contraignant. En effet aucune sanction n'est prévue en cas de non-respect mais il montre une volonté de coopération entre les États et les organisations citoyennes.</p>`,
savoir:[
"<b>Définitions :</b> environnement, partie prenante, mise à l'agenda politique (processus par lequel des problèmes privés sont pris en charge par les institutions publiques), conflit, coopération.",
"<b>Les acteurs à savoir identifier :</b> pouvoirs publics, ONG (Greenpeace, WWF), entreprises, experts scientifiques (GIEC), médias, associations, mouvements citoyens, consommateurs.",
"<b>Les 5 étapes de la construction d'un problème public, avec leurs illustrations :</b> ① identification (rapport du Club de Rome, 1972) ; ② cadrage (création du GIEC, 1988) ; ③ justification et ④ popularisation (campagne WWF de l'ours polaire) ; ⑤ mise en politique publique (Accord de Paris, COP21, 2015). Idée clé : un problème public n'existe pas en soi, il résulte d'un travail collectif de longue haleine.",
"<b>Les 3 causes de conflits environnementaux :</b> visions opposées sur le problème (climatosceptiques — résolu par l'expertise), partage des ressources (pétrole de schiste aux USA), responsabilité des pouvoirs publics (« l'Affaire du siècle » : plainte contre l'État français soutenue par plus de 2 millions de signatures, État condamné).",

],

{num:"7.2", short:"L'articulation des échelles de l'action publique (locale → mondiale)",
text:"Comprendre que l'action publique pour l'environnement articule différentes échelles (locale, nationale, européenne, mondiale).",
cours:`
<h4>B — Le niveau de décision</h4>
<p>Depuis les années 80, l'État est concurrencé par des acteurs supra-nationaux tels que l'UE et les organisations internationales. De grands accords internationaux impliquent une articulation entre différentes échelles de l'action publique. On est passé d'une démarche descendante à une démarche ascendante. Le protocole de Kyoto en 97 est caractérisé par une démarche descendante car juridiquement contraignant. Dans cet accord les pays doivent s'engager à respecter des objectifs chiffrés de réduction des gaz à effet de serre mais la conférence de Copenhague (2009) ou les accords de Paris (2015) se basent sur une approche ascendante car basés sur la coopération pour inciter les agents à agir en faveur du climat.</p>
<p>L'Europe est régie par le <b>principe de subsidiarité</b> selon lequel la responsabilité d'une action doit être exercée par l'organisation la plus proche de ceux qui sont concernés par cette action. Le but étant de ne pas déconnecter la prise de décision collective de son exécution. Ainsi l'autorité centrale ne doit pas effectuer de tâches qui peuvent être effectuées à un niveau décentralisé.</p>
<div class="def"><p><b>Gouvernance multiniveau :</b> se fonde sur le principe de répartition de compétences à différentes échelles du pouvoir européen (locale, nationale, communautaire).</p></div>
<div class="exo"><div class="exo-t">Exercice — niveaux de décision</div>
<p><b>13)</b> Les mesures prises aux différents niveaux dans le secteur des transports ont toutes le même objectif : réduire la pollution et les émissions de gaz à effet de serre. Que ce soit au niveau mondial, européen, national ou local, l'action publique cherche à limiter les émissions de CO₂, à mieux contrôler les activités de transport et à encourager des modes de déplacement moins polluants afin de protéger l'environnement et la qualité de l'air.</p>
<p><b>14)</b> Les moyens utilisés pour atteindre cet objectif sont variés selon les niveaux d'action. Au niveau mondial, on met en place des quotas d'émissions et des mécanismes de compensation carbone. Au niveau européen, il existe des plans de surveillance et des objectifs chiffrés de baisse des émissions. Au niveau national, on utilise des instruments économiques comme la taxe carbone et les bonus-malus pour favoriser les véhicules peu polluants. Au niveau local, les autorités agissent directement sur la circulation avec la circulation alternée, la gratuité des transports en commun, les péages urbains ou encore les vélos en libre-service. Cela montre que les outils sont à la fois réglementaires, économiques et organisationnels.</p>
<p><b>15)</b> La vignette Crit'Air montre que l'action publique combine plusieurs niveaux. Elle est créée par l'État au niveau national, qui définit la classification des véhicules selon leur niveau de pollution. Ensuite, les collectivités locales utilisent cette vignette pour mettre en place des restrictions de circulation dans certaines zones ou lors des pics de pollution. La règle est donc décidée au niveau national mais appliquée concrètement au niveau local, ce qui illustre la complémentarité des niveaux d'action publique.</p></div>
<p>L'action publique en faveur de l'environnement s'effectue au travers de différentes échelles. Au niveau international ou mondial cela passe par des sommets et des accords internationaux. Ces décisions ou recommandations vont se traduire au niveau communautaire où les États avec différentes réglementations permettent de mettre en place un cadre conforme aux objectifs généraux. Les pouvoirs publics nationaux conservent des capacités d'initiative notamment en ce qui concerne les infrastructures (routières, ferroviaires). Mais l'échelon local et régional est particulièrement pertinent pour l'application concrète des mesures. En effet ils ont une meilleure connaissance des territoires ce qui permet de cerner plus facilement le problème et mobiliser rapidement les acteurs concernés pour trouver des solutions rapides et pragmatiques.</p>`,
savoir:[
"<b>Définitions :</b> principe de subsidiarité (la responsabilité d'une action doit être exercée par l'organisation la plus proche des personnes concernées), gouvernance multiniveau (répartition des compétences aux échelles locale, nationale, communautaire).",
"<b>Démarche descendante vs ascendante :</b> protocole de Kyoto 1997 = descendante (juridiquement contraignant, objectifs chiffrés de réduction des GES) ; Copenhague 2009 et Accords de Paris 2015 = ascendante (coopération, incitation).",
"<b>Les 4 échelles avec leurs instruments (exemple des transports) :</b> mondial = quotas d'émissions et compensation carbone ; européen = plans de surveillance et objectifs chiffrés ; national = taxe carbone, bonus-malus ; local = circulation alternée, gratuité des transports, péages urbains, vélos en libre-service.",
"<b>Pourquoi l'échelon local est pertinent :</b> meilleure connaissance des territoires → cerner le problème et mobiliser rapidement les acteurs pour des solutions rapides et pragmatiques.",
"<b>Exemple de complémentarité à citer : la vignette Crit'Air</b> — créée par l'État (classification nationale des véhicules), appliquée par les collectivités locales (restrictions de circulation, pics de pollution)."
],
sujets:[
"En quoi les questions environnementales impliquent-elles une diversité d'acteurs à différentes échelles ? (EC1)"
],
trame:`<div class="trame-steps">
<div class="ts"><span class="tsn">1</span><div class="ts-body"><span class="ts-lbl">Définitions</span>Définis le <b>principe de subsidiarité</b> et la <b>gouvernance multiniveau</b> (répartition des compétences locale → mondiale).</div></div>
<div class="ts"><span class="tsn">2</span><div class="ts-body"><span class="ts-lbl">Partie 1 — les échelles et leurs instruments</span>Mondial (quotas, compensation carbone — Kyoto 1997 descendant, Paris 2015 ascendant), européen (objectifs chiffrés), national (taxe carbone, bonus-malus), local (circulation alternée, péages urbains).</div></div>
<div class="ts"><span class="tsn">3</span><div class="ts-body"><span class="ts-lbl">Partie 2 — la complémentarité des échelles</span>L'échelon local est pertinent (connaissance du territoire, réactivité). Exemple à mobiliser : la vignette Crit'Air (classification créée par l'État, appliquée par les collectivités).</div></div>
<div class="ts concl"><span class="tsn">→</span><div class="ts-body"><span class="ts-lbl">Conclusion</span>L'efficacité suppose une articulation cohérente entre échelles, du global au local.</div></div>
</div>`,

cards:[
{q:"Comment l'action publique pour l'environnement articule-t-elle différentes échelles ?",
a:`<p><b>L'action publique pour l'environnement s'effectue au travers de différentes échelles : mondiale, européenne, nationale et locale, qui se complètent.</b></p><p>Car au niveau international, elle passe par des sommets et des accords internationaux ; ces décisions se traduisent au niveau communautaire et national par des réglementations conformes aux objectifs généraux ; les pouvoirs publics nationaux conservent des capacités d'initiative (infrastructures routières, ferroviaires) ; et l'échelon local est particulièrement pertinent pour l'application concrète des mesures, car il a une meilleure connaissance des territoires, permettant de cerner le problème et de mobiliser rapidement les acteurs pour des solutions rapides et pragmatiques.</p><p>En effet, dans les transports : quotas d'émissions et compensation carbone au niveau mondial, plans de surveillance et objectifs chiffrés au niveau européen, taxe carbone et bonus-malus au niveau national, circulation alternée, gratuité des transports en commun, péages urbains et vélos en libre-service au niveau local.</p><p>Illustration : la vignette Crit'Air — créée par l'État qui définit la classification des véhicules, utilisée par les collectivités locales pour restreindre la circulation lors des pics de pollution : la règle est nationale, l'application locale.</p>`},
{q:"Qu'est-ce que le principe de subsidiarité ?",
a:`<p><b>Le principe de subsidiarité, qui régit l'Europe, veut que la responsabilité d'une action soit exercée par l'organisation la plus proche de ceux qui sont concernés par cette action.</b></p><p>Car le but est de ne pas déconnecter la prise de décision collective de son exécution.</p><p>En effet, l'autorité centrale ne doit pas effectuer de tâches qui peuvent être effectuées à un niveau décentralisé — c'est le fondement de la gouvernance multiniveau, qui répartit les compétences aux différentes échelles du pouvoir européen (locale, nationale, communautaire).</p><p>Illustration : depuis les années 80, l'État est concurrencé par des acteurs supranationaux (UE, organisations internationales), et les grands accords impliquent une articulation entre échelles de l'action publique.</p>`},
{q:"Quelle différence entre la démarche descendante de Kyoto et la démarche ascendante de Paris ?",
a:`<p><b>On est passé d'une démarche descendante à une démarche ascendante dans les accords climatiques internationaux.</b></p><p>Car le protocole de Kyoto (1997) est caractérisé par une démarche descendante : il est juridiquement contraignant, les pays devant s'engager à respecter des objectifs chiffrés de réduction des gaz à effet de serre.</p><p>En revanche, la conférence de Copenhague (2009) et les accords de Paris (2015) se basent sur une approche ascendante, fondée sur la coopération pour inciter les agents à agir en faveur du climat.</p><p>Illustration : la COP21 s'est traduite par un accord non contraignant — aucune sanction n'est prévue en cas de non-respect, mais il montre une volonté de coopération entre les États et les organisations citoyennes.</p>`}
]},

{num:"7.3", short:"Les instruments : réglementation, taxation, subventions, marchés de quotas",
text:"En prenant l'exemple du changement climatique : connaître les principaux instruments dont disposent les pouvoirs publics pour faire face aux externalités négatives sur l'environnement (réglementation, marchés de quotas d'émission, taxation, subvention à l'innovation verte) ; comprendre que ces différents instruments présentent des avantages et des limites, et que leur mise en œuvre peut se heurter à des dysfonctionnements de l'action publique.",
cours:`
<div class="def"><p><b>Pô climatique :</b> regroupe les mesures prises par les pouvoirs publics pour améliorer le climat et [lutter contre] le réchauffement climatique.</p></div>
<h4>A — La réglementation</h4>
<div class="exo"><div class="exo-t">Exercice — réglementation, taxe, quotas (vidéo)</div>
<p><b>Q1. La réglementation est-elle incitative ?</b><br>Non, la vidéo distingue clairement les instruments. La réglementation repose sur la contrainte, contrairement à la taxation ou au marché des quotas qui, eux, reposent sur l'incitation.</p>
<p><b>Q2. Comment les pouvoirs publics imposent-ils des changements de comportement ?</b><br>Les pouvoirs publics imposent des changements par la fixation de normes. Cela se traduit par : des obligations de faire (ex : obligation d'équiper les véhicules neufs d'un pot catalytique) ; des obligations de ne pas faire (ex : interdiction de dépasser un certain seuil de rejet polluant).</p>
<p><b>Q3. Citez des exemples de normes.</b><br>La vidéo énumère quatre types de normes avec des exemples précis : normes d'émission (ne pas dépasser un seuil de particules fines ou de CO2) ; normes de procédé (obligation de recyclage ou de gestion spécifique des déchets pour les entreprises) ; normes de produit (interdiction des gaz CFC dans les aérosols ou des lampes à incandescence) ; normes de qualité (concernant par exemple la pureté de l'air ou de l'eau).</p>
<p><b>Q4. Quels sont les avantages de la réglementation ?</b><br>Efficacité contre les pollutions dangereuses : c'est une mesure radicale et immédiate. Simplicité de mise en œuvre : il suffit d'un décret ou d'une loi pour qu'elle s'applique. Incitation à l'innovation : en interdisant certains produits, elle oblige les entreprises à trouver des substituts technologiques.</p>
<p><b>Q5. Quelles sont ses limites ?</b><br>Difficulté de dosage : si la norme est trop sévère, elle est contournée ; si elle est trop faible, elle est inutile. Absence de zèle : les agents ne sont pas incités à faire mieux que le seuil fixé par la norme. Coûts de contrôle : vérifier l'application des normes génère des dépenses importantes pour l'État. Injustice économique : les petites entreprises ont plus de mal à s'adapter financièrement que les grandes. Perte de compétitivité : si un pays impose des normes strictes que ses voisins n'appliquent pas, ses entreprises sont pénalisées à l'international.</p></div>
<h5>1 / Avantages</h5>
<p>La réglementation impose des limites, des obligations et des interdictions. En cas de non-respect, le contrevenant s'expose à des sanctions. La mise en place d'amendes suite au non-respect de la réglementation permet d'internaliser au moins une partie de l'externalité, c'est-à-dire le coût lié aux effets de la pollution. Une réglementation se retranscrit au travers de la loi, mais cela engendre des réticences de la part des agents pollueurs. L'objectif de la réglementation est le changement de comportement et l'incitation à l'innovation ; encore faut-il que l'amende soit suffisamment dissuasive pour obtenir l'effet escompté.</p>
<p>On peut distinguer plusieurs sortes de normes :</p>
<ul>
<li><b>Les normes d'émissions :</b> imposant un plafond maximal ne pouvant pas être dépassé sous peine de sanctions administratives, pénales et financières (exemple : la limitation des gaz à effet de serre par les moteurs thermiques) ;</li>
<li><b>Les normes de procédés :</b> imposent aux agents l'usage d'un certain nombre d'équipements reposant sur des technologies moins polluantes (exemple : obligation d'installer des catas sur les voitures) ;</li>
<li><b>Les normes de produits :</b> imposent certaines caractéristiques aux produits avec notamment l'interdiction des ampoules à incandescence ;</li>
<li><b>Les normes de qualité :</b> sur l'air et l'eau font l'objet de contrôles et de mesures appropriés notamment sur les bâtiments ou encore sur les produits électroménagers.</li>
</ul>
<h5>2 / Les limites</h5>
<p>D'un PDV économique, l'application d'une réglementation se fait de manière uniforme à tous les agents sans prendre en compte les différents coûts relatifs aux changements de comportements ce qui peut mettre en difficulté les plus précaires.</p>
<p>L'action publique peut s'avérer inefficace par exemple lorsque la loi et/ou les annonces ministérielles se font trop tardivement notamment dans leur mise en application. De plus certaines réglementations peuvent être contournées ou assorties d'exceptions comme par exemple pour l'urbanisation du littoral ou en montagne.</p>
<p>Les lobbys peuvent mettre en difficulté la mise en place de lois comme par exemple sur l'éco-taxe sur les poids lourds.</p>
<p>Le <b>paradoxe de Jevons</b> montre qu'à mesure de l'amélioration des technologies grâce à des nouvelles ressources, la consommation de cette ressource augmente alors que l'introduction des nouvelles technologies doit théoriquement faire baisser son utilisation. En d'autres termes plus une énergie est maîtrisée, plus sa consommation augmente car dispo en plus grande qté. Ainsi au travers de la croissance de la production, l'effet positif généré par l'innovation peut être relativisé voire supprimé par l'effet quantité.</p>
<div class="exo"><div class="exo-t">Exercice — schéma</div>
<p><b>a/</b> Limite : surconsommation à la relance. Avantage : moins de production en continu.</p>
<p><b>b/</b> Limites : coût de la nourriture végétarienne. Avantage : limite la consommation de viande et ouvre les esprits.</p>
<p><b>c/</b> Limite : restriction de la production au bout d'un certain seuil d'émission. Avantage : limitation des émissions de CO2.</p>
<p><b>d/</b> Limite : restriction du champ des possibilités pour le consommateur et donc moins de compétitivité prix. Avantage : moins d'émissions de CO2 évitables.</p></div>

<h4>B — La fiscalité, taxation, subvention</h4>
<div class="exo"><div class="exo-t">Exercice — suite de la vidéo</div>
<p><b>Q6 Qu'est-ce que la taxation ?</b><br>La taxation est un prélèvement obligatoire effectué par les pouvoirs publics sur les activités polluantes. On parle souvent de «&nbsp;taxe pigouvienne&nbsp;» ou d'écotaxe. L'objectif est de forcer les agents économiques à intégrer dans leurs calculs les coûts des dommages qu'ils causent à l'environnement.</p>
<p><b>Q7 Citez des exemples de taxes.</b><br>L'écotaxe : terme général pour les taxes environnementales. Le bonus-malus écologique : appliqué lors de l'achat de voitures neuves. Le prix augmente pour les véhicules polluants (malus) et diminue pour les véhicules propres (bonus).</p>
<p><b>Q8 Qu'est-ce que le principe du pollueur-payeur ?</b><br>C'est le principe selon lequel celui qui est à l'origine d'une pollution (externalité négative) doit en supporter le coût financier. L'idée est : «&nbsp;Je pollue, donc je paye&nbsp;».</p>
<p><b>Q9 Comment les entreprises peuvent-elles réagir à la taxation ?</b><br>Face à une taxe, une entreprise a plusieurs choix (arbitrages) : mettre en place des activités de dépollution ; modifier son système productif en innovant pour moins polluer ; choisir de ne rien changer et simplement payer la taxe.</p>
<p><b>Q10 Pourquoi la taxation est une politique incitative ?</b><br>Elle est dite incitative car, contrairement à la réglementation qui impose, elle laisse une liberté de choix aux agents. En modifiant les prix, elle rend la pollution plus coûteuse, ce qui «&nbsp;pousse&nbsp;» naturellement les entreprises et les consommateurs vers des comportements plus écologiques pour faire des économies.</p>
<p><b>Q11 Quels sont les avantages ?</b><br>Efficacité économique : elle laisse le marché prendre les décisions les plus rationnelles. Innovation : elle incite à créer des technologies moins énergivores. Le double dividende : en plus de réduire la pollution, la taxe rapporte de l'argent à l'État, qui peut alors l'utiliser pour baisser d'autres impôts (comme les charges sur le travail pour réduire le chômage).</p>
<p><b>Q12 Quelles sont les limites ?</b><br>Difficulté de dosage : si la taxe est trop faible, elle n'a aucun effet ; si elle est trop élevée, elle peut bloquer l'économie. Risque de délocalisation : si un pays taxe et pas ses voisins, les entreprises peuvent partir produire ailleurs (stratégies non coopératives). Inégalités sociales : la taxe pèse plus lourdement sur le budget des ménages modestes que sur celui des ménages aisés (injustice sociale).</p></div>
<h5>1 / La taxation</h5>
<p><b>a - Les avantages</b></p>
<p>La taxation fait partie des politiques incitatives et non-contraignantes. Par ce biais les pouvoirs publics indiquent aux agents qu'ils peuvent avoir certains comportements mais qu'en contrepartie ils devront s'acquitter d'une taxe au moment de l'achat comme par exemple sur l'achat d'un véhicule neuf avec le principe du «&nbsp;bonus&nbsp;» «&nbsp;malus&nbsp;». Ainsi la taxation permet un double dividende :</p>
<ul><li>une modification du comportement ;</li>
<li>engendrer une augmentation des recettes fiscales grâce à ceux qui ne modifient pas leurs habitudes.</li></ul>
<p><b>Arthur C. Pigou</b> émet donc l'idée d'internaliser les coûts sociaux de la production avec la logique du «&nbsp;pollueur-payeur&nbsp;».</p>
<div class="def"><p><b>Taxe :</b> prélèvement fiscal monétaire obligatoire effectué par l'État et/ou les collectivités locales.</p></div>
<p class="lacune">(Mentions du cours : «&nbsp;exo taxe carbone suédoise&nbsp;», «&nbsp;exo impact fiscalité sur budget ménages&nbsp;» — exercices non rédigés dans la fiche.)</p>
<p><b>b - Limites</b></p>
<p>Pour les classiques, l'intervention de l'État peut être nuisible car il est difficile d'établir le bon niveau de taxe. En effet, si elle est trop basse elle perd son caractère incitatif ; si elle est trop haute, cela décourage la production. De plus, une taxe a un caractère injuste socialement car elle pèse plus sur les ménages les plus précaires, notamment quand elle est forfaitaire.</p>
<p>Il convient d'ajouter que celui qui paye la taxe n'est pas forcément l'émetteur de la pollution. En effet, les entreprises transfèrent une partie de ce montant dans le prix de vente pour que la charge soit supportée par les ménages.</p>
<h5>2 / Les subventions vertes</h5>
<p><b>a - Avantages</b></p>
<div class="def"><p><b>Subvention :</b> aide financière ou matérielle émanant des autorités publiques à destination des consommateurs ou des producteurs.</p></div>
<p>Les subventions à l'innovation visent à internaliser les externalités positives en assurant la prise en charge par les collectivités d'une partie du surcoût privé supporté par le producteur. Exemple : une compagnie décide d'acheter des véhicules électriques. Son coût de production augmente alors que la décision à l'origine de ce choix reposait sur une diminution du coût social lié au transport de passagers.</p>
<p>Les subventions sont des taxes négatives et permettent d'encourager les investissements. La solution optimale consiste donc à combiner ces instruments de subvention directe à la R et D afin de promouvoir les technologies vertes.</p>
<p><b>b - Limites</b></p>
<p>Le champ des subventions est à questionner. En effet lorsqu'elles sont globales et génériques, elles risquent de correspondre à un saupoudrage et lorsqu'elles se focalisent sur des technologies spécifiques ce ciblage limite les capacités globales.</p>
<p>La fiscalité environnementale oblige les assujettis à la taxe à payer sur l'ensemble de leurs émissions. Un marché des quotas pourrait être plus efficace en ne pénalisant que les plus pollueurs.</p>

<h4>C — Les quotas</h4>
<p class="lacune">… manque du cours (début de la partie non rédigé dans la fiche d'origine)</p>
<p>Le fonctionnement du marché des quotas en Europe est inefficace, des phases de son fonctionnement ont connu des prix trop bas, la période 2005-2007 est marquée par une attribution trop généreuse de quotas ce qui a conduit à un crack carbone. À partir de 2008 des efforts ont été faits pour restreindre leur qté, mais les effets de la crise des subprimes ont généré une baisse de l'activité et donc une baisse de la demande. On peut noter qu'à partir de 2017, l'UE tente de faire remonter les prix et sauver le marché du carbone en [restreignant] encore les quotas d'émissions. Cela se traduit par une remontée des cours mais cela reste insuffisant pour engendrer un changement.</p>`,

trame:`<div class="trame-steps">
<div class="ts"><span class="tsn">1</span><div class="ts-body"><span class="ts-lbl">Définitions</span>Pose l'<b>externalité négative</b> (coût social &gt; coût privé) et annonce les 4 instruments : réglementation, taxation, subvention verte, marché de quotas.</div></div>
<div class="ts"><span class="tsn">2</span><div class="ts-body"><span class="ts-lbl">Partie 1 — contrainte et incitation</span><b>Réglementation</b> (normes : radicale, immédiate, mais dosage difficile, absence de zèle, coûts de contrôle) ; <b>taxation</b> (Pigou, pollueur-payeur, double dividende, mais injustice sociale, incidence fiscale).</div></div>
<div class="ts"><span class="tsn">3</span><div class="ts-body"><span class="ts-lbl">Partie 2 — incitation et marché</span><b>Subventions vertes</b> (internalisent les externalités positives, mais saupoudrage) ; <b>marché de quotas</b> (l'échec européen : attribution trop généreuse 2005-2007, crack carbone). Dysfonctionnements + <b>paradoxe de Jevons</b> (l'effet quantité annule l'effet de l'innovation).</div></div>
<div class="ts concl"><span class="tsn">→</span><div class="ts-body"><span class="ts-lbl">Conclusion</span>Chaque instrument a des limites : leur combinaison (policy-mix) est plus efficace qu'un instrument isolé.</div></div>
</div>`,
