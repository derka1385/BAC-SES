{num:"9.4", short:"Le numérique : frontières du travail, relations d'emploi, polarisation",
text:"Comprendre comment le numérique brouille les frontières du travail (télétravail, travail / hors travail), transforme les relations d'emploi et accroît les risques de polarisation des emplois.",
cours:`
<h4>III — L'impact de l'innovation numérique sur les caractéristiques de l'emploi</h4>
<div class="exo"><div class="exo-t">Exercice vidéo — numérique</div>
<p><b>1- Qu'est-ce que le travail numérique ?</b><br>Le travail numérique correspond à l'ensemble des activités productives qui mobilisent les technologies de l'information et de la communication (TIC).</p>
<p><b>2- Dans quelles activités le travail numérique se développe-t-il ?</b><br>Il se développe dans tous les secteurs d'activité : l'industrie avec le machinisme et la robotisation, les bureaux avec l'utilisation des ordinateurs personnels, ainsi que dans les services à la personne via les robots domestiques et les assistants vocaux.</p>
<p><b>3- Qu'est-ce que le télétravail ?</b><br>Le télétravail permet au salarié d'effectuer tout ou partie de ses missions pour son employeur depuis son domicile, ou de tout autre lieu en dehors des locaux de l'entreprise, grâce aux TIC.</p>
<p><b>4- Qu'est-ce que le micro-travail ?</b><br>Le micro-travail consiste en une multitude de petites tâches (appelées HITs) rémunérées quelques centimes chacune, réalisées par des individus durant leurs moments de liberté.</p>
<p><b>5- Quelles frontières le travail numérique brouille-t-il ?</b><br>Le travail numérique rend plus floues les frontières entre la vie professionnelle et la vie privée, ainsi qu'entre le travail salarié et le travail non salarié.</p>
<p><b>6- Comment le travail numérique peut-il transformer les relations d'emploi ?</b><br>Il peut favoriser une coopération horizontale et des relations d'égal à égal (comme dans les Fab Labs ou le coworking) ou, au contraire, créer une dépendance économique forte pour les micro-entrepreneurs qui cumulent les inconvénients du salariat sans en avoir la protection sociale.</p>
<p><b>7- Qu'est-ce que la polarisation des emplois ?</b><br>C'est un phénomène où les emplois se concentrent dans les activités les plus qualifiées (ingénieurs, cadres) et les moins qualifiées (saisie de données), au détriment des emplois intermédiaires routiniers qui sont automatisés.</p></div>

<h4>A) L'impact du télétravail, travail, hors travail</h4>
<div class="def">
<p><b>Numérique au sens strict :</b> introduction de technologies de l'information et de la communication (internet, informatique).</p>
<p><b>Numérique au sens large :</b> on ajoute les robots, l'analyse des big data et l'IA.</p>
<p><b>Travail numérique :</b> regroupe les activités qui mobilisent les technologies de l'information et de la communication.</p></div>
<p>Le numérique change les caractéristiques de poste et les compétences attendues (+ de créativité, d'autonomie, etc.). Il a engendré une demande de performance pouvant engendrer une détérioration des conditions de travail, augmentant le mal-être au travail, les dépressions, et les suicides.</p>
<p>Les frontières du travail séparent d'une part le lieu de travail du domicile et d'autre part le temps de travail du temps de repos, mais ces frontières sont de plus en plus floues. En effet, les technologies numériques bouleversent à la fois les modes de vie et les activités économiques. L'information, les réseaux sociaux, la géolocalisation ou encore l'IA se mettent au service de la vie perso et professionnelle. Les frontières séparant ces deux activités sont donc brouillées.</p>
<p>Les frontières entre le travail sont affectées dès que les notifications apparaissent sur le téléphone qui est à portée de moi en permanence. Le travail des influenceurs est une activité hors travail qui devient un travail quand il y a du succès et une rémunération. L'influenceur est donc amené à faire du placement de produit.</p>
<p>La pandémie a engendré une modification dans l'organisation du travail en faisant du télétravail non plus une exception mais une règle, ce qui a eu des effets très contrastés. Le volume horaire des cadres s'est trouvé augmenté au détriment de la famille, mais il peut constituer une forme de souplesse dans la gestion du quotidien et permet de travailler en décalé. L'utilisation du téléphone portable permet d'être connecté en permanence et de traiter ainsi les demandes en permanence même en temps de famille. 54&nbsp;% des cadres français travaillent hors de leur bureau plus de la moitié du temps et 51&nbsp;% d'entre eux consultent leurs mails régulièrement quand ils sont couchés.</p>
<div class="exo"><div class="exo-t">Exercice — horaires de travail</div>
<p><b>1/ À l'aide du document, comparez les horaires de travail atypiques des cadres et des ouvriers.</b><br>Les cadres et professions intellectuelles supérieures sont davantage concernés par certains horaires atypiques que les ouvriers, mais pas les mêmes. En effet, les cadres travaillent beaucoup plus souvent le soir (34&nbsp;% contre 20&nbsp;%) et surtout à domicile (41&nbsp;% contre seulement 2&nbsp;% pour les ouvriers). Ils sont aussi un peu plus nombreux à travailler le dimanche (18&nbsp;% contre 13&nbsp;%). En revanche, les ouvriers sont davantage exposés aux horaires atypiques liés à la contrainte de production : ils travaillent plus souvent la nuit (13&nbsp;% contre 7&nbsp;% pour les cadres). Pour le samedi, les proportions sont proches mais légèrement en faveur des cadres (30&nbsp;% contre 29&nbsp;%). Ainsi, les cadres ont des horaires atypiques plus liés à l'autonomie et à la flexibilité du travail, tandis que les ouvriers subissent davantage des horaires contraints, notamment la nuit.</p>
<p><b>2/ À l'aide du document et de vos connaissances, montrez que le numérique brouille les frontières travail/hors-travail.</b><br>Le document montre que 41&nbsp;% des cadres travaillent à domicile, ce qui illustre déjà une porosité entre vie professionnelle et vie personnelle. Cette tendance est fortement accentuée par le développement du numérique. En effet, les outils numériques (ordinateurs portables, smartphones, messageries professionnelles) permettent de travailler à distance et à tout moment. Un salarié peut ainsi répondre à ses e-mails le soir, le week-end ou pendant ses vacances, ce qui prolonge le temps de travail en dehors des horaires classiques. De plus, le télétravail, facilité par le numérique, supprime la séparation physique entre le lieu de travail et le domicile. Cela rend plus difficile la distinction entre temps de travail et temps de repos. Enfin, cette connexion permanente peut entraîner une forme de pression implicite à rester disponible, notamment chez les cadres, ce qui renforce encore le brouillage des frontières entre travail et hors-travail.</p></div>

<h4>B) Le numérique transforme les relations d'emploi et la polarisation de l'emploi</h4>
<h5>1 / La transformation des relations d'emploi</h5>
<p>La multiplication des plateformes interroge sur le type d'emplois développé. Les travailleurs sont considérés comme des indépendants par les plateformes mais avec des caractéristiques qui pourraient être assimilées à des salariés. Pour l'employeur, considérer des employés comme des indépendants permet de reporter une partie du coût de production sur les travailleurs notamment des cotisations sociales, patronales, les équipements utilisés (voiture, vélo, ordinateur), le coût des congés payés, etc. Les relations sont constituées de liens légaux contractuels. Le numérique les affecte en remettant en cause le statut de salarié ou en facilitant le processus d'externalisation.</p>
<p>L'organisation syndicale est davantage compliquée du fait de la remise en cause du statut du travailleur. De plus, le fonctionnement des plateformes tend à développer la concurrence entre les travailleurs plutôt que la solidarité et la coopération, ce qui engendre une forme d'isolement. Les plateformes numériques s'appuient sur le régime des micro-entrepreneurs marqués par une relation de dépendance dans une relation de travail ultra flexible.</p>
<p>Pour les travailleurs indépendants, il y a des avantages comme des inconvénients de statut notamment la plus grande flexibilité. Mais le numérique brouille des frontières entre le travail et l'emploi. Les travailleurs du clic (Uber Eat, Deliveroo) étaient 250 000 en France en 2019 à se connecter occasionnellement à des plateformes de travail payés à la tâche avec des commandes variées et pouvant être réalisées en télétravail. Mais le travail du click n'est pas considéré par l'INSEE comme un travail car la rémunération n'est qu'un complément de revenus et car le travail n'est ni encadré ni reconnu en tant que tel. Le travailleur ne bénéficie donc pas de la protection du droit du travail et ne cotise pas, l'empêchant de bénéficier d'une protection sociale.</p>
<p>Les actions juridiques se multiplient pour une requalification des contrats de services en contrats de travail salarié. En 2020, Deliveroo a été condamné aux prud'hommes pour travail déguisé. Au Royaume-Uni en 2021, UBER a été dans l'obligation d'accorder un statut juridique particulier à ses chauffeurs, à mi-chemin entre le salariat et l'indépendant. En mars 2026 une marche a été intentée contre Deliveroo et Uber pour «&nbsp;traite d'être humain&nbsp;».</p>
<h5>2 / La polarisation de l'emploi</h5>
<p>Dans les secteurs faisant appel à un travail très qualifié, le numérique apparaît comme un amplificateur des transformations du travail liées aux nouvelles formes de management (autonomie de l'individu, coordination grâce aux outils de communication, aux outils coopératifs, etc.). Le numérique accompagne le développement de l'externalisation. Ainsi sous l'effet de la déréglementation, de nouveaux modèles apparaissent avec notamment l'ubérisation.</p>
<p>Contre le mythe du remplacement technologique, il faut se méfier de l'idée selon laquelle l'automatisation et le développement des IA entraîneraient la disparition du travail peu qualifié. La production des services numériques fait appel au travail peu qualifié et précarisé en réalisant des tâches parcellaires visant à alimenter les algorithmes.</p>
<p>Certains emplois résistent à une forme d'automatisation. Celle-ci se renforce surtout sur des emplois fondés sur les répétitions des tâches comme des emplois intermédiaires mais plus difficilement sur des emplois reposant sur :</p>
<ul><li>les tâches manuelles peu exposées aux pressions concurrentielles liées à la mondialisation (exemple : soin à la personne, l'emploi domestique, etc.) ;</li>
<li>les tâches peu routinières qui demandent un important contenu cognitif associé à des métiers qualifiés (exemple : médecin, travail artistique, etc.).</li></ul>
<p>Le progrès technique est donc biaisé en faveur des tâches les moins routinières entraînant une polarisation de l'emploi. Cependant à long terme l'IA pourrait permettre d'automatiser des nouvelles tâches plus denses en contenu cognitif atténuant la polarisation de l'emploi.</p>`,
savoir:[
"<b>Définitions :</b> numérique au sens strict (TIC) / au sens large (+ robots, big data, IA), travail numérique, télétravail (missions effectuées hors des locaux grâce aux TIC), micro-travail (HITs rémunérées quelques centimes), polarisation des emplois (concentration sur les plus qualifiés et les moins qualifiés, au détriment des intermédiaires routiniers automatisés).",

"<b>La transformation des relations d'emploi par les plateformes :</b> travailleurs considérés comme indépendants mais aux caractéristiques de salariés ; l'employeur reporte les coûts (cotisations, équipements, congés payés) ; concurrence entre travailleurs plutôt que solidarité → isolement, syndicalisation difficile ; dépendance dans une relation ultra flexible. Chiffre : 250 000 travailleurs du clic en France en 2019, non reconnus par l'INSEE (pas de droit du travail ni de protection sociale).",

{num:"9.5", short:"Le travail, source d'intégration sociale… remise en cause",
text:"Comprendre que le travail est source d'intégration sociale et que certaines évolutions de l'emploi (précarisation, taux persistant de chômage élevé, polarisation de la qualité des emplois) peuvent affaiblir ce pouvoir intégrateur.",
cours:`
<h4>IV — Le rôle intégrateur du travail est-il remis en cause (confère chapitre «&nbsp;liens sociaux&nbsp;» première)</h4>
<div class="def"><p><b>Lien social :</b> ensemble des relations qui unissent des individus faisant partie d'un même groupe social et/ou qui établissent des règles sociales entre individus ou groupes sociaux différents.</p>
<p>(Liens forts : proches - amis - ceux qu'on choisit pour maintenir les liens / liens faibles : ceux qu'on choisit par intérêt comme des collègues etc.)</p></div>
<p>Dans les sociétés modernes, le travail et surtout l'exercice d'un emploi sont sources de liens sociaux car l'individu peut nouer des relations aux autres et avoir un sentiment d'utilité sociale. Les liens sociaux permettent d'assurer la cohésion sociale et l'intégration des individus, soit par le partage de valeurs (solidarité mécanique), soit par la reconnaissance sociale (solidarité organique).</p>
<h4>A) Le travail, facteur intégrateur</h4>
<div class="exo"><div class="exo-t">Exercice — aimer le travail</div>
<p><b>8. Signification de la donnée entourée :</b><br>La donnée entourée (soit de 26&nbsp;%) signifie que selon un sondage Ifop de 2016, 26&nbsp;% des Français se déclarant «&nbsp;heureux au travail&nbsp;» affirment que c'est la passion et l'intérêt pour leur métier qui les rendent principalement heureux.</p>
<p><b>9. Le travail : source de liens sociaux et d'épanouissement personnel.</b><br>Le document montre que le travail remplit une double fonction pour l'individu : une source de «&nbsp;lien social&nbsp;» — pour 20&nbsp;% des travailleurs interrogés, le bonheur provient des relations avec les collègues ou des personnes rencontrées dans le cadre professionnel ; une occasion d'épanouissement personnel — le travail permet de se trouver soi-même, notamment par la passion pour son métier (26&nbsp;% des interrogés), le sentiment de disposer de liberté et d'autonomie (23&nbsp;%) ou encore la satisfaction d'être utile à la société (6&nbsp;%).</p></div>
<p>Le travail est facteur d'intégration sociale. Il permet de structurer son temps, d'entretenir des liens sociaux. Le travail façonne l'identité d'autant que le métier confère un statut social. L'identité professionnelle est une composante de l'identité sociale. Le travail est un lieu de socialisation secondaire qui entraîne l'acquisition de normes et de valeurs. Les collectifs de travail sont donc des lieux de sociabilité. Le facteur de travail est source d'utilité sociale car il permet de consommer.</p>
<div class="def"><p><b>Intégration :</b> quand un individu occupe une place reconnue dans la société.</p></div>
<p>Pour <b>DURKHEIM</b>, pour qu'une société soit intégrée il faut qu'il y ait des liens entre ses membres. Or pour lui, la société connaît une très forte division du travail, ce qui génère une forte dépendance entre les individus. La solidarité se construit sur la complémentarité du travail de tous.</p>
<p><b>Serge PAUGAM</b> présente le travail comme nécessaire à la satisfaction des besoins dans au moins 3 dimensions de l'individu :</p>
<ul><li>l'épanouissement dans l'acte de travail lui-même ;</li>
<li>la satisfaction à la rétribution monétaire ;</li>
<li>la reconnaissance par les autres du travail effectué.</li></ul>

<h4>B) Un rôle remis en cause</h4>
<h5>1 / La précarisation de l'emploi</h5>
<div class="def"><p><b>Désaffiliation :</b> processus traduisant le passage de l'individu de l'intégration sociale à l'exclusion sociale avec un problème d'accès à la propriété voire au logement, au crédit bancaire ainsi qu'aux activités sociales et loisirs.</p></div>
<p>Les pertes de revenus liées à des périodes de chômage peuvent conduire à une diminution des rencontres et avoir des conséquences négatives sur la famille (10&nbsp;% des divorces). La situation de précarisation a souvent des effets similaires aussi bien sur le réseau amical que familial. Cela s'explique par des tensions et des incompréhensions qui peuvent être liées aux revenus mais également à la situation sociale.</p>
<p>Selon <b>Robert CASTEL</b>, le processus de fragilisation peut être analysé par une dégradation des liens sociaux où l'individu évolue progressivement d'une zone d'intégration (stabilité sociale) vers une zone de vulnérabilité avec un risque de finir dans une zone de désaffiliation. Les individus en situation de vulnérabilité se sentent disqualifiés socialement à leurs propres yeux (perte de confiance, démotivation, sentiment d'inutilité) mais également par le regard des autres (stigmatisation, discrimination), ce qui rend d'autant plus difficile le travail de l'État dans sa volonté de relier les individus fragiles avec le reste de la population.</p>
<h5>2 / Le taux de chômage élevé</h5>
<p>À partir du milieu des années 70 on assiste en France métropolitaine à une augmentation du nombre de chômeurs qui passe de 835k en 75 à presque 3 millions entre 2013 et 2015 pour atteindre en 2026 3 295 100 [chômeurs]. La France se caractérise par un taux de chômage élevé &gt; à 8&nbsp;% depuis 1984. Un taux de chômage élevé entraîne mécaniquement une hausse du nombre de personnes exclues du travail rémunéré, ce qui crée une insécurité financière et le risque d'être touché par la pauvreté (le seuil de pauvreté en France est placé à un revenu disponible de 1280€ net/mois pour une personne seule).</p>
<h5>3 / La polarisation de l'emploi : des effets sur la qualité de l'emploi</h5>
<div class="rem"><p>⚠ <b>Consigne du cours :</b> apprendre la qualité de l'emploi pour le bac.</p></div>
<p>La polarisation de la qualité des emplois se manifeste par un écart croissant de la qualité des emplois. Ainsi les conditions de travail, l'accès à la formation, l'horizon de carrière, etc. dans les tâches les moins valorisées sont moins satisfaisants que pour les autres. À cette mauvaise qualité se conjugue une insatisfaction liée à la moindre reconnaissance des emplois de moindre qualité, ce qui impacte l'estime de soi. On peut toutefois noter que pendant la COVID et le confinement, un lexique plus valorisant était utilisé avec les expressions «&nbsp;travailleurs de première ligne&nbsp;» ou bien «&nbsp;travailleurs essentiels au quotidien&nbsp;». À l'autre extrémité de cette polarisation, les travailleurs dont l'emploi est de grande qualité (horizontale, verticale, etc.) obtiennent une forte reconnaissance, ce qui consolide leurs liens sociaux. La qualité du travail se cumule avec la stabilité de l'emploi pour renforcer les liens sociaux ou au contraire les affaiblir.</p>`,
savoir:[
"<b>Pourquoi le travail intègre — les mécanismes :</b> structure le temps, entretient des liens sociaux, façonne l'identité (le métier confère un statut social, l'identité professionnelle est une composante de l'identité sociale), lieu de socialisation secondaire (normes et valeurs), source d'utilité sociale (permet de consommer).",
"<b>Auteurs à citer :</b> Durkheim (la forte division du travail génère une dépendance entre individus ; la solidarité se construit sur la complémentarité du travail de tous — solidarité mécanique par les valeurs / organique par la reconnaissance) ; Serge Paugam (3 dimensions : épanouissement dans l'acte de travail, satisfaction de la rétribution monétaire, reconnaissance par les autres) ; Robert Castel (zones d'intégration → vulnérabilité → désaffiliation).",

trame:`<div class="trame-steps">
<div class="ts"><span class="tsn">1</span><div class="ts-body"><span class="ts-lbl">Définitions</span>Définis le <b>lien social</b>, l'<b>intégration</b> (place reconnue dans la société) et la <b>désaffiliation</b> (Castel). Pose la thèse : le travail intègre, mais ce pouvoir est aujourd'hui fragilisé.</div></div>
<div class="ts"><span class="tsn">2</span><div class="ts-body"><span class="ts-lbl">Partie 1 — le travail intègre</span>Il structure le temps, crée des liens, façonne l'identité, socialise et donne une utilité sociale. <b>Durkheim</b> (solidarité organique par la division du travail), <b>Paugam</b> (3 dimensions : épanouissement, rétribution, reconnaissance).</div></div>
<div class="ts"><span class="tsn">3</span><div class="ts-body"><span class="ts-lbl">Partie 2 — ce pouvoir est affaibli</span>Trois évolutions : <b>précarisation</b> (perte de revenus, isolement), <b>chômage persistant élevé</b> (taux &gt; 8&nbsp;% depuis 1984 → désaffiliation, disqualification sociale), <b>polarisation de la qualité des emplois</b> (moindre reconnaissance → estime de soi).</div></div>

{ec:"EC1",q:"Le travail est-il (toujours / encore) facteur d'intégration sociale ? (et variantes)",body:`<p><span class="pt">Intro :</span> définir intégration et lien social.</p><p><span class="pt">I.</span> Oui, le travail intègre : revenu, liens, identité, socialisation (Durkheim, Paugam).</p><p><span class="pt">II.</span> Mais ce pouvoir est fragilisé : précarisation, chômage durable, polarisation (Castel : désaffiliation).</p><p><span class="pt">Concl :</span> le travail demeure intégrateur, mais de façon plus inégale et fragile.</p>`},

cards:[
{q:"Pourquoi le travail est-il source d'intégration sociale ?",
a:`<p><b>Le travail est facteur d'intégration sociale car il permet de structurer son temps, d'entretenir des liens sociaux et de se voir reconnaître une place dans la société.</b></p><p>Car le travail façonne l'identité, d'autant que le métier confère un statut social : l'identité professionnelle est une composante de l'identité sociale. Le travail est aussi un lieu de socialisation secondaire qui entraîne l'acquisition de normes et de valeurs — les collectifs de travail sont des lieux de sociabilité — et une source d'utilité sociale car il permet de consommer.</p><p>En effet, pour Durkheim, pour qu'une société soit intégrée il faut des liens entre ses membres : la forte division du travail génère une forte dépendance entre les individus, et la solidarité se construit sur la complémentarité du travail de tous. Serge Paugam présente le travail comme nécessaire à la satisfaction des besoins dans 3 dimensions : l'épanouissement dans l'acte de travail lui-même, la satisfaction de la rétribution monétaire, la reconnaissance par les autres du travail effectué.</p><p>Illustration (Ifop 2016) : parmi les Français heureux au travail, 26&nbsp;% le sont par passion du métier, 23&nbsp;% par le sentiment de liberté et d'autonomie, 20&nbsp;% par les relations avec les collègues et 6&nbsp;% par la satisfaction d'être utile à la société.</p>`},
{q:"Dans quelle mesure les évolutions de l'emploi affaiblissent-elles le pouvoir intégrateur du travail ?",
a:`<p><b>Trois évolutions de l'emploi affaiblissent le pouvoir intégrateur du travail : la précarisation, le taux de chômage persistant élevé et la polarisation de la qualité des emplois.</b></p><p>Car les pertes de revenus liées au chômage peuvent conduire à une diminution des rencontres et avoir des conséquences négatives sur la famille (10&nbsp;% des divorces) comme sur le réseau amical, du fait de tensions et d'incompréhensions liées aux revenus et à la situation sociale.</p><p>En effet, la France se caractérise par un taux de chômage supérieur à 8&nbsp;% depuis 1984 (de 835 000 chômeurs en 1975 à près de 3 millions en 2013-2015, et 3 295 100 en 2026) : un chômage élevé entraîne mécaniquement une hausse du nombre de personnes exclues du travail rémunéré, créant insécurité financière et risque de pauvreté (seuil : 1280€ net/mois pour une personne seule). Quant à la polarisation de la qualité des emplois, elle creuse l'écart : conditions de travail, accès à la formation et horizon de carrière moins satisfaisants dans les tâches les moins valorisées, avec une moindre reconnaissance qui impacte l'estime de soi.</p><p>Illustration théorique : selon Robert Castel, l'individu évolue progressivement d'une zone d'intégration (stabilité) vers une zone de vulnérabilité, avec un risque de finir dans une zone de désaffiliation.</p>`},
{q:"Qu'est-ce que la désaffiliation selon Robert Castel ?",
a:`<p><b>La désaffiliation est le processus traduisant le passage de l'individu de l'intégration sociale à l'exclusion sociale, avec un problème d'accès à la propriété voire au logement, au crédit bancaire ainsi qu'aux activités sociales et loisirs.</b></p><p>Car selon Robert Castel, le processus de fragilisation s'analyse comme une dégradation des liens sociaux : l'individu évolue progressivement d'une zone d'intégration (stabilité sociale) vers une zone de vulnérabilité, avec un risque de finir dans une zone de désaffiliation.</p><p>En effet, les individus en situation de vulnérabilité se sentent disqualifiés socialement à leurs propres yeux (perte de confiance, démotivation, sentiment d'inutilité) mais également par le regard des autres (stigmatisation, discrimination).</p><p>Conséquence : cela rend d'autant plus difficile le travail de l'État dans sa volonté de relier les individus fragiles avec le reste de la population.</p>`},
{q:"Comment la polarisation de la qualité des emplois affecte-t-elle l'intégration ?",
a:`<p><b>La polarisation de la qualité des emplois se manifeste par un écart croissant de la qualité des emplois, qui renforce les liens sociaux des uns et affaiblit ceux des autres.</b></p><p>Car dans les tâches les moins valorisées, les conditions de travail, l'accès à la formation et l'horizon de carrière sont moins satisfaisants que pour les autres ; à cette mauvaise qualité se conjugue une insatisfaction liée à la moindre reconnaissance de ces emplois, ce qui impacte l'estime de soi.</p><p>En effet, à l'autre extrémité de cette polarisation, les travailleurs dont l'emploi est de grande qualité obtiennent une forte reconnaissance, ce qui consolide leurs liens sociaux : la qualité du travail se cumule avec la stabilité de l'emploi pour renforcer les liens sociaux ou au contraire les affaiblir.</p><p>Nuance du cours : pendant la COVID et le confinement, un lexique plus valorisant était utilisé pour les emplois peu valorisés, avec les expressions «&nbsp;travailleurs de première ligne&nbsp;» ou «&nbsp;travailleurs essentiels au quotidien&nbsp;».</p>`}
]}

let _imgRange = null;
function imgBtnDown(e){
  e.preventDefault();   // garde le focus/la sélection dans le bloc éditable
  const sel = window.getSelection();
  if(sel && sel.rangeCount && _focusedZone && _focusedZone.contains(sel.anchorNode)){
    _imgRange = sel.getRangeAt(0).cloneRange();
  } else { _imgRange = null; }

function pickImage(){
  if(!editMode) return;
  if(!_focusedZone){ alert('Clique d\'abord dans le bloc de cours, à l\'endroit où tu veux insérer l\'image.'); return; }
  const inp = document.getElementById('img-input');
  if(inp){ inp.value=''; inp.click(); }
}
function handleImageFile(file){
  if(!file || !/^image\//.test(file.type)) return;
  setEditStatus('Image…');
  const reader = new FileReader();
  reader.onload = function(){
    const img = new Image();
    img.onload = function(){
      const MAX = 1000;
      let w = img.width, h = img.height;
      if(w > MAX){ h = Math.round(h * MAX / w); w = MAX; }
      let url;
      try{
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        url = cv.toDataURL('image/jpeg', 0.82);
      }catch(e){ url = reader.result; }
      insertImageDataUrl(url);
    };
    img.onerror = function(){ insertImageDataUrl(reader.result); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function insertImageDataUrl(url){
  const zone = _focusedZone || document.querySelector('#content [data-ekey]');
  if(!zone){ return; }
  const tag = '<img src="'+url+'" style="max-width:100%;height:auto;border-radius:8px;display:block;margin:12px auto">';
  zone.focus();
  let ok = false;
  try{
    if(_imgRange){ const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(_imgRange); }
    ok = document.execCommand('insertHTML', false, tag);
  }catch(e){}
  if(!ok){ zone.insertAdjacentHTML('beforeend', tag); }
  _imgRange = null;
  scheduleSaveEdit(zone);
  setEditStatus('Image ajoutée ✓');
}

function objMastery(ci,oi){
  const n = CH[ci].objectifs[oi].cards.length;
  let rated=0, sum=0;
  for(let k=0;k<n;k++){
    const v = RATINGS[ci+'-'+oi+'-'+k];
    if(v!==undefined){ rated++; sum+=v; }
  }
  if(!rated) return {cls:'', pill:'', label:'Non évalué', rated, n};
  const avg = sum/rated;
  if(avg>=1.5) return {cls:'m-good', pill:'m-good-p', label:'Acquis',   rated, n};
  if(avg>=0.75) return {cls:'m-mid', pill:'m-mid-p',  label:'Moyen',    rated, n};
  return {cls:'m-bad', pill:'m-bad-p', label:'À revoir', rated, n};
}
function refreshMastery(){
  CH.forEach((c,ci)=>c.objectifs.forEach((o,oi)=>{
    const m = objMastery(ci,oi);
    const dot = document.getElementById(`mdot-${ci}-${oi}`);
    if(dot){ dot.className = 'mdot '+m.cls; dot.title = `${m.label} (${m.rated}/${m.n} cartes évaluées)`; }
    const pill = document.getElementById(`mpill-${ci}-${oi}`);
    if(pill){
      pill.className = 'mpill '+m.pill;
      pill.innerHTML = `<span class="mdot ${m.cls}"></span>${m.label}${m.rated?` · ${m.rated}/${m.n}`:''}`;
    }
  }));
}

function fcFeedback(v){ if(v===2) fcCelebrate(); else fcShake(v); }
function fcCelebrate(){
  const fx=document.getElementById('fc-fx'); if(!fx) return;
  const stage=document.querySelector('.fc-stage');
  let cx=(window.innerWidth||800)/2, cy=(window.innerHeight||600)*0.42;
  if(stage && stage.getBoundingClientRect){ const r=stage.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; }
  let html='<div class="fx-badge fx-win">✓</div>';
  if(fcStreak>=2) html+='<div class="fx-streak">🔥 Série de '+fcStreak+'</div>';
  fx.innerHTML=html;
  const colors=['#22c55e','#4f46e5','#f59e0b','#e11d48','#0891b2','#fde047'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div'); p.className='fx-confetti';
    p.style.left=cx+'px'; p.style.top=cy+'px'; p.style.background=colors[i%colors.length];
    const ang=Math.random()*Math.PI*2, dist=90+Math.random()*170;
    if(p.style.setProperty){ p.style.setProperty('--dx',Math.round(Math.cos(ang)*dist)+'px'); p.style.setProperty('--dy',Math.round(Math.sin(ang)*dist-40)+'px'); }
    p.style.animationDelay=Math.round(Math.random()*80)+'ms';
    fx.appendChild(p);
  }
  fx.classList.add('show');
  setTimeout(()=>{ fx.classList.remove('show'); fx.innerHTML=''; }, 950);
}
function fcShake(v){
  const stage=document.querySelector('.fc-stage');

/* ---------- Flashcards ---------- */
let deck=[], deckIdx=0, flipped=false, fcRetrav=false;
let smartMode=false, smartTotal=0;
let smartPool=[], smartCur=null, smartPhase='sweep', smartSweep=[], smartSweepTotal=0, smartLastChap=null, smartStats={};
function _shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ====== Modèle adaptatif (les « maths ») ======
   - Maîtrise estimée par objectif = moyenne lissée Beta(1,1) des scores (✓=1, ~=0,5, ✗=0).
   - Phase 1 « diagnostic » : 1 carte par chapitre (ou par objectif si un seul chapitre) → survol complet.
   - Phase 2 « adaptatif » : tirage aléatoire pondéré par le besoin (1 − maîtrise) + bonus d'exploration
     pour les objectifs jamais vus, en évitant d'enchaîner le même chapitre (dispersion). */
function objMasteryEst(okey){ const st=smartStats[okey]; const n=st?st.n:0, s=st?st.s:0; return (s+1)/(n+2); }
function cardWeight(card){
  const okey = card.ci+'-'+card.oi;
  const st = smartStats[okey];
  let w = 0.15 + (1 - objMasteryEst(okey));   // plus la maîtrise est basse, plus le poids est élevé
  if(!st || st.n===0) w += 0.6;               // objectif jamais évalué → exploration / dispersion
  if(card.ci === smartLastChap) w *= 0.4;     // évite d'enchaîner deux cartes du même chapitre
  return Math.max(w, 0.02);
}
function _weightedPick(cands){
  const ws = cands.map(cardWeight);
  let tot = ws.reduce((a,b)=>a+b,0), r = Math.random()*tot;
  for(let i=0;i<cands.length;i++){ r-=ws[i]; if(r<=0) return cands[i]; }
  return cands[cands.length-1];
}
function _buildSweep(d){
  const multiChap = new Set(d.map(c=>c.ci)).size > 1;
  const groups = {};
  d.forEach(c=>{ const g = multiChap ? ('c'+c.ci) : (c.ci+'-'+c.oi); (groups[g]||(groups[g]=[])).push(c); });
  return _shuffle(Object.keys(groups).map(g=>{ const arr=groups[g]; return arr[Math.floor(Math.random()*arr.length)]; }));
}
function smartPick(){
  if(!smartPool.length) return null;
  if(smartPhase==='sweep'){
    while(smartSweep.length){ const c=smartSweep.shift(); if(smartPool.indexOf(c)>-1) return c; }
    smartPhase='adaptive';
  }
  let cands = smartPool.filter(c=>c!==smartCur);
  if(!cands.length) cands = smartPool.slice();
  return _weightedPick(cands);
}
function smartInit(){
  smartPool = deck.slice();
  smartTotal = deck.length;
  smartStats = {};
  smartLastChap = null;
  smartPhase = 'sweep';
  smartSweep = _buildSweep(deck);
  smartSweepTotal = smartSweep.length;
  smartCur = smartPick();
  flipped = false;
}
function smartFocus(){
  const agg={};
  Object.keys(smartStats).forEach(k=>{ const ci=k.split('-')[0]; (agg[ci]||(agg[ci]={sum:0,n:0})); agg[ci].sum+=objMasteryEst(k); agg[ci].n++; });
  const keys=Object.keys(agg);
  if(!keys.length) return 'On sonde encore tes chapitres…';
  let worst=null, worstM=2;
  keys.forEach(ci=>{ const avg=agg[ci].sum/agg[ci].n; if(avg<worstM){ worstM=avg; worst=ci; } });
  if(worstM>=0.8) return '✓ Bon niveau global jusqu\'ici — on continue à varier.';
  return `🎯 Zone à creuser : <b>Chapitre ${CH[+worst].id}</b> — ${CH[+worst].title}`;
}
function fcSkip(){ if(!smartMode) return; smartLastChap = smartCur?smartCur.ci:smartLastChap; smartCur = smartPick(); flipped=false; fcRender(); }
function fcRestartSmart(){ smartInit(); fcRender(); }
function fcInit(){

}
function fcBuildDeck(){
  const ci=document.getElementById('fc-chap').value;
  const oi=document.getElementById('fc-obj').value;
  deck=[];
  CH.forEach((c,i)=>{
    if(ci!=='all' && +ci!==i) return;

        const rid=`${i}-${j}-${k}`;

   </div>
   <div class="fc-stats">${fcStats()}<button class="reset-link" onclick="resetRatings()">réinitialiser mes évaluations</button></div>`;

function fcRenderSmart(){
  const area=document.getElementById('fc-area');
  if(!deck.length){
    area.innerHTML = fcRetrav
      ? `<div class="fc-empty">Toutes les cartes de cette sélection sont acquises — rien à retravailler&nbsp;!</div>`

  }
  if(!smartCur || !smartPool.length){

    return;
  }
  const c=smartCur;

  area.innerHTML = `

     <div class="fc-smartbar-track"><div class="fc-smartbar-fill" style="width:${pct}%"></div></div>
     ${focus}

   <div class="fc-stage">

function fcStats(){
  let bad=0, mid=0, good=0, none=0;
  deck.forEach(d=>{
    const v = RATINGS[d.rid];
    if(v===0) bad++; else if(v===1) mid++; else if(v===2) good++; else none++;
  });
  return `Sélection : <b style="color:#15803d">${good} acquise${good>1?'s':''}</b> · <b style="color:#92400e">${mid} moyenne${mid>1?'s':''}</b> · <b style="color:#b91c1c">${bad} à revoir</b> · ${none} non évaluée${none>1?'s':''}`;
}

/* ---------- Recherche ---------- */
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const stripHtml = h => h.replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').trim();
let searchIdx = [];
function buildSearchIndex(){
  CH.forEach((c,ci)=>{
    c.objectifs.forEach((o,oi)=>{
      const courseTxt = stripHtml(o.text+' '+o.short+' '+o.cours+' '+o.savoir.join(' '));
      searchIdx.push({kind:'cours', ci, oi, txt:courseTxt, ntxt:norm(courseTxt),
        loc:`Ch. ${c.id} · Objectif ${o.num} — ${o.short}`, color:c.color});
      o.cards.forEach((card,ki)=>{
        const cardTxt = stripHtml(card.q+' '+card.a);
        searchIdx.push({kind:'flash', ci, oi, ki, txt:cardTxt, ntxt:norm(cardTxt),
          q:card.q, loc:`Ch. ${c.id} · Obj. ${o.num} — ${o.short}`, color:c.color});
      });
    });
  });
}
let srSel = -1, srItems = [];
function searchInput(){
  const q = document.getElementById('search-input').value.trim();
  const box = document.getElementById('search-results');
  srSel = -1;
  if(norm(q).length < 2){ box.classList.remove('open'); box.innerHTML=''; return; }
  const terms = norm(q).split(/\s+/).filter(t=>t.length>=2);
  if(!terms.length){ box.classList.remove('open'); return; }
  const scored = [];
  searchIdx.forEach((e,i)=>{
    let score = 0;
    const phrase = terms.join(' ');
    if(!terms.every(t=>e.ntxt.includes(t))) return;
    if(e.ntxt.includes(phrase)){
      score += 10;
      // bonus selon le nombre d'occurrences de l'expression exacte
      score += Math.min(e.ntxt.split(phrase).length - 1, 12);
    }
    score += terms.length;
    if(terms.every(t=>norm(e.kind==='flash' ? e.q : e.loc).includes(t))) score += 8;
    scored.push({e, score, pos: e.ntxt.indexOf(phrase)>=0 ? e.ntxt.indexOf(phrase) : e.ntxt.indexOf(terms[0])});
  });
  scored.sort((a,b)=>b.score-a.score);
  const cours = scored.filter(s=>s.e.kind==='cours').slice(0,6);
  const flash = scored.filter(s=>s.e.kind==='flash').slice(0,8);
  if(!cours.length && !flash.length){ box.innerHTML=`<div class="sr-empty">Aucun résultat pour «&nbsp;${q}&nbsp;»</div>`; box.classList.add('open'); srItems=[]; return; }
  const snippet = (s)=>{
    const start = Math.max(0, s.pos-40);
    let frag = s.e.txt.substr(start, 160);
    if(start>0) frag = '…'+frag;
    terms.forEach(t=>{
      frag = frag.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
    });
    return frag;
  };
  let html='';
  if(cours.length){
    html += `<div class="sr-group">Cours</div>` + cours.map((s,k)=>
      `<button class="sr-item" data-n="${k}" onclick="goCours(${s.e.ci},${s.e.oi})">
        <div class="sr-head"><span class="sr-dot" style="background:${s.e.color}"></span><span class="sr-loc">${s.e.loc}</span><span class="sr-kind kc">Cours</span></div>
        <div class="sr-snip">${snippet(s)}</div></button>`).join('');
  }
  if(flash.length){
    html += `<div class="sr-group">Flashcards</div>` + flash.map((s,k)=>
      `<button class="sr-item" data-n="${cours.length+k}" onclick="goFlash(${s.e.ci},${s.e.oi},${s.e.ki})">
        <div class="sr-head"><span class="sr-dot" style="background:${s.e.color}"></span><span class="sr-loc">${s.e.loc}</span><span class="sr-kind kf">Flashcard</span></div>
        <div class="sr-snip"><b>${s.e.q}</b></div></button>`).join('');
  }
  box.innerHTML = html; box.classList.add('open');
  srItems = [...box.querySelectorAll('.sr-item')];
}
function searchKey(ev){
  const box = document.getElementById('search-results');
  if(!box.classList.contains('open')) return;
  if(ev.key==='ArrowDown'){ ev.preventDefault(); srSel=Math.min(srSel+1, srItems.length-1); srHighlight(); }
  else if(ev.key==='ArrowUp'){ ev.preventDefault(); srSel=Math.max(srSel-1, 0); srHighlight(); }
  else if(ev.key==='Enter'){ ev.preventDefault(); if(srItems[srSel>=0?srSel:0]) srItems[srSel>=0?srSel:0].click(); }
  else if(ev.key==='Escape'){ closeSearch(); ev.target.blur(); }
}
function srHighlight(){
  srItems.forEach((e,i)=>e.classList.toggle('sel', i===srSel));
  if(srItems[srSel]) srItems[srSel].scrollIntoView({block:'nearest'});
}
function closeSearch(){

let _hlRange = null, _hlObjId = null, _hlZone = null;

/* Zones surlignables (une seule occurrence par objectif → restauration fiable) */
const HL_ZONES = ['cours','savoir','trame'];
function hlZoneOf(node){
  for(let i=0;i<HL_ZONES.length;i++){
    const el = node.closest('.'+HL_ZONES[i]);
    if(el) return { el, key: HL_ZONES[i] };
  }
  return null;
}

function showHlBar(x, y){
  const bar = document.getElementById('hl-bar');
  bar.style.left = x + 'px';
  bar.style.top = (y - 52) + 'px';
  bar.classList.add('vis');
}
function hideHlBar(){
  document.getElementById('hl-bar').classList.remove('vis');
  _hlRange = null; _hlObjId = null; _hlZone = null;
}

document.addEventListener('mouseup', function(e){
  if(editMode) return;                       // pas de surlignage en mode édition
  if(e.target.closest('#hl-bar')) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount){ return; }
  const text = sel.toString().trim();
  if(text.length < 2){ hideHlBar(); return; }
  const range = sel.getRangeAt(0);
  let anc = range.commonAncestorContainer;
  if(anc.nodeType === 3) anc = anc.parentElement;
  const zone = hlZoneOf(anc);
  if(!zone){ hideHlBar(); return; }
  const objCard = zone.el.closest('.obj-card');
  if(!objCard){ hideHlBar(); return; }
  _hlRange = range.cloneRange();
  _hlObjId = objCard.id;
  _hlZone = zone.key;
  const rect = range.getBoundingClientRect();
  showHlBar(rect.left + rect.width / 2, rect.top);
});

document.addEventListener('mousedown', function(e){
  if(!e.target.closest('#hl-bar') && !e.target.closest('.hl')) hideHlBar();
});

function applyHl(color){
  if(!_hlRange || !_hlObjId) return;
  const mark = document.createElement('mark');
  mark.className = 'hl h' + color;
  const hid = Date.now();
  mark.dataset.hid = hid;
  mark.title = 'Cliquer pour supprimer ce surlignage';
  try{ _hlRange.surroundContents(mark); }
  catch(ex){ const f = _hlRange.extractContents(); mark.appendChild(f); _hlRange.insertNode(mark); }
  const text = mark.textContent.trim();
  window.getSelection().removeAllRanges();
  if(!HIGHLIGHTS[_hlObjId]) HIGHLIGHTS[_hlObjId] = [];
  HIGHLIGHTS[_hlObjId].push({ id: hid, text, color, zone: _hlZone });
  saveHL();
  hideHlBar();
}

document.addEventListener('click', function(e){
  const hl = e.target.closest('.hl');
  if(!hl || e.target.closest('#hl-bar')) return;
  const objCard = hl.closest('.obj-card');
  const objId = objCard ? objCard.id : null;
  const hid = +hl.dataset.hid;
  const p = hl.parentNode;
  while(hl.firstChild) p.insertBefore(hl.firstChild, hl);
  p.removeChild(hl); p.normalize();
  if(objId && HIGHLIGHTS[objId]){
    HIGHLIGHTS[objId] = HIGHLIGHTS[objId].filter(h => h.id !== hid);
    if(!HIGHLIGHTS[objId].length) delete HIGHLIGHTS[objId];
    saveHL();
  }
});

function hlWrapText(container, text, hid, color){
  if(!text) return;
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
  const nodes = []; let n;
  while((n = walker.nextNode())) nodes.push(n);
  const full = nodes.map(n => n.textContent).join('');
  const idx = full.indexOf(text);
  if(idx === -1) return;
  let charCount = 0, startNode, startOff, endNode, endOff;
  for(const tn of nodes){
    const len = tn.textContent.length;
    if(!startNode && charCount + len > idx){ startNode = tn; startOff = idx - charCount; }
    if(!endNode && charCount + len >= idx + text.length){ endNode = tn; endOff = idx + text.length - charCount; break; }
    charCount += len;
  }
  if(!startNode || !endNode) return;
  const range = document.createRange();
  range.setStart(startNode, startOff);
  range.setEnd(endNode, endOff);
  const mark = document.createElement('mark');
  mark.className = 'hl h' + color;
  mark.dataset.hid = hid;
  mark.title = 'Cliquer pour supprimer ce surlignage';
  try{ range.surroundContents(mark); }
  catch(ex){ const f = range.extractContents(); mark.appendChild(f); range.insertNode(mark); }
}

function restoreHighlights(ci){
  CH[ci].objectifs.forEach((o, oi) => {
    const objId = `obj-${ci}-${oi}`;
    const hls = HIGHLIGHTS[objId];
    if(!hls || !hls.length) return;
    hls.forEach(h => {
      let zone = h.zone || 'savoir';      // rétrocompat : anciens surlignages = points-clés
      if(zone === 'complement') zone = 'cours';  // le complément est désormais fusionné dans le cours
      const container = document.querySelector(`#${objId} .${zone}`);
      if(container) hlWrapText(container, h.text, h.id, h.color);
    });
  });
}

const _cloudDeb = {};
function cloudPush(key){
  if(!_sbClient || !_uid) return;
  clearTimeout(_cloudDeb[key]);
  _cloudDeb[key] = setTimeout(()=>{
    const value = localStorage.getItem(key) || '';
    _sbClient.from('content').upsert({ user_id:_uid, key, value }, { onConflict:'user_id,key' })
      .then(({error})=> setSyncStatus(error ? 'Erreur de synchro' : 'Synchronisé ✓', !error))
      .catch(()=> setSyncStatus('Hors ligne', false));
  }, 700);
}
async function cloudPull(){
  if(!_sbClient || !_uid) return;
  try{
    const { data, error } = await _sbClient.from('content').select('key,value').eq('user_id',_uid).in('key', SES_KEYS);
    if(error){ console.warn('pull:', error.message); return; }
    const got = {}; (data||[]).forEach(r=> got[r.key]=r.value);
    SES_KEYS.forEach(k=>{
      if(got[k] != null){ try{ localStorage.setItem(k, got[k]); }catch(e){} }   // serveur prioritaire
      else { const lv = localStorage.getItem(k); if(lv) cloudPush(k); }            // 1er login : on téléverse le local
    });
    reloadLocalState();
  }catch(e){ console.warn('pull:', e); }

function setSyncStatus(t, ok){ const e=document.getElementById('acct-sync'); if(e) e.innerHTML = `<span class="sdot" style="background:${ok===false?'#ef4444':'#22c55e'}"></span>${t}`; }

  const body=document.getElementById('acct-body'); if(!body) return;
  updateAcctButton();
  if(!_sbClient){
    body.innerHTML = `<h3>Compte</h3><p class="acct-sub">La synchronisation nécessite une connexion internet (le service de compte n'a pas pu être chargé). Tes données restent enregistrées sur cet appareil.</p>`;

async function accountSubmit(){
  if(!_sbClient) return;
  const email=(document.getElementById('acct-email').value||'').trim();
  const pwd=document.getElementById('acct-pwd').value||'';
  if(!email||!pwd){ setAcctMsg('Renseigne ton email et ton mot de passe.'); return; }
  const btn=document.getElementById('acct-submit'); if(btn){ btn.disabled=true; btn.textContent='…'; }
  setAcctMsg('');
  try{
    const { error } = _acctMode==='login'
      ? await _sbClient.auth.signInWithPassword({ email, password:pwd })
      : await _sbClient.auth.signUp({ email, password:pwd });
    if(error){ setAcctMsg(error.message); }
    else if(_acctMode==='signup'){ setAcctMsg('Compte créé ✓ Vérifie tes emails pour confirmer, puis connecte-toi.', true); _acctMode='login'; }
    // en cas de succès de connexion, onAuthStateChange prend le relais
  }catch(e){ setAcctMsg('Erreur de connexion. Réessaie.'); }
  if(btn){ btn.disabled=false; renderAccount(); }
}
async function accountSignOut(){
  if(!_sbClient) return;
  await _sbClient.auth.signOut().catch(()=>{});
}
async function accountSyncNow(){
  if(!_sbClient || !_uid) return;
  setSyncStatus('Synchronisation…');
  for(const k of SES_KEYS){
    const value = localStorage.getItem(k) || '';
    await _sbClient.from('content').upsert({ user_id:_uid, key:k, value }, { onConflict:'user_id,key' }).catch(()=>{});
  }
  setSyncStatus('Synchronisé ✓', true);
}
let _sbSession = null;
function _accountBoot(){
  if(!_sbClient){ updateAcctButton(); return; }
  _sbClient.auth.getSession().then(async ({ data:{ session } })=>{
    if(session && session.user){ _sbSession=session; _uid=session.user.id; await cloudPull(); }
    updateAcctButton();
  });
  _sbClient.auth.onAuthStateChange(async (event, session)=>{
    if(event==='SIGNED_IN' && session && session.user){
      _sbSession=session;
      if(_uid===session.user.id){ updateAcctButton(); renderAccount(); return; }
      _uid=session.user.id; await cloudPull(); updateAcctButton(); renderAccount(); closeAccount();
    } else if(event==='SIGNED_OUT'){
      _uid=null; _sbSession=null;
      SES_KEYS.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });   // évite toute fuite entre comptes
      reloadLocalState(); updateAcctButton(); renderAccount();
    }
  });
}
