cards:[
{q:"Quels sont les avantages et les limites de la réglementation environnementale ?",
a:`<p><b>La réglementation impose des limites, des obligations et des interdictions, le contrevenant s'exposant à des sanctions : c'est un instrument contraignant, et non incitatif.</b></p><p>Car elle passe par la fixation de normes : normes d'émission (plafond de gaz à effet de serre des moteurs thermiques), normes de procédé (obligation d'installer des pots catalytiques), normes de produit (interdiction des ampoules à incandescence) et normes de qualité (pureté de l'air et de l'eau). Les amendes permettent d'internaliser une partie de l'externalité, c'est-à-dire le coût lié aux effets de la pollution.</p><p>Ses avantages : efficacité contre les pollutions dangereuses (mesure radicale et immédiate), simplicité de mise en œuvre (un décret ou une loi suffit), incitation à l'innovation (l'interdiction oblige à trouver des substituts technologiques).</p><p>Ses limites : difficulté de dosage (trop sévère elle est contournée, trop faible elle est inutile), absence de zèle (personne n'est incité à faire mieux que le seuil), coûts de contrôle pour l'État, injustice économique (les petites entreprises s'adaptent plus difficilement), perte de compétitivité internationale, application uniforme qui pénalise les plus précaires, contournements et exceptions (urbanisation du littoral), et pression des lobbys (éco-taxe poids lourds).</p>`},
{q:"Pourquoi la taxation environnementale est-elle un instrument incitatif et quel est son double dividende ?",
a:`<p><b>La taxation est un prélèvement obligatoire sur les activités polluantes (taxe pigouvienne ou écotaxe) : contrairement à la réglementation qui impose, elle laisse une liberté de choix aux agents — c'est une politique incitative.</b></p><p>Car Arthur C. Pigou émet l'idée d'internaliser les coûts sociaux de la production avec la logique du «&nbsp;pollueur-payeur&nbsp;» : celui qui est à l'origine d'une pollution doit en supporter le coût financier («&nbsp;je pollue, donc je paye&nbsp;»). En modifiant les prix, la taxe rend la pollution plus coûteuse et pousse naturellement vers des comportements plus écologiques.</p><p>En effet, face à une taxe, une entreprise arbitre : dépolluer, innover pour moins polluer, ou ne rien changer et payer. D'où le double dividende : une modification des comportements, et une augmentation des recettes fiscales grâce à ceux qui ne changent pas leurs habitudes — recettes que l'État peut utiliser pour baisser d'autres impôts (comme les charges sur le travail).</p><p>Illustration : le bonus-malus écologique à l'achat d'un véhicule neuf — le prix augmente pour les véhicules polluants (malus) et diminue pour les véhicules propres (bonus).</p>`},
{q:"Quelles sont les limites de la taxation environnementale ?",
a:`<p><b>La taxation environnementale se heurte à trois limites principales : le dosage, les délocalisations et l'injustice sociale.</b></p><p>Car pour les classiques, l'intervention de l'État peut être nuisible : il est difficile d'établir le bon niveau de taxe — trop basse, elle perd son caractère incitatif ; trop haute, elle décourage la production et peut bloquer l'économie.</p><p>En effet, si un pays taxe et pas ses voisins, les entreprises peuvent partir produire ailleurs (stratégies non coopératives, risque de délocalisation). De plus, la taxe a un caractère socialement injuste : elle pèse plus lourdement sur le budget des ménages les plus précaires, notamment quand elle est forfaitaire.</p><p>Il convient d'ajouter que celui qui paye la taxe n'est pas forcément l'émetteur de la pollution : les entreprises transfèrent une partie de ce montant dans le prix de vente pour que la charge soit supportée par les ménages.</p>`},
{q:"Que sont les subventions vertes et quelles sont leurs limites ?",
a:`<p><b>La subvention est une aide financière ou matérielle émanant des autorités publiques à destination des consommateurs ou des producteurs : les subventions à l'innovation verte visent à internaliser les externalités positives.</b></p><p>Car elles assurent la prise en charge par les collectivités d'une partie du surcoût privé supporté par le producteur — exemple du cours : une compagnie qui achète des véhicules électriques voit son coût de production augmenter alors que sa décision repose sur une diminution du coût social du transport de passagers.</p><p>En effet, les subventions sont des «&nbsp;taxes négatives&nbsp;» qui encouragent les investissements ; la solution optimale consiste à combiner subvention directe et R&D pour promouvoir les technologies vertes.</p><p>Limites : lorsqu'elles sont globales et génériques, elles risquent le saupoudrage ; lorsqu'elles se focalisent sur des technologies spécifiques, ce ciblage limite les capacités globales.</p>`},
{q:"Pourquoi le marché européen des quotas d'émission a-t-il été inefficace ?",
a:`<p><b>Le fonctionnement du marché des quotas en Europe est inefficace : plusieurs phases de son fonctionnement ont connu des prix trop bas.</b></p><p>Car la période 2005-2007 est marquée par une attribution trop généreuse de quotas, ce qui a conduit à un crack carbone.</p><p>En effet, à partir de 2008, des efforts ont été faits pour restreindre leur quantité, mais les effets de la crise des subprimes ont généré une baisse de l'activité et donc une baisse de la demande de quotas. À partir de 2017, l'UE tente de faire remonter les prix et de sauver le marché du carbone en restreignant encore les quotas d'émission : cela se traduit par une remontée des cours, mais cela reste insuffisant pour engendrer un changement.</p><p>Intérêt théorique de l'instrument souligné par le cours : contrairement à la fiscalité qui oblige tous les assujettis à payer sur l'ensemble de leurs émissions, un marché des quotas ne pénalise que les plus pollueurs.</p>`},
{q:"Qu'est-ce que le paradoxe de Jevons ?",
a:`<p><b>Le paradoxe de Jevons montre qu'à mesure de l'amélioration des technologies, la consommation de la ressource augmente alors que l'innovation devrait théoriquement faire baisser son utilisation.</b></p><p>Car plus une énergie est maîtrisée, plus sa consommation augmente, car elle est disponible en plus grande quantité.</p><p>En effet, au travers de la croissance de la production, l'effet positif généré par l'innovation peut être relativisé voire supprimé par l'effet quantité.</p><p>C'est un dysfonctionnement majeur à mobiliser pour nuancer l'efficacité des instruments des pouvoirs publics : même une politique d'innovation verte réussie peut ne pas réduire les émissions globales.</p>`}
]},

cours:`
<h4>Les accords internationaux face au passager clandestin</h4>
<p>Les accords internationaux ont un impact limité sur le réchauffement climatique d'autant que certains pays peuvent adopter un [comportement de] passager clandestin ce qui leur permettrait de tirer avantage des pô menées par les autres à moindre coût. En présence de biens communs, caractérisés par la non-excluabilité et par la rivalité, des problèmes relatifs au comportement de passager clandestin existent :</p>
<ul>
<li>pour lutter contre le réchauffement climatique il faut agir sur le volume global des émissions. Pris individuellement, chacun a intérêt à entrer de manière tardive dans le jeu de coopération. Enfin que le coût lié à l'innovation diminue ;</li>
<li>sachant que les agents éco ont accès à la ressource, ils peuvent reporter leur moyen d'intervenir car le coût est immédiat et les effets, à long terme.</li>
</ul>
<div class="rem"><p><b>Remarque :</b> le comportement de passager clandestin est courant quand il s'agit de biens communs ou collectifs. Cela est d'autant plus vrai si l'on prend en compte le niveau de dev des pays : un pays dev peut se permettre des efforts liés à la baisse de production contrairement au pays en dev.</p></div>
<p><b>Rappel (partie 7.1 du cours) :</b> La COP 21, où 21 ONG ont pu intervenir ainsi que des experts, s'est traduite par un accord non-contraignant. En effet aucune sanction n'est prévue en cas de non-respect mais il montre une volonté de coopération entre les États et les organisations citoyennes.</p>`,

{q:"Pourquoi les négociations internationales sur le climat sont-elles contraintes par des stratégies de passager clandestin ?",
a:`<p><b>Les accords internationaux ont un impact limité sur le réchauffement climatique car certains pays peuvent adopter un comportement de passager clandestin : tirer avantage des politiques menées par les autres à moindre coût.</b></p><p>Car le climat est un bien commun, caractérisé par la non-excluabilité et par la rivalité — et le comportement de passager clandestin est courant quand il s'agit de biens communs ou collectifs.</p><p>En effet, pour lutter contre le réchauffement climatique il faut agir sur le volume global des émissions : pris individuellement, chacun a intérêt à entrer de manière tardive dans le jeu de coopération, en attendant que le coût lié à l'innovation diminue. De plus, comme les agents économiques ont accès à la ressource, ils peuvent reporter leur intervention, car le coût est immédiat et les effets à long terme.</p><p>Illustration : la COP21 s'est traduite par un accord non contraignant — aucune sanction n'est prévue en cas de non-respect.</p>`},
{q:"Comment les inégalités de développement entre pays contraignent-elles les accords environnementaux ?",
a:`<p><b>Les inégalités de développement entre pays contraignent les négociations internationales car tous les pays ne peuvent pas fournir les mêmes efforts.</b></p><p>Car un pays développé peut se permettre des efforts liés à la baisse de production, contrairement à un pays en développement.</p><p>En effet, cette asymétrie renforce les stratégies de passager clandestin : en présence d'un bien commun comme le climat (non-excluable et rival), chaque pays a individuellement intérêt à laisser les autres supporter le coût de la lutte contre le réchauffement, tout en bénéficiant des effets globaux de leurs politiques.</p><p>Conséquence : les accords internationaux ont un impact limité, d'autant qu'ils sont souvent non contraignants — comme l'accord de Paris (COP21), sans sanction en cas de non-respect.</p>`},
{q:"Qu'est-ce qu'un bien commun et pourquoi pose-t-il problème pour l'action environnementale ?",
a:`<p><b>Un bien commun est caractérisé par la non-excluabilité (on ne peut empêcher personne d'y accéder) et par la rivalité (sa consommation par l'un réduit ce qui reste aux autres).</b></p><p>Car c'est précisément cette double caractéristique qui engendre des problèmes relatifs au comportement de passager clandestin.</p><p>En effet, sachant que les agents économiques ont accès à la ressource, ils peuvent reporter leurs moyens d'intervenir : le coût de l'action est immédiat tandis que ses effets ne se manifestent qu'à long terme.</p><p>Application au climat : la lutte contre le réchauffement exige d'agir sur le volume global des émissions, mais chacun, pris individuellement, a intérêt à entrer tardivement dans le jeu de coopération — ce qui limite l'impact des négociations et accords internationaux.</p>`}

{num:"8.1", short:"Chômage, sous-emploi et leurs indicateurs",
text:"Savoir définir le chômage et le sous-emploi et connaître les indicateurs de taux de chômage et de taux d'emploi.",
cours:`
<h4>A — Le sous-emploi : définition et mesure</h4>
<div class="def">
<p><b>Emploi :</b> travail rémunéré, légal et déclaré.</p>
<p><b>Actif :</b> personne de 15 ans et plus occupant ou recherchant un emploi.</p>
<p><b>Sous-emploi :</b> regroupe des personnes qui sont occupées mais pas à plein temps et qui cherchent à travailler davantage.</p>
<p><b>Emploi inadéquat :</b> situation qui diminue les aptitudes ou le bien-être du travailleur suite à une mauvaise utilisation des qualifications ou d'une insuffisance de revenus et du nombre d'heures.</p></div>
<p>On déduit 3 indicateurs de mesure :</p>
<ul>
<li><b>1- le taux d'activité</b> = rapport entre population active et la population totale en âge de travailler</li>
<li><b>2- le taux de chômage</b> = rapport entre la population active au chômage et la population active</li>
<li><b>3- le taux d'emploi</b> = rapport entre la population active occupée et la population totale en âge de travailler</li>
</ul>
<div class="exo"><div class="exo-t">Exercice — taux d'emploi, taux de chômage</div>
<p><b>1️⃣ Signification des deux valeurs entourées :</b><br>Environ 70&nbsp;% de taux d'emploi en 2018 : cela signifie qu'aux États-Unis, environ 70&nbsp;% des personnes en âge de travailler occupent un emploi.<br>Environ 4&nbsp;% de taux de chômage en 2018 : cela signifie qu'environ 4&nbsp;% de la population active (personnes qui travaillent ou cherchent un emploi) est au chômage.</p>
<p><b>2️⃣ Corrélation entre taux de chômage et taux d'emploi :</b><br>On observe une corrélation inverse entre les deux indicateurs : quand le taux de chômage augmente, le taux d'emploi diminue (exemple : autour de 2009-2010) ; quand le taux de chômage baisse, le taux d'emploi augmente (après 2013). Cependant, ce n'est pas forcément une causalité directe. Les deux évoluent ensemble surtout parce qu'ils dépendent de la situation économique globale (croissance, crises, créations d'emplois, etc.).</p></div>
<p>Le taux d'emploi constitue un indicateur additionnel au taux de chômage, il renseigne sur la capacité d'une économie à mobiliser réellement sa main d'œuvre en éliminant les biais induits par la variation possible de la population active.</p>
<div class="exo"><div class="exo-t">Exercice — sous-emploi</div>
<p><b>8. Définir : Qu'est-ce qu'une situation de sous-emploi ?</b><br>Une situation de sous-emploi correspond à une situation où une personne a un emploi mais travaille moins qu'elle ne le souhaiterait ou moins que la durée normale de travail. Cela concerne par exemple les personnes à temps partiel qui voudraient travailler davantage ou celles dont le temps de travail est réduit involontairement.</p>
<p><b>10. Illustrer : quelles situations relèvent du sous-emploi ?</b></p>
<ul><li>Karima, caissière dans une banque travaillant 20 h par semaine mais souhaitant travailler 35 h → OUI, c'est du sous-emploi car elle travaille à temps partiel involontaire.</li>
<li>Pauline, caissière au supermarché, travaille 20 h par semaine et ne souhaite pas travailler plus → NON, ce n'est pas du sous-emploi car son temps partiel est volontaire.</li>
<li>Bakary, ouvrier qui ne travaille pas pendant trois jours à cause d'un chômage technique → OUI, c'est du sous-emploi car son temps de travail est réduit involontairement.</li></ul>
<p><b>12. Expliquer : différence entre halo autour du chômage et chômage.</b><br>La différence est que les chômeurs sont des personnes sans emploi, disponibles pour travailler et recherchant activement un emploi selon la définition du BIT. Les personnes du halo autour du chômage souhaitent souvent travailler mais ne remplissent pas tous les critères (par exemple elles ne recherchent pas activement un emploi ou ne sont pas immédiatement disponibles).</p>
<p><b>13. Argumenter : montrer que la mesure du chômage est relative.</b><br>La mesure du chômage est relative car certaines personnes proches du chômage ne sont pas comptées comme chômeurs. Par exemple, en 2018 il y a 2,693 millions de chômeurs, mais aussi 1,622 million de personnes dans le halo autour du chômage. Cela montre que la réalité du manque d'emploi est plus large que le chiffre officiel du chômage.</p></div>
<p>Les actifs occupés ayant un travail réduit ne comptent pas comme chômeurs au sens du BIT (bureau international du travail). Ils sont donc en situation de sous-emploi. Pour d'autres avoir un temps de travail réduit peut être volontaire. On est donc à la frontière entre emploi et inactivité. Quand la frontière se fait entre emploi et chômage, on parle alors de sous-emploi contraint. Cela s'explique par différents facteurs :</p>
<ul><li>les personnes ne trouvent pas de temps plein avec leurs qualifications ;</li>
<li>elles n'ont pas les moyens de transport pour se rendre sur un autre lieu de travail ;</li>
<li>elles doivent s'occuper de personnes à charge.</li></ul>
<p>Dans les années 80 la notion de «&nbsp;halo du chômage&nbsp;» est apparue pour désigner les personnes qui ne sont pas comptabilisées dans les chiffres du chômage alors que leur situation s'y apparente. Le sous-emploi se distingue du halo du chômage qui caractérise donc la situation des inactifs au sens du BIT et qui déclarent pourtant vouloir un emploi. Ces personnes [sont classées] comme inactives car elles ne sont pas disponibles sous 15aine ou parce qu'elles déclarent ne pas avoir effectué d'actes de recherche. Ainsi la frontière entre chômage / inactivité / emploi se brouille.</p>

<h4>B — Le chômage et sa mesure</h4>
<p>Le chômage est mesuré par l'INSEE suite à une enquête trimestrielle. Elle existe depuis 1950. Cette enquête fournit également des données sur les professions, l'activité des jeunes ou des femmes, sur la précarité ou les changements de situation. Le chômage au sens du BIT a été adopté en 1982 et se base sur 3 critères :</p>
<ul><li>être sans emploi CAD ne pas avoir travaillé, même pas 1h ;</li>
<li>être disponible sous 15 jours ;</li>
<li>avoir une recherche active au cours du mois précédent ou en avoir trouvé un qui commence dans les 3 mois à venir.</li></ul>
<p>La vision de FRANCE TRAVAIL n'est pas la même, en effet les demandeurs d'emploi sont regroupés en 5 catégories :</p>
<ul>
<li><b>A :</b> ce sont les demandeurs d'emploi qui sont tenus de tenir des actes positifs de recherche et qui sont sans emploi ;</li>
<li><b>B :</b> ce sont les demandeurs d'emploi tenus d'effectuer des actes positifs de recherche d'emploi et ayant une activité réduite (&lt; 78 h) ;</li>
<li><b>C :</b> les demandeurs d'emploi tenus de faire des actes positifs de recherche et ayant une activité réduite longue (supérieure à 78 h) ;</li>
<li><b>D :</b> les demandeurs d'emploi non tenus de faire des actes positifs de recherche en raison de formation, maladie, stages et n'ayant pas d'emploi ;</li>
<li><b>E :</b> les demandeurs d'emploi non tenus de faire des actes positifs de recherche et qui sont en emploi tels que les contrats EDE.</li>
</ul>
<p>Cette mesure du chômage par le biais des demandeurs d'emploi de catégorie A présente au moins 2 limites :</p>
<ul><li>c'est une catégorie administrative soumise à l'évolution des critères d'inscription et de radiation et qui en plus dépend des chômeurs eux-mêmes ;</li>
<li>les catégories ne permettent pas des comparaisons internationales du fait des critères divergents entre les pays.</li></ul>
<p>Un chômeur est donc toute personne en âge de travailler (entre 15 et 64 ans) qui est sans emploi, qui déclare faire des actes positifs de recherche et qui est disponible pour un emploi.</p>
<p class="lacune">(Mention du cours : «&nbsp;manque partie&nbsp;» — fin de section non rédigée dans la fiche d'origine.)</p>`,

{q:"Comment définit-on le chômage au sens du BIT ?",
a:`<p><b>Un chômeur au sens du BIT est une personne en âge de travailler, sans emploi, disponible et en recherche active.</b></p><p>Car la définition adoptée en 1982 repose sur 3 critères : être sans emploi, c'est-à-dire ne pas avoir travaillé, même pas une heure ; être disponible sous 15 jours ; avoir effectué une recherche active au cours du mois précédent ou avoir trouvé un emploi qui commence dans les 3 mois à venir.</p><p>En effet, le chômage est mesuré par l'INSEE par une enquête trimestrielle qui existe depuis 1950, et qui fournit aussi des données sur les professions, l'activité des jeunes et des femmes, la précarité et les changements de situation.</p><p>À distinguer de la mesure de France Travail, qui classe les demandeurs d'emploi en 5 catégories (A à E) — mesure administrative qui ne permet pas les comparaisons internationales et dépend des critères d'inscription et de radiation.</p>`},
{q:"Qu'est-ce que le sous-emploi et le halo du chômage ?",
a:`<p><b>Le sous-emploi regroupe des personnes qui sont occupées mais pas à plein temps et qui cherchent à travailler davantage ; le halo du chômage désigne les personnes non comptabilisées dans les chiffres du chômage alors que leur situation s'y apparente.</b></p><p>Car les actifs occupés à temps de travail réduit ne comptent pas comme chômeurs au sens du BIT : on parle de sous-emploi contraint quand le temps partiel est involontaire — la personne ne trouve pas de temps plein avec ses qualifications, n'a pas les moyens de transport, ou doit s'occuper de personnes à charge.</p><p>En effet, le halo (notion apparue dans les années 80) caractérise les inactifs au sens du BIT qui déclarent pourtant vouloir un emploi : ils sont classés inactifs car non disponibles sous 15 jours ou sans actes de recherche. La frontière entre chômage, inactivité et emploi se brouille.</p><p>Illustration : Karima, caissière à 20h/semaine souhaitant travailler 35h, est en sous-emploi ; Pauline à temps partiel volontaire ne l'est pas. En 2018 : 2,693 millions de chômeurs mais aussi 1,622 million de personnes dans le halo — la réalité du manque d'emploi est plus large que le chiffre officiel.</p>`},
{q:"Quels sont les indicateurs du marché du travail et que mesurent-ils ?",
a:`<p><b>On déduit trois indicateurs de mesure : le taux d'activité, le taux de chômage et le taux d'emploi.</b></p><p>Car le taux d'activité est le rapport entre la population active et la population totale en âge de travailler ; le taux de chômage est le rapport entre la population active au chômage et la population active ; le taux d'emploi est le rapport entre la population active occupée et la population totale en âge de travailler.</p><p>En effet, le taux d'emploi constitue un indicateur additionnel au taux de chômage : il renseigne sur la capacité d'une économie à mobiliser réellement sa main d'œuvre en éliminant les biais induits par la variation possible de la population active.</p><p>Illustration : aux États-Unis en 2018, le taux d'emploi était d'environ 70&nbsp;% et le taux de chômage d'environ 4&nbsp;% ; on observe une corrélation inverse entre les deux (2009-2010 vs après 2013), sans causalité directe — les deux dépendent de la situation économique globale.</p>`}
]},

{num:"8.2", short:"Appariement et asymétries d'information : le chômage structurel",
text:"Comprendre que les problèmes d'appariements (frictions, inadéquations spatiales et de qualifications) et les asymétries d'information (salaire d'efficience) sont des sources de chômage structurel.",
cours:`
<h4>II — Les sources du chômage structurel</h4>
<div class="def"><p><b>Chômage structurel :</b> part du chômage incompréhensible du chômage à court à moyen terme dans un contexte institutionnel donné.</p></div>
<p>Cette forme de chômage est due à un déséquilibre durable sur le marché du travail. Le chômage structurel au sens large intègre le chômage «&nbsp;frictionnel&nbsp;» qui est lié au délai nécessaire à la recherche d'emploi adéquat par les formes de travail.</p>

<h4>A — La théorie du salaire d'efficience et ses limites</h4>
<h5>1 / Salaire d'efficience</h5>
<div class="def"><p><b>Salaire d'efficience :</b> c'est un salaire supérieur au salaire concurrentiel. Il est au niveau nécessaire pour motiver le travailleur à fournir sa meilleure productivité.</p></div>
<p>Le salaire d'efficience a 4 objectifs :</p>
<ul><li>attirer les meilleurs chômeurs ;</li>
<li>stimuler la productivité ;</li>
<li>fidéliser les salariés et éviter le turnover ;</li>
<li>réduire le coût de contrôle car le travailleur travaille mieux grâce à l'augmentation de la motivation ce qui réduit le besoin de contrôle.</li></ul>
<p>L'offre de travail émane des actifs qui comparent l'utilité apportée par leurs loisirs et celle apportée par leur salaire. En effet travailler constitue un effort qui doit être récompensé. Les individus sont rationnels et cherchent donc le meilleur arbitrage. La demande de travail émane donc des entreprises qui cherchent à maximiser leurs profits en comparant le coût du travail et la productivité du travailleur. La théorie du salaire d'efficience permet d'expliquer pourquoi les entreprises peuvent avoir intérêt à un salaire &gt; salaire d'équilibre ((W/p*) avec W = le salaire). Cette théorie pose comme justification la rigidité des salaires et l'asymétrie d'informations. Ces analyses montrent que ce n'est pas la productivité qui détermine le salaire mais l'inverse, en augmentant les salaires le salarié fera plus d'efforts.</p>
<h5>2 / L'asymétrie d'information</h5>
<p>La présence d'asymétries d'information induit une situation dans laquelle les agents économiques n'ont pas tous accès de manière égale à l'information. C'est le cas sur le marché du travail où l'employeur ne dispose pas de toutes les informations concernant la productivité effective des candidats à l'emploi malgré l'engagement de nombreux coûts en procédure comme la lecture de CV ou l'entretien d'embauche. Il y a donc un risque qu'il emploie quelqu'un qui ne fera pas l'affaire, par exemple si ses qualifications ne correspondent pas exactement aux nécessités de l'entreprise ou s'il s'agit d'un tire-au-flanc qui cherche à faire moins que ce pour quoi il est rémunéré. Pour éviter ces problèmes, l'employeur doit mettre en place un moyen pour faire en sorte que le profil recherché corresponde effectivement aux besoins du poste.</p>
<p>Partant de l'hypothèse que certains salariés ont tendance à vouloir expérimenter différents emplois pour savoir si les conditions de travail et de rémunération sont meilleures et que le turnover génère des coûts notamment des formations, le salaire d'efficience permet de limiter ce risque.</p>
<p>Les asymétries d'info sur le mé du W peuvent générer un risque d'aléa moral : concrètement quand le contrat est signé, un salarié peut diminuer sa productivité sans que son salaire n'en pâtisse. Pour inciter au W l'employeur peut disposer d'une menace à brandir sous la forme d'un coût éco lié au licenciement ; sous l'hypothèse que le mé du W est à l'équilibre et que le salarié est payé au niveau de rémunération W/P*, ce coût est nul car une fois licencié le tire-au-flanc retrouvera un emploi au mm salaire. Ainsi un employeur rationnel qui veut s'assurer de la prod de ses salariés dans le temps doit proposer un salaire supérieur à celui d'équilibre.</p>

<h4>B — Le problème d'appariement spatial</h4>
<div class="def"><p><b>Appariement</b> = capacité du marché du travail à faire coïncider les besoins en main d'œuvre des organisations avec la diversité de l'offre de travail.</p></div>
<p>Le chômage structurel est la part du chômage observée qui s'explique par les structures de l'économie affectant durablement le fonctionnement du marché du travail. Les problèmes d'appariement résultent de frictions générées par la présence d'inadéquation spatiale ou de qualifications. Ainsi le problème d'appariement spatial correspond au fait que les postulants des employeurs ne sont pas dans les mêmes espaces géographiques. Les emplois peuvent être concentrés dans une zone géographique et la population au chômage dans une autre. Or la mobilité induit des coûts, notamment de déménagement que les moins qualifiés aux rémunérations les plus basses ne peuvent pas assumer.</p>
<p>En France la polarisation du marché du travail a augmenté le besoin en main d'œuvre peu qualifiée et très qualifiée au détriment d'un niveau de qualification moyen. Cela permet d'expliquer le volume d'emplois non-pourvus en France et la persistance d'un taux de chômage élevé pour certaines catégories d'actifs. Les politiques de formation visent à remédier à cette inadéquation. En effet les politiques de formation semblent nécessaires en raison du progrès technique et de l'évolution de l'organisation du travail qui impliquent que certains chômeurs doivent se doter de nouvelles qualifications et compétences. Ce type de politiques repose sur une idée selon laquelle l'amélioration du capital humain accroît la productivité et donc le potentiel de croissance ce qui à la fin améliore l'emploi.</p>`,
savoir:[
"<b>Définitions :</b> chômage structurel (déséquilibre durable du marché du travail, intègre le chômage frictionnel lié aux délais de recherche), appariement (faire coïncider besoins en main d'œuvre et offre de travail), salaire d'efficience (salaire > salaire concurrentiel pour motiver la meilleure productivité), asymétrie d'information, aléa moral.",
"<b>Les 4 objectifs du salaire d'efficience :</b> attirer les meilleurs candidats, stimuler la productivité, fidéliser / éviter le turnover (coûteux en formations), réduire les coûts de contrôle.",
"<b>Le mécanisme à expliquer (asymétrie → salaire d'efficience → chômage) :</b> l'employeur ne connaît pas la productivité effective des candidats (coûts de CV, entretiens) → risque de tire-au-flanc et d'aléa moral (baisser sa productivité après signature) → au salaire d'équilibre W/P*, la menace de licenciement est nulle (le licencié retrouve le même salaire) → l'employeur rationnel propose un salaire > équilibre → renversement : ce n'est pas la productivité qui détermine le salaire mais l'inverse.",
"<b>Le mécanisme de l'inadéquation spatiale :</b> emplois concentrés dans une zone, chômeurs dans une autre ; la mobilité coûte (déménagement) — coûts que les moins qualifiés aux plus basses rémunérations ne peuvent pas assumer.",
"<b>L'inadéquation de qualifications :</b> la polarisation du marché du travail (besoins en très qualifiés et peu qualifiés, au détriment du niveau moyen) explique les emplois non pourvus ET la persistance d'un chômage élevé pour certaines catégories → remède : politiques de formation (capital humain → productivité → croissance → emploi)."
],

trame:`<div class="trame-steps">
<div class="ts"><span class="tsn">1</span><div class="ts-body"><span class="ts-lbl">Définitions</span>Définis le <b>chômage structurel</b> (déséquilibre durable du marché du travail) et l'<b>appariement</b> (faire coïncider besoins en main d'œuvre et offre de travail).</div></div>
<div class="ts"><span class="tsn">2</span><div class="ts-body"><span class="ts-lbl">Partie 1 — les problèmes d'appariement</span>Frictions (délais de recherche), <b>inadéquation spatiale</b> (emplois et chômeurs dans des zones différentes, mobilité coûteuse) et <b>inadéquation de qualifications</b> (polarisation → emplois non pourvus + chômage élevé) → remède : la formation.</div></div>
<div class="ts"><span class="tsn">3</span><div class="ts-body"><span class="ts-lbl">Partie 2 — les asymétries d'information</span>L'employeur ignore la productivité réelle (risque d'aléa moral) → il propose un <b>salaire d'efficience</b> (&gt; équilibre) pour attirer, motiver, fidéliser, réduire le contrôle → renversement : ce n'est plus la productivité qui détermine le salaire, mais l'inverse → chômage.</div></div>
<div class="ts concl"><span class="tsn">→</span><div class="ts-body"><span class="ts-lbl">Conclusion</span>Frictions, inadéquations et asymétries d'information créent un chômage structurel, que la formation et un meilleur appariement peuvent réduire.</div></div>
</div>`,

{q:"Quel est le rôle du salaire d'efficience dans le chômage structurel ?",
a:`<p><b>Le salaire d'efficience — un salaire supérieur au salaire concurrentiel, au niveau nécessaire pour motiver le travailleur à fournir sa meilleure productivité — est une source de chômage structurel liée aux asymétries d'information.</b></p><p>Car les entreprises ont intérêt à payer un salaire supérieur au salaire d'équilibre pour quatre raisons : attirer les meilleurs candidats, stimuler la productivité, fidéliser les salariés et éviter le turnover (qui génère des coûts de formation), et réduire les coûts de contrôle grâce à la motivation.</p><p>En effet, l'employeur ne dispose pas de toutes les informations sur la productivité effective des candidats (asymétrie d'information), et après la signature du contrat un salarié peut diminuer sa productivité sans que son salaire n'en pâtisse (aléa moral). Or si le salarié est payé au salaire d'équilibre W/P*, la menace de licenciement est nulle : une fois licencié, le tire-au-flanc retrouvera un emploi au même salaire. Un employeur rationnel doit donc proposer un salaire supérieur à celui d'équilibre.</p><p>Conséquence : ce n'est pas la productivité qui détermine le salaire mais l'inverse — et ce salaire supérieur à l'équilibre crée une rigidité des salaires qui empêche le retour à l'équilibre du marché du travail, alimentant le chômage structurel.</p>`},
{q:"Comment les problèmes d'appariement expliquent-ils le chômage structurel ?",
a:`<p><b>Les problèmes d'appariement — la difficulté du marché du travail à faire coïncider les besoins en main d'œuvre des organisations avec la diversité de l'offre de travail — sont une source de chômage structurel.</b></p><p>Car ils résultent de frictions générées par des inadéquations spatiales ou de qualifications : le problème d'appariement spatial correspond au fait que les postulants et les employeurs ne sont pas dans les mêmes espaces géographiques — les emplois peuvent être concentrés dans une zone et la population au chômage dans une autre.</p><p>En effet, la mobilité induit des coûts, notamment de déménagement, que les moins qualifiés aux rémunérations les plus basses ne peuvent pas assumer. Quant à l'inadéquation de qualifications : en France, la polarisation du marché du travail a augmenté le besoin en main d'œuvre peu qualifiée et très qualifiée au détriment du niveau moyen, ce qui explique le volume d'emplois non pourvus et la persistance d'un taux de chômage élevé pour certaines catégories d'actifs.</p><p>Remède du cours : les politiques de formation, fondées sur l'idée que l'amélioration du capital humain accroît la productivité, donc le potentiel de croissance, ce qui améliore l'emploi.</p>`},
{q:"Qu'est-ce que le chômage structurel ?",
a:`<p><b>Le chômage structurel est la part du chômage qui s'explique par les structures de l'économie affectant durablement le fonctionnement du marché du travail.</b></p><p>Car cette forme de chômage est due à un déséquilibre durable sur le marché du travail, dans un contexte institutionnel donné — il ne se résorbe pas à court ou moyen terme.</p><p>En effet, au sens large, il intègre le chômage «&nbsp;frictionnel&nbsp;», lié au délai nécessaire à la recherche d'un emploi adéquat.</p><p>Ses sources, d'après le cours : les problèmes d'appariement (frictions, inadéquations spatiales et de qualifications), les asymétries d'information (salaire d'efficience) et les effets des institutions (salaire minimum, règles de protection de l'emploi).</p>`}
]},

{num:"8.3", short:"Les effets des institutions sur le chômage structurel",
text:"Comprendre les effets (positifs ou négatifs) des institutions sur le chômage structurel (notamment salaire minimum et règles de protection de l'emploi).",
cours:`
<h4>C — Les effets des institutions sur l'emploi</h4>
<p>Si les conditions de CPP sont réunies, conformément à la loi de l'offre et de la demande, la flexibilité des prix doit permettre un retour à l'équilibre. Dans ce cas la levée des contraintes institutionnelles telles que le salaire minimum doit permettre de tendre vers l'équilibre et résorber le chômage. Un SMIC (salaire minimum interprofessionnel de croissance) trop élevé peut induire 3 effets :</p>
<ul><li>aggraver le taux de chômage des catégories les moins qualifiées ;</li>
<li>engendrer des difficultés d'accès au premier emploi des jeunes travailleurs ;</li>
<li>alimenter un renchérissement des prix sur certains biens et services ce qui affecte négativement la demande et génère un affaiblissement de l'offre. Il y a donc une limitation de la création d'emploi ce qui engendre du chômage structurel.</li></ul>
<div class="rem"><p>En France le salaire minimum en janvier 2026 brut est de 1823€ soit environ 1443€ net.</p></div>
<h5>2 — Les protections de l'emploi</h5>
<p>Les règles de protection de l'emploi sont des règles régissant les contrats de travail, CAD le préavis, le versement d'indemnités de licenciement, l'obligation d'un plan de sauvetage de l'emploi en cas de licenciement économique.</p>
<p><b>Effets positifs :</b> L'assurance chômage permet de maintenir un niveau de revenus en cas de survenance du risque et ainsi de continuer de faire face aux dépenses courantes (frais, assurances…). Cette prestation sociale permet de se laisser [du temps] pour trouver un emploi en adéquation avec ses qualifications. Ainsi dans cette optique KEYNÉSIENNE, les règles de protection de l'emploi permettent d'entretenir la dynamique de la demande globale ce qui favorise la croissance et l'emploi.</p>
<p>Quand les entreprises sont dés-incitées à licencier, elles adoptent des stratégies fondées sur la formation et la polyvalence afin que le salarié soit en adéquation avec les besoins de production. Il en résulte alors des gains de compétitivité permettant une baisse du coût unitaire ce qui est favorable à la compétitivité prix. Les salariés plus polyvalents et mieux formés ont une meilleure dotation en capital humain ce qui leur permet d'innover d'où une compétitivité hors prix qui s'améliore également. Les gains de compétitivité stimulent la production, donc la croissance et donc l'emploi.</p>
<p><b>Effets négatifs :</b> La mise en place de minima sociaux pose le problème de la trappe à chômage. Il peut y avoir un effet dés-incitatif au retour en emploi car le coût inhérent à la reprise est jugé trop élevé par rapport au salaire dégagé par rapport à un retour à l'emploi. Les règles de protection de l'emploi contribuent au chômage structurel notamment pour les personnes les moins qualifiées, notamment de 2 manières :</p>
<ul><li>les entreprises sont réticentes à embaucher car elles doivent respecter des règles comme les préavis, solutions de licenciement, reclassement etc. en cas de licenciement ce qui fait baisser le niveau global d'emploi ;</li>
<li>elles deviennent de plus en plus sélectives quant à la qualité des candidats.</li></ul>
<p>En freinant les embauches et les licenciements, les règles de protection de l'emploi nuisent au processus de destruction créatrice, les activités obsolètes perdurent tandis que des secteurs innovants ne se développent pas assez rapidement car le redéploiement des salariés entre secteurs et régions ne s'effectue pas correctement.</p>`,
savoir:[
"<b>Le cadre théorique néoclassique :</b> en CPP, la flexibilité des prix permet le retour à l'équilibre → la levée des contraintes institutionnelles (salaire minimum) doit résorber le chômage.",
"<b>Les 3 effets négatifs d'un SMIC trop élevé :</b> aggrave le chômage des moins qualifiés, freine l'accès des jeunes au premier emploi, renchérit les prix (→ demande affaiblie → moins de création d'emplois → chômage structurel). Chiffre du cours : SMIC janvier 2026 = 1823€ brut ≈ 1443€ net.",
"<b>Effets positifs des protections de l'emploi (optique keynésienne) :</b> l'assurance chômage maintient le revenu → entretient la demande globale → croissance et emploi ; elle laisse le temps de trouver un emploi en adéquation avec ses qualifications ; entreprises dés-incitées à licencier → stratégies de formation et polyvalence → capital humain ↑ → compétitivité prix ET hors prix → production → croissance → emploi.",
"<b>Effets négatifs :</b> trappe à chômage (minima sociaux dés-incitatifs au retour à l'emploi) ; réticence à embaucher (préavis, reclassement → baisse du niveau global d'emploi) ; sélectivité accrue envers les candidats ; frein au processus de destruction créatrice (activités obsolètes qui perdurent, secteurs innovants ralentis, mauvais redéploiement des salariés).",
"<b>Définitions :</b> règles de protection de l'emploi (préavis, indemnités de licenciement, plan de sauvegarde de l'emploi), trappe à chômage."
],
sujets:[
"Comment expliquer et réduire le chômage structurel ? (EC1)",
"Comment peut-on expliquer le chômage structurel ? (EC1)"
],
trame:`<div class="trame-steps">
<div class="ts"><span class="tsn">1</span><div class="ts-body"><span class="ts-lbl">Définitions</span>Définis les <b>règles de protection de l'emploi</b> et la <b>trappe à chômage</b>. Annonce que les institutions ont des effets ambivalents (positifs/négatifs) sur le chômage structurel.</div></div>
<div class="ts"><span class="tsn">2</span><div class="ts-body"><span class="ts-lbl">Partie 1 — l'analyse néoclassique (effets négatifs)</span>En CPP, la flexibilité des prix résorbe le chômage → un SMIC trop élevé aggrave le chômage des moins qualifiés, freine l'accès des jeunes, renchérit les prix ; la protection crée trappe à chômage, réticence à embaucher, frein à la destruction créatrice.</div></div>
<div class="ts"><span class="tsn">3</span><div class="ts-body"><span class="ts-lbl">Partie 2 — l'analyse keynésienne (effets positifs)</span>L'assurance chômage maintient le revenu → soutient la demande globale ; elle améliore l'appariement (temps de trouver un emploi adapté) ; les protections incitent à la formation → capital humain → compétitivité → croissance → emploi.</div></div>
<div class="ts concl"><span class="tsn">→</span><div class="ts-body"><span class="ts-lbl">Conclusion</span>L'effet des institutions sur le chômage dépend du dosage et de l'analyse théorique retenue.</div></div>
</div>`,
plans:[
{ec:"EC1",q:"Comment expliquer (et réduire) le chômage structurel ? (angle : rôle des institutions)",body:`<p><span class="pt">Intro :</span> définir protection de l'emploi et salaire minimum.</p><p><span class="pt">I.</span> Les institutions peuvent aggraver le chômage (lecture néoclassique : SMIC, rigidités, trappe à chômage).</p><p><span class="pt">II.</span> Mais elles peuvent le réduire (lecture keynésienne : soutien de la demande, meilleur appariement, formation).</p><p><span class="pt">Concl :</span> un effet ambivalent qui dépend du niveau et du contexte.</p>`}
],
cards:[
{q:"Quels sont les effets du salaire minimum sur le chômage structurel ?",
a:`<p><b>Selon l'analyse néoclassique, un SMIC trop élevé peut induire trois effets négatifs sur l'emploi.</b></p><p>Car si les conditions de concurrence pure et parfaite sont réunies, la flexibilité des prix doit permettre, conformément à la loi de l'offre et de la demande, un retour à l'équilibre : la levée des contraintes institutionnelles comme le salaire minimum devrait donc résorber le chômage.</p><p>En effet, un SMIC trop élevé peut : aggraver le taux de chômage des catégories les moins qualifiées ; engendrer des difficultés d'accès au premier emploi pour les jeunes travailleurs ; alimenter un renchérissement des prix de certains biens et services, ce qui affecte négativement la demande et génère un affaiblissement de l'offre — d'où une limitation de la création d'emplois qui engendre du chômage structurel.</p><p>Repère du cours : en France, le salaire minimum de janvier 2026 est de 1823€ brut, soit environ 1443€ net.</p>`},
{q:"Quels sont les effets positifs des règles de protection de l'emploi ?",
a:`<p><b>Les règles de protection de l'emploi — préavis, indemnités de licenciement, plan de sauvegarde en cas de licenciement économique — peuvent avoir des effets positifs sur l'emploi, dans une optique keynésienne.</b></p><p>Car l'assurance chômage permet de maintenir un niveau de revenus en cas de survenance du risque et de continuer à faire face aux dépenses courantes : elle entretient ainsi la dynamique de la demande globale, ce qui favorise la croissance et l'emploi. Elle laisse aussi le temps de trouver un emploi en adéquation avec ses qualifications.</p><p>En effet, quand les entreprises sont dés-incitées à licencier, elles adoptent des stratégies fondées sur la formation et la polyvalence : il en résulte des gains de compétitivité prix (baisse du coût unitaire) et hors prix (salariés mieux dotés en capital humain, capables d'innover).</p><p>Conclusion du mécanisme : les gains de compétitivité stimulent la production, donc la croissance, et donc l'emploi.</p>`},
{q:"Quels sont les effets négatifs des règles de protection de l'emploi ?",
a:`<p><b>Les règles de protection de l'emploi contribuent au chômage structurel, notamment pour les personnes les moins qualifiées, de deux manières.</b></p><p>Car d'une part, les entreprises sont réticentes à embaucher puisqu'elles doivent respecter des règles (préavis, solutions de licenciement, reclassement) en cas de licenciement, ce qui fait baisser le niveau global d'emploi ; d'autre part, elles deviennent de plus en plus sélectives quant à la qualité des candidats.</p><p>En effet, en freinant les embauches et les licenciements, ces règles nuisent au processus de destruction créatrice : les activités obsolètes perdurent tandis que les secteurs innovants ne se développent pas assez rapidement, car le redéploiement des salariés entre secteurs et régions ne s'effectue pas correctement.</p><p>S'y ajoute la trappe à chômage : les minima sociaux peuvent avoir un effet dés-incitatif au retour en emploi, le coût de la reprise étant jugé trop élevé par rapport au salaire dégagé.</p>`}
]},

{num:"8.4", short:"Fluctuations économiques et chômage conjoncturel",
text:"Comprendre les effets des fluctuations de l'activité économique sur le chômage conjoncturel.",
cours:`
<h4>III — Les effets des fluctuations éco sur le chômage conjoncturel</h4>
<div class="def"><p><b>Chômage conjoncturel :</b> chômage dû aux fluctuations macro-éco à court terme, CAD à une insuffisance de la croissance ou de la demande globale.</p></div>
<h4>A — Le lien entre la croissance et l'emploi</h4>
<p>En réalité le niveau d'emploi ne s'adapte pas immédiatement aux variations de la conjoncture. Les entreprises peuvent avoir recours à la suppression des heures supplémentaires ou leur baisse et éventuellement le chômage technique. Les entreprises ne réduiront leurs effectifs que si le ralentissement se confirme. À l'inverse en cas de reprise, les entreprises répondent dans un premier temps par une augmentation de la production à effectif constant toujours en recourant à la flexibilité interne.</p>
<p>Les conséquences des fluctuations conjoncturelles sont différentes selon les catégories d'actifs. En effet le taux de chômage [des jeunes] y est plus sensible à la conjoncture, de même que les nouveaux entrants dans une entreprise du fait du faible coût de licenciement ainsi que d'une éventuelle faiblesse dans la dotation du capital humain.</p>
<h4>B — L'action sur la demande</h4>
<p>Pour KEYNES la rigidité des salaires peut être économiquement viable et avoir des effets vertueux. Il considère qu'au niveau macro-économique, le niveau d'emploi n'est pas déterminé par le niveau des salaires réels mais par la demande effective. Ainsi pour lui il ne faut pas baisser les salaires au risque d'aggraver la crise mais au contraire soutenir la demande grâce à des politiques monétaire et budgétaire.</p>
<div class="def"><p><b>Demande effective</b> = consommation + investissement + variation des stocks + solde de la balance commerciale.</p></div>`,

{num:"8.5", short:"Les politiques de lutte contre le chômage",
text:"Connaître les principales politiques mises en œuvre pour lutter contre le chômage : politiques macroéconomiques de soutien de la demande globale, politiques d'allégement du coût du travail, politiques de formation et politiques de flexibilisation pour lutter contre les rigidités du marché du travail.",
cours:`
<h4>B — L'action sur la demande (politiques de soutien de la demande globale)</h4>
<div class="exo"><div class="exo-t">Exercice — évolution du PIB</div>
<p><b>Montrez comment les politiques macroéconomiques de soutien de la demande globale permettent de lutter contre le chômage.</b></p>
<p>Les politiques macroéconomiques de soutien de la demande globale permettent de lutter contre le chômage car elles stimulent l'activité économique. En effet, une hausse de la demande (consommation, investissement, dépenses publiques) entraîne une augmentation de la production, ce qui pousse les entreprises à embaucher.</p>
<p>Le document montre que la croissance du PIB repose surtout sur la demande intérieure. Par exemple, en 2017, le PIB augmente de 2,3&nbsp;%, avec une contribution de 1,1 point de la consommation et 1,0 point de l'investissement. Cela montre que la hausse de la demande stimule la production.</p>
<p>Cela s'illustre aussi sur les investissements où en 2015 la part des investissements s'élevait à 0.2 point de contribution dans l'évolution du PIB contre 1.0 point de contribution en 2019 ce qui représente une hausse de 0.8 point de part de contribution.</p>
<p>Ainsi, en augmentant la demande globale, les politiques de relance favorisent la croissance et permettent de réduire le chômage.</p></div>
<p>Constatant les ravages de la crise des années 30, KEYNES émet de vives critiques sur les théories néo-classiques. Il s'appuie sur la rationalité économique des agents, il se base sur des indicateurs globaux. [La crise] dégrade les revenus, dégrade l'emploi. L'État doit donc intervenir pour stimuler la DE car cela permet de générer de la croissance et donc in fine, de l'emploi. La politique de relance KEYNÉSIENNE a été mise en place dans les années 60 et s'est révélée être efficace. La politique de relance doit être une politique conjoncturelle et donc ne pas s'inscrire dans la durée. La politique monétaire de relance cherche à mettre à disposition des consommateurs et surtout des investisseurs, des liquidités abondantes en réduisant les taux d'î, ce qui baisse le coût des crédits et génère un surcroît de pouvoir d'achat. La politique de relance budgétaire pour sa part consiste à creuser les déficits publics en augmentant les dépenses. Cela peut passer par des grands investissements publics, une augmentation des aides aux plus démunis ou encore des baisses d'impôts. Le chômage conjoncturel peut donc être résorbé.</p>
<p>Une politique de relance a été menée en France en 2008, des mesures telles que la prime à la casse ou encore des mesures fiscales en faveur des entreprises. En 2021 un plan de relance européen de 36 milliards avait été mis en place.</p>

<h4>IV — Les principales politiques de lutte contre le chômage</h4>
<h5>A — Les politiques d'allègement du coût du travail</h5>
<div class="exo"><div class="exo-t">Exercice — coût du travail</div></div>
<p>Si les salaires baissent, l'embauche diminue car certains salariés vont trouver le salaire trop bas, cela explique l'existence d'un chômage volontaire. Des barrières nuisent à la concurrence et au bon fonctionnement du marché. Ainsi en cas de chômage, les néo-classiques préconisent :</p>
<ul><li>de revoir les conditions d'embauche et de licenciement pour + de flexibilité ;</li>
<li>de déréglementer le marché du travail ;</li>
<li>de diminuer le coût du travail pour les moins qualifiés.</li></ul>
<div class="def">
<p><b>Coût du travail :</b> ensemble des dépenses induites par l'utilisation du facteur travail, il comprend le salaire brut et les cotisations patronales.</p>
<p><b>Salaire brut :</b> salaire net - cotisations salariales.</p></div>
<p class="lacune">(Mention du cours : «&nbsp;à compléter&nbsp;» — passage non rédigé dans la fiche d'origine.)</p>
<h5>2 — La politique de formation</h5>
<p>On distingue 2 types de politiques de formation :</p>
<ul>
<li><b>les politiques globales</b> qui touchent toute la population ; elles reposent sur la formation initiale et la formation professionnelle en continu. Les politiques de formation constituent un rôle majeur car elles permettent à chaque individu d'avoir une dotation en capital humain permettant d'avoir des capacités et des connaissances. Elles n'ont pas forcément pour objet d'appareiller les compétences avec les besoins recherchés par les entreprises. La formation professionnelle peut faciliter la mobilité des travailleurs et leur adaptation au progrès technique. Dans cette optique, le compte personnel de formation a été créé en 2015 ;</li>
<li><b>les politiques spécifiques d'insertion</b> concernant tous les chômeurs et les travailleurs exposés au risque chômage. Elles sont diverses et variées, mises en œuvre par l'État, les conseils généraux ou encore France Travail. L'insertion par l'activité économique est un autre dispositif de politique d'emploi, il est mis en œuvre par des associations ou des entreprises conventionnées et est destiné aux personnes sans emploi avec d'importantes difficultés sociales.</li>
</ul>
<p><b>Rappel (II-B et C du cours, politiques de formation et de flexibilisation) :</b> Les politiques de formation visent à remédier à l'inadéquation des qualifications. En effet les politiques de formation semblent nécessaires en raison du progrès technique et de l'évolution de l'organisation du travail qui impliquent que certains chômeurs doivent se doter de nouvelles qualifications et compétences. Ce type de politiques repose sur une idée selon laquelle l'amélioration du capital humain accroît la productivité et donc le potentiel de croissance ce qui à la fin améliore l'emploi.</p>`,

a:`<p><b>On distingue deux types de politiques de formation : les politiques globales et les politiques spécifiques d'insertion.</b></p><p>Car les politiques globales touchent toute la population et reposent sur la formation initiale et la formation professionnelle en continu : elles permettent à chaque individu d'avoir une dotation en capital humain (capacités et connaissances) et facilitent la mobilité des travailleurs et leur adaptation au progrès technique — dans cette optique, le compte personnel de formation a été créé en 2015.</p><p>En effet, les politiques spécifiques d'insertion concernent tous les chômeurs et les travailleurs exposés au risque chômage ; elles sont mises en œuvre par l'État, les conseils généraux ou France Travail. L'insertion par l'activité économique, portée par des associations ou entreprises conventionnées, est destinée aux personnes sans emploi avec d'importantes difficultés sociales.</p><p>Le mécanisme sous-jacent : l'amélioration du capital humain accroît la productivité et donc le potentiel de croissance, ce qui à la fin améliore l'emploi — et remédie à l'inadéquation des qualifications créée par le progrès technique.</p>`},

a:`<p><b>Non : le soutien de la demande globale est efficace contre le chômage conjoncturel, mais le chômage structurel appelle d'autres politiques.</b></p><p>Car les politiques keynésiennes de relance (monétaire : baisse des taux ; budgétaire : hausse des dépenses) résorbent le chômage conjoncturel dû à une insuffisance de la demande — la relance des années 60 s'est révélée efficace.</p><p>Mais en effet, le chômage structurel, lié aux structures mêmes du marché du travail, nécessite : des politiques d'allègement du coût du travail (préconisation néo-classique pour les moins qualifiés), des politiques de formation (remédier à l'inadéquation des qualifications, améliorer le capital humain — CPF 2015), et des politiques de flexibilisation pour lutter contre les rigidités du marché du travail (conditions d'embauche et de licenciement, déréglementation).</p><p>Conclusion mobilisable : le choix des politiques dépend du diagnostic — conjoncturel ou structurel — du chômage.</p>`}
]}
]});

{num:"9.1", short:"Travail, activité, statut d'emploi, chômage : des frontières incertaines",
text:"Savoir distinguer les notions de travail, activité, statut d'emploi (salarié, non-salarié), chômage ; comprendre que les évolutions des formes d'emploi rendent plus incertaines les frontières entre emploi, chômage et inactivité.",
cours:`
<h4>A) Des frontières incertaines entre chômage, emploi et inactivité</h4>
<h5>1 — Distinction des notions</h5>
<div class="def"><p><b>Personne en activité</b> = désigne l'ensemble des personnes désireuses de participer au marché du travail, qu'elles soient occupées ou non.</p>
<p>Chômage - taux d'activité - emploi (voir Chapitre 8 : comment lutter efficacement contre le chômage).</p></div>
<p>Il est possible d'exercer un emploi de manière indépendante ou pour le compte d'un employeur. Le salariat s'est généralisé au 20e siècle suite au développement de la protection sociale qui assure des droits aux salariés. Au cours des 30 glorieuses, le CDI est devenu la norme d'emploi. Le travail est donc une activité humaine fatigante mais créatrice de richesse.</p>
<p>Les statuts professionnels posent un cadre juridique qui va déterminer les conditions de travail, l'environnement pro et la rémunération. On distingue donc 2 statuts d'emploi :</p>
<ul><li><b>salarié :</b> ce sont les individus qui travaillent pour un employeur en échange d'une rémunération ;</li>
<li><b>non-salariés (indépendants) :</b> qui tirent leur rémunération de la vente de leur production.</li></ul>
<h5>2 — L'évolution des formes de travail</h5>
<div class="exo"><div class="exo-t">Exercice — évolution précarisation</div>
<p><b>Q1/ Comment a évolué l'emploi atypique depuis 20 ans ?</b><br>Depuis 1980, le niveau d'emploi atypique a augmenté drastiquement avec l'augmentation des emplois à temps partiel, des contrats d'intérim et des CDD. On observe globalement une hausse de 4x la valeur initiale avec les intérims qui sont passés de 0.7 à 2.6, les CDD passant de 1.7 à 4.7 et les temps partiels de 4.6 à 17.6&nbsp;%.</p>
<p><b>Q2/ Les emplois précaires sont-ils devenus la norme aujourd'hui ?</b><br>Bien que la part de ces emplois dans la sphère du marché du travail ait drastiquement augmenté en 20 ans, elle n'en reste pas moins inférieure à 1/5 des emplois totaux, bien loin d'une majorité pouvant constituer une norme.</p></div>
<p>On estime que près de 40&nbsp;% du temps partiel est subi. Les embauches en CDD ou autre forme de contrat atypique sont en croissance. Leur caractéristique est de s'écarter de l'emploi salarié à plein temps et du CDI. Ces emplois atypiques ont connu une forte croissance depuis les années 80. À titre d'exemple la proportion d'emplois en CDD est passée de 4.5&nbsp;% en 1982 à 11.5&nbsp;% en 2015. Le CDD est désormais la nouvelle norme d'embauche, en 2018 cela concernait 87&nbsp;% des nouvelles embauches hors intérim. Ces nouvelles formes d'emploi concernent particulièrement les jeunes et deviennent un passage quasi obligé dans la vie active.</p>
<p>Ces formes d'emploi recouvrent également les formes de sous-emploi, notamment le temps partiel subi. Il y a de plus en plus d'allers-retours entre le chômage, l'emploi et l'inactivité. La frontière entre ces concepts se brouille même pour les individus qui souhaitent travailler davantage. La frontière est d'autant plus perméable que les individus sont des femmes ou des personnes peu ou pas diplômées.</p>
<div class="exo"><div class="exo-t">Exercice — statut d'emploi</div>
<ol>
<li>En 2019 d'après l'INSEE la part des salariés et des indépendants selon le sexe était de 8.8&nbsp;% pour les femmes et 15.3&nbsp;% pour les hommes. Pour les salariés, la part des femmes est de 91.2&nbsp;% et 84.7&nbsp;% pour les hommes. On remarque alors une plus grande présence des hommes dans les domaines de l'emploi indépendant là où on assiste à une quasi part totale des femmes dans le salariat.</li>
<li>D'après le document on voit que la part de CDD est 3 à 5 fois plus grande chez les 15-24 ans que chez les 25-65 ans, de plus les situations d'apprentissage ou d'intérim sont des situations quasi uniquement présentes chez les 14-25 ans soulignant une catégorie davantage précarisée que les 25-49 et 50 ou plus.</li>
</ol></div>`,

{num:"9.2", short:"Les descripteurs de la qualité des emplois",
text:"Connaître les principaux descripteurs de la qualité des emplois (conditions de travail, niveau de salaire, sécurité économique, horizon de carrière, potentiel de formation, variété des tâches).",
cours:`
<h4>B) Définitions et mesure de la qualité de l'emploi</h4>
<p>La qualité de l'emploi est un concept multidimensionnel dont il n'existe aujourd'hui pas de définition univoque et harmonisée à l'échelle internationale. À l'échelle micro-éco, évaluer la qualité de l'emploi suppose de s'intéresser au contenu même du travail et de la satisfaction qui en découle (marge d'autonomie, reconnaissance professionnelle, participation aux décisions, adéquation du poste aux qualifications). Dans une perspective dynamique des trajectoires professionnelles possibles, il faut s'intéresser au développement des compétences et aux perspectives de carrière. À l'échelle de l'organisation productive, la qualité de l'emploi renverra davantage à la politique de rémunération, de recrutement, de formation ainsi que la fixation des horaires de travail. Enfin à l'échelle macroéconomique, la qualité de l'emploi peut s'appréhender en mesurant la part de la population en situation de sous-emploi, la distribution des salaires, la qualité du dialogue social.</p>
<div class="exo"><div class="exo-t">Exercice — descripteurs de l'emploi (vidéo)</div>
<p>La qualité d'un emploi se définit par sa contribution globale au bien-être du travailleur, tant sur le plan immédiat que pour son avenir. Cette notion complexe s'articule d'abord autour des <b>conditions de travail</b>, qui regroupent l'environnement physique, l'organisation du temps et la qualité des relations humaines au sein de l'entreprise. À cela s'ajoute le <b>niveau de salaire</b>, perçu non seulement comme une ressource financière permettant d'arbitrer entre travail et loisirs, mais aussi comme une forme de reconnaissance sociale et statutaire.</p>
<p>L'intérêt quotidien du poste dépend également de la <b>variété des tâches</b>, qui permet d'éviter la monotonie grâce à l'élargissement ou à l'enrichissement des missions confiées. Parallèlement, le <b>potentiel de formation</b> joue un rôle crucial en permettant au salarié de développer son capital humain et de maintenir son employabilité tout au long de sa carrière.</p>
<p>Enfin, la qualité de l'emploi est indissociable de la <b>sécurité économique</b>, qui garantit une stabilité de revenu grâce à des contrats pérennes et un système de protection sociale efficace. Ces éléments combinés dessinent un <b>horizon de carrière</b>, offrant au travailleur des perspectives d'évolution professionnelle et des opportunités de promotion motivantes sur le long terme.</p></div>
<div class="def"><p><b>Horizon de carrière :</b> désigne les perspectives d'évolution professionnelle offertes au travailleur à moyen et long termes (changement total ou partiel de contenu du métier, changement de poste, amélioration des qualifications et de la rémunération...).</p></div>
<p>L'horizon de carrière est souvent lié aux potentiels de formation : 45&nbsp;% des salariés en CDI accèdent à la formation continue contre 31&nbsp;% des CDD et 19&nbsp;% des indépendants. Pour une entreprise, former des individus qui ne restent pas n'a pas d'intérêt car cela représente un coût important. Par ailleurs, les salariés eux-mêmes sont préoccupés par le fait d'obtenir un emploi par la suite et cela a plus d'importance que de se projeter dans la progression de carrière qui souvent est hachée.</p>
<div class="rem"><p>⚠ <b>Consigne du cours :</b> apprendre la qualité de l'emploi pour le bac.</p></div>
<p><b>(Voir aussi, partie IV du cours)</b> La polarisation de la qualité des emplois se manifeste par un écart croissant de la qualité des emplois. Ainsi les conditions de travail, l'accès à la formation, l'horizon de carrière, etc. dans les tâches les moins valorisées sont moins satisfaisants que pour les autres. À cette mauvaise qualité se conjugue une insatisfaction liée à la moindre reconnaissance des emplois de moindre qualité, ce qui impacte l'estime de soi.</p>`,
savoir:[
"<b>Les 6 descripteurs à réciter (consigne du cours : « apprendre la qualité de l'emploi pour le bac ») :</b> conditions de travail (environnement physique, organisation du temps, relations humaines), niveau de salaire (ressource financière + reconnaissance sociale et statutaire), sécurité économique (contrats pérennes, protection sociale), horizon de carrière (perspectives d'évolution, promotion), potentiel de formation (capital humain, employabilité), variété des tâches (anti-monotonie, élargissement/enrichissement).",

{num:"9.3", short:"Du taylorisme au post-taylorisme : organisations et conditions de travail",
text:"Comprendre les principales caractéristiques des modèles d'organisation taylorien (division du travail horizontale et verticale, relation hiérarchique stricte) et post-taylorien (flexibilité, recomposition des tâches, management participatif) ; comprendre les effets positifs et négatifs de l'évolution des formes de l'organisation du travail sur les conditions de travail.",
cours:`
<h4>A) Du taylorisme au post-taylorisme</h4>
<p>Le modèle taylorien théorisé par F. W. Taylor au début du 20e siècle renvoie à un ensemble de dispositifs qui ont pour but de fonder une organisation scientifique du travail (OST). L'objectif est d'augmenter l'efficacité de la production en luttant contre ce que Taylor [nomme] «&nbsp;la flânerie systématique&nbsp;» des ouvriers. Son modèle est fondé sur une double division du travail :</p>
<ul>
<li><b>verticale :</b> c'est une séparation stricte entre le travail de conception et d'exécution, de ce fait les ouvriers et les employés ne peuvent pas prendre d'initiative ;</li>
<li><b>horizontale :</b> les tâches se décomposent en étapes, l'ouvrier exécute une tâche répétitive avec des gestes simples, une hiérarchie stricte est mise en place, ce qui suppose une relation de subordination. La direction pilote toute l'organisation productive et possède pleinement les moyens de contrôle avec par exemple l'utilisation de chronomètres, la fixation de cadres de travail et la surveillance par des comptes rendus stricts.</li>
</ul>
<div class="def">
<p><b>Organisation du travail :</b> manière dont les postes de travail et relations entre travailleurs sont conçus dans une entreprise ou une administration afin de produire.</p>
<p><b>OST = organisation scientifique du travail :</b> système d'organisation du travail consistant à confier à un organisme particulier le soin de décomposer une tâche répétitive en un ensemble de gestes élémentaires, d'affecter à chacun de ces gestes un temps et de ce fait, d'allouer un temps déterminé à chacun des travailleurs.</p></div>
<div class="exo"><div class="exo-t">Exercice — organisation du travail</div>
<p><b>1/ Quelles sont les conséquences de la division du travail pour A. Smith ?</b><br>Pour Adam Smith, la division du travail (illustrée par sa célèbre manufacture d'épingles) a pour conséquence majeure une hausse massive de la production et de la productivité grâce à la spécialisation des ouvriers. Cependant, il note également une conséquence sociale négative : l'abêtissement du travailleur, qui passe ses journées à répéter le même geste simple et perd ainsi ses capacités intellectuelles.</p>
<p><b>2/ Quels sont les grands principes de l'organisation du travail ?</b><br>L'OST repose sur deux divisions strictes. La division horizontale, qui consiste en une parcellisation extrême des tâches (gestes simples et répétitifs) chronométrées pour définir la «&nbsp;seule meilleure façon&nbsp;» (the one best way) de travailler. La division verticale, qui sépare radicalement les concepteurs (ingénieurs) des exécutants (ouvriers). Elle inclut aussi le salaire aux pièces pour motiver la productivité.</p>
<p><b>3/ Quels sont les apports de H. Ford à cette OST ?</b><br>Henry Ford a complété le système de Taylor en introduisant le travail à la chaîne (convoyeur). Cela supprime les déplacements des ouvriers et impose une cadence de travail dictée par la machine, ce qui radicalise la parcellisation des tâches.</p>
<p><b>4/ Quels sont les avantages du système mis en place par H. Ford ?</b><br>Ce modèle permet des gains de productivité records, une baisse des coûts de production et donc des prix de vente, ouvrant la voie à la production de masse. En parallèle, Ford instaure des salaires élevés (Five Dollars Day) pour que ses ouvriers puissent eux-mêmes consommer ses produits, favorisant ainsi la consommation de masse.</p>
<p><b>5/ Quelles sont les conséquences du tayloro-fordisme pour les ouvriers ?</b><br>Le travail devient extrêmement monotone, dénué de sens et physiquement usant, ce qui entraîne une hausse de l'absentéisme et du «&nbsp;turn-over&nbsp;» (rotation du personnel). Les ouvriers se sentent dépossédés de leur savoir-faire au profit de la machine.</p>
<p><b>6/ Comment expliquer l'affaiblissement des gains de productivité du tayloro-fordisme ?</b><br>Le travail devient extrêmement monotone, dénué de sens et physiquement usant, ce qui entraîne une hausse de l'absentéisme et du «&nbsp;turn-over&nbsp;» (rotation du personnel). Les ouvriers se sentent dépossédés de leur savoir-faire au profit de la machine.</p>
<p><b>7/ Quelles sont les caractéristiques de l'organisation du travail mise en place par T. Ohno ?</b><br>Taiichi Ohno met en place une organisation flexible appelée «&nbsp;toyotisme&nbsp;», basée sur le juste-à-temps (produire selon la demande réelle pour éviter les stocks) et la méthode des 5 zéros (zéro stock, zéro délai, zéro défaut, zéro panne, zéro papier). Il introduit également le Kaizen (amélioration continue).</p>
<p><b>8/ Comment évolue la division du travail après l'introduction des principes toyotistes et la crise du tayloro-fordisme ?</b><br>Avec le toyotisme, on assiste à une recomposition des tâches. La division horizontale s'assouplit par la polyvalence et la rotation des postes, tandis que la division verticale diminue grâce au management participatif et aux cercles de qualité où les ouvriers peuvent proposer des améliorations.</p>
<p><b>9/ Les contraintes tayloro-fordistes du travail ont-elles disparu ?</b><br>Non, elles n'ont pas disparu. On parle de néo-taylorisme car, bien que les tâches soient plus variées, les contraintes de rythme (cadences) et le contrôle hiérarchique restent très forts, s'étendant même au secteur des services (centres d'appels, logistique).</p>
<p><b>10/ Quels sont les effets de l'introduction des technologies de l'information et de la communication (TIC) dans l'organisation productive ?</b><br>Les technologies de l'information et de la communication favorisent le travail collaboratif et l'autonomie, mais elles créent aussi de nouvelles pressions. Elles entraînent un flou entre vie privée et professionnelle et imposent une réactivité permanente face aux demandes des clients, ce qui peut générer un stress accru et des risques psychosociaux.</p></div>
<p>Le taylorisme vise à définir la législation pour profiter au vu d'accroître au maximum les rendements. Cela s'organise autour de 4 idées :</p>
<ul><li>la division horizontale du travail (spécialisation des tâches, étude du temps d'exécution) ;</li>
<li>la division verticale du travail (distinction entre exécutant et concepteur) ;</li>
<li>salaire au rendement ;</li>
<li>contrôle des tâches par les contremaîtres.</li></ul>
<p>Ces 4 principes répondent à 3 objectifs :</p>
<ul><li>une diminution des temps morts en évitant aux ouvriers de se déplacer et en contrôlant le temps d'exécution ;</li>
<li>une optimisation du temps de travail pour chacun ;</li>
<li>la motivation des ouvriers et le contrôle en amont de la qualité de production.</li></ul>
<p>Ce bouleversement des méthodes de travail s'inscrit dans le renouvellement du système productif au cours de la seconde moitié du 20e siècle. Avec une augmentation de la taille des entreprises, la complexification des opérations industrielles et l'émergence de nouveaux corps d'ingénieurs qui participent au développement d'une usine nouvelle.</p>
<div class="exo"><div class="exo-t">Exercice — conséquences Taylor</div>
<p><b>1. Montrer que le taylorisme provoque une déqualification du travail ouvrier.</b><br>Le taylorisme provoque une déqualification du travail ouvrier car il repose sur une division très poussée des tâches. En effet, le travail est fragmenté en opérations simples et répétitives, ce qui fait que l'ouvrier n'a plus besoin que d'une qualification réduite. Il ne maîtrise plus l'ensemble du processus de production et perd ainsi son savoir-faire global. Comme le souligne le texte, la principale qualité demandée devient la rapidité et non plus la compétence. Ainsi, le travail perd son contenu technique et intellectuel, ce qui entraîne une véritable déqualification des ouvriers.</p>
<p><b>2. Expliquer pourquoi le taylorisme dégrade le bien-être des salariés.</b><br>Le taylorisme dégrade le bien-être des salariés car il rend le travail répétitif et dépourvu de sens. En effet, la division des tâches entraîne une perte de signification du travail, ce qui peut provoquer un sentiment d'ennui et de démotivation. De plus, les salariés sont déresponsabilisés et soumis à une forte surveillance, ce qui augmente la pression et le stress. Par ailleurs, la répétition des gestes peut entraîner de la fatigue ainsi que des troubles physiques et nerveux, comme des maux de tête ou des tics. Ainsi, le taylorisme détériore à la fois la santé physique et mentale des travailleurs.</p>
<p><b>3. Montrer que le taylorisme peut avoir des effets négatifs à la fois sur les salariés et sur l'entreprise.</b><br>Le taylorisme a des effets négatifs à la fois sur les salariés et sur l'entreprise. D'une part, pour les salariés, il entraîne une déqualification, une perte de sens du travail, ainsi qu'une fatigue physique et mentale liée à la répétition des tâches et à la pression exercée. D'autre part, pour l'entreprise, ce mode d'organisation peut susciter des comportements de résistance de la part des salariés, en raison de leur démotivation et du manque d'implication. Cela oblige l'entreprise à renforcer la surveillance, ce qui peut alourdir les coûts et dégrader le climat social. Ainsi, le taylorisme peut nuire à la fois au bien-être des travailleurs et à l'efficacité globale de l'entreprise.</p></div>
<p>À partir des années 70, le modèle tayloro-fordiste subit une triple crise :</p>
<ul>
<li><b>une crise sociale :</b> les ouvriers acceptent de + en + difficilement les conditions de travail imposées par l'entreprise. Ce mécontentement se traduit par l'absentéisme, du manquement et le turn-over ou encore des malfaçons. Ainsi en mai 68, le slogan «&nbsp;boulot, métro, dodo&nbsp;» ;</li>
<li><b>une crise économique :</b> on assiste à un essoufflement de la norme de consommation de masse de produits standardisés, une consommation plus instable et diversifiée voit le jour ;</li>
<li><b>une crise technique :</b> les gains de productivité très importants pendant les 30 glorieuses ne progressent plus, les effets de cette organisation du travail atteignent une limite technique.</li>
</ul>
<p>Devant les limites de la division du travail, les entreprises mettent en place des aménagements (enrichissement des tâches, autonomie plus grande des travailleurs) ou rompent davantage avec les principes de l'organisation scientifique du travail en consultant et en impliquant les salariés dans la production (polyvalence, cercles de qualité, etc.). Il émerge donc des modèles post-tayloriens en rupture avec le modèle tayloro-fordiste qui se fondent sur l'importance du «&nbsp;produire juste à temps&nbsp;» CAD produire à la demande ce qui permet de réduire les stocks tout en tenant compte des demandes qualitatives et quantitatives.</p>
<p>Le modèle d'organisation post-taylorien désigne l'ensemble des innovations du travail telles que :</p>
<ul>
<li><b>La flexibilité</b> consiste à adapter la production et l'emploi aux évolutions de la demande. Elle permet la souplesse et l'adaptation au marché. Cette flexibilité porte à la fois sur le travail (variation de la durée individuelle du travail ou des effectifs) et sur l'emploi (recomposition des tâches). Ce principe prolonge et approfondit celui de la division technique du travail tel qu'Adam Smith à la fin du XVIIIe siècle l'avait illustré avec l'exemple de la manufacture d'épingles.</li>
<li><b>La recomposition des tâches</b> consiste à élargir et enrichir les tâches exécutées par les travailleurs. L'élargissement des tâches, en opposition à leur parcellisation, permet d'augmenter la variété des tâches effectuées par des travailleurs plus polyvalents. L'enrichissement des tâches limite la division verticale du travail et permet aux travailleurs de participer à la réflexion sur l'organisation ou sur la qualité.</li>
<li><b>Le management participatif</b> est une méthode de gestion des ressources humaines qui vise à favoriser l'implication des salariés. Le fonctionnement par projet ou mission permet ainsi à des groupes semi-autonomes de décider eux-mêmes de leur organisation et du partage des tâches pour atteindre un objectif.</li>
</ul>
<div class="rem"><p>Il ne faut pas opposer ces deux modèles d'organisation du travail qui coexistent. Ainsi des formes tayloriennes existent toujours, dans le numérique par exemple, parallèlement à des groupes de travail très autonomes. Amazon illustre la persistance du modèle taylorien. En effet, les scanners servent à [mesurer] la productivité de chacun des travailleurs, les résultats individuels et collectifs, ce qui permet de baser les primes. Les cadres jouissent d'une plus grande autonomie mais subissent des contraintes notamment des pressions temporelles.</p></div>

<h4>B) Les effets de l'évolution des organisations du travail sur les conditions de travail</h4>
<p>La diffusion du taylorisme jusqu'aux années 70 a alourdi la contrainte hiérarchique, ce qui s'est traduit par une diminution des compétences. Le développement des organisations post-tayloriennes dans les années 80 a permis de réélargir les tâches et de les enrichir, ce qui a accru l'autonomie, mais, en parallèle, l'intensité des tâches s'est accrue en raison d'une plus grande responsabilité. Dans ce modèle, la pression hiérarchique est moins visible.</p>
<p>L'organisation du travail produit des effets sur les conditions de travail (santé et bien-être). Ainsi la division horizontale contraint le travailleur à répéter une tâche en soutenant une [cadence] élevée, ce qui peut générer des troubles musculo-squelettiques, ce qui représente en France les 4/5 des maladies professionnelles. L'organisation post-taylorienne permet de varier les postures même si elle ne laisse pas toujours le temps de s'adapter au nouveau poste. Ce mode d'organisation a aussi pu permettre de réduire les tâches dangereuses et le nombre d'accidents du travail. La division verticale s'est donc assouplie permettant l'autonomie, mais cela développe des risques psycho-sociaux qui se manifestent par le stress voire parfois le suicide.</p>
<p>L'autocontrôle des salariés et le contrôle par le numérique se substituent au contrôle hiérarchique. L'organisation post-taylorienne conserve donc des effets ambigus.</p>`,

a:`<p><b>Le modèle taylorien, théorisé par F. W. Taylor au début du 20e siècle, fonde une organisation scientifique du travail (OST) visant à augmenter l'efficacité de la production en luttant contre la «&nbsp;flânerie systématique&nbsp;» des ouvriers.</b></p><p>Car il repose sur une double division du travail : verticale — séparation stricte entre conception et exécution, les ouvriers ne pouvant pas prendre d'initiative — et horizontale — tâches décomposées en gestes simples et répétitifs, chronométrées pour définir la «&nbsp;one best way&nbsp;», avec une hiérarchie stricte et une relation de subordination.</p><p>En effet, le système s'organise autour de 4 idées (division horizontale, division verticale, salaire au rendement, contrôle par les contremaîtres) répondant à 3 objectifs : diminution des temps morts, optimisation du temps de travail, motivation et contrôle de la qualité.</p><p>Illustration : Henry Ford complète le système avec le travail à la chaîne (convoyeur), qui supprime les déplacements et impose une cadence dictée par la machine — gains de productivité records, production de masse, et salaires élevés (Five Dollars Day) favorisant la consommation de masse.</p>`},
