{num:"3.3", short:"La productivité des firmes sous-tend la compétitivité d'un pays",
text:"Comprendre que la productivité des firmes sous-tend la compétitivité d'un pays, c'est-à-dire son aptitude à exporter.",
cours:`
<div class="def">
<p><b>Compétitivité</b> = capacité d'une entreprise, d'un secteur, d'une économie à faire face à la concurrence tant sur le marché intérieur qu'extérieur.</p>
<p><b>Compétitivité prix</b> = capacité à produire des biens et services à des prix inférieurs à ceux des concurrents.</p>
<p><b>Compétitivité hors prix</b> = compétitivité structurelle = capacité à vendre des biens et services pour des motifs autres que leur prix. Exemple : qualité, packaging.</p></div>

<h4>2) La capacité à exporter sous-tend la productivité</h4>
<p>La compétitivité d'un pays peut se définir comme sa capacité à exporter ; dans cette optique, un pays gagne en compétitivité lorsqu'il accroît ses exportations et qu'il est capable de faire face à davantage de concurrence.</p>
<p>Pour exporter davantage, 2 solutions :</p>
<ul><li>soit il s'ouvre à d'autres marchés</li>
<li>soit il se développe sur des marchés existants</li></ul>
<p>Si le coût marginal s'avère trop élevé, le prix fixé ne permettra pas d'attirer des clients, l'entreprise réalisera alors des pertes et sortira donc du marché ; seules les firmes qui survivent à ce processus sont en capacité d'exporter, car cela implique des coûts de commerce (formalités administratives, transport etc.) qui viennent renchérir le coût de production. Les exportations se concentrent sur une minorité de firmes très productives. Le gain à l'échange ne s'explique pas par les différences entre pays mais par la compétitivité internationale. De plus, la concurrence internationale doit impliquer un effort d'innovation qui va rejaillir sur la productivité. L'effet du commerce sur l'innovation et la productivité est différencié selon la distance à la frontière technologique des entreprises. Le commerce agit sur l'incitation à innover à travers 2 effets : la taille de marché et l'effet de concurrence.</p>
<div class="exo"><div class="exo-t">Exercice — capacité à exporter</div>
<p><b>1 - À partir du tableau établissez un lien entre la taille de l'entreprise et sa capacité à innover.</b><br>Le tableau montre que plus la taille d'une entreprise augmente, plus sa capacité à innover est élevée. En effet, parmi les entreprises de 10/19 salariés, 50&nbsp;% des E exportatrices et 28&nbsp;% des E non-exportatrices sont innovantes au sens large, contre 59&nbsp;% et 35&nbsp;% pour celles de 20 à 49 salariés, 70&nbsp;% et 44&nbsp;% pour celles de 50 à 249 salariés et enfin 83&nbsp;% et 64&nbsp;% pour les entreprises de 250 salariés ou +. Cela prouve que la capacité d'innovation croît avec la taille de l'entreprise, qu'elle soit exportatrice ou non. Par exemple, 68&nbsp;% des entreprises de 250 salariés et plus innovent en produit ou procédé, contre seulement 32&nbsp;% pour celles de 10 à 19 salariés. Cette tendance s'explique par le fait que les grandes entreprises disposent de ressources financières, humaines et technologiques plus importantes, leur permettant d'investir davantage dans la R et D, de bénéficier d'économies d'échelle et d'un meilleur accès au marché, ce qui favorise la capacité d'innovation.</p>
<p><b>2 - À l'aide du doc et de vos connaissances, expliquez que la productivité des firmes sous-tend la compétitivité d'un pays.</b><br>La productivité des firmes constitue un facteur essentiel de la compétitivité d'un pays, car elle représente leur capacité à innover, à exporter et donc à affronter la concurrence internationale. On parle alors de cercle vertueux. D'après le document, plus les entreprises sont grandes, plus elles sont innovantes : seules 28&nbsp;% des sociétés de 10/19 salariés non-exportatrices innovent au sens large, contre 50&nbsp;% des entreprises exportatrices de même catégorie. Cette tendance se maintient avec la taille : l'écart moyen entre les entreprises exportatrices et non-exportatrices innovantes reste d'environ 20 points, montrant que l'ouverture internationale stimule l'innovation et donc la productivité. En effet, une entreprise plus productive peut réduire ses coûts de production, améliorer la qualité de ses biens et investir davantage dans la recherche et développement, ce qui renforce à la fois sa compétitivité prix et sa compétitivité hors prix. Ainsi, la productivité des firmes soutient directement la compétitivité globale du pays et contribue à sa croissance économique.</p></div>`,

a:`<p><b>La compétitivité prix est la capacité à produire des biens et services à des prix inférieurs à ceux des concurrents, tandis que la compétitivité hors prix (ou structurelle) est la capacité à vendre pour des motifs autres que le prix.</b></p><p>Car la compétitivité en général désigne la capacité d'une entreprise, d'un secteur ou d'une économie à faire face à la concurrence tant sur le marché intérieur qu'extérieur.</p><p>En effet, la compétitivité hors prix repose sur des éléments comme la qualité ou le packaging.</p><p>Illustration : une entreprise plus productive renforce les deux à la fois — elle peut réduire ses coûts (compétitivité prix) et investir davantage en R&D pour améliorer la qualité (compétitivité hors prix).</p>`}
]},

{num:"3.4", short:"L'internationalisation de la chaîne de valeur",
text:"Comprendre l'internationalisation de la chaîne de valeur et savoir l'illustrer.",
cours:`
<h4>A — L'internationalisation de la chaîne de valeur</h4>
<p>Jusque dans les années 70 la forme d'organisation dominante est celle des grandes firmes de type dit Fordiste (travail à la chaîne) qui intègrent verticalement dans la même entité juridique les multiples activités nécessaires à la réalisation d'un produit. Dans les années 80, la forme multidivisionnelle, CAD une firme organisée en centres de profit autonomes. Chaque entité/centre fait partie d'une organisation distincte prenant en charge un segment de la chaîne de valeur. Cette organisation des firmes acte un découpage de la chaîne de valeur en amont et rend possible la localisation à travers le monde de chacun des segments du système productif sur les territoires qui ont le plus d'avantages pour les accueillir.</p>
<p>Ce mouvement d'internationalisation de la chaîne de valeur est rendu possible grâce à plusieurs évolutions durant les années 80 :</p>
<ul>
<li>la libéralisation commerciale avec notamment la création de l'OMC et la signature de nombreux accords internationaux ou régionaux ;</li>
<li>l'innovation / le progrès dans le domaine du transport avec les conteneurs et porte-conteneurs qui ont permis une baisse des coûts du commerce ;</li>
<li>le développement des technologies d'information et des communications qui facilitent la communication entre les différentes entreprises impliquées dans la chaîne de valeur mondiale ;</li>
<li>l'essor de la globalisation financière qui a facilité les investissements de capitaux entre pays ;</li>
<li>l'essor de la gouvernance dite actionnariale qui a poussé les entreprises à rechercher davantage de profits et à créer plus de valeur ajoutée.</li>
</ul>
<h5>1) La stratégie des firmes</h5>
<div class="exo"><div class="exo-t">Exercice vidéo — chaîne de valeur</div>
<p><b>1. Qu'est-ce que la chaîne de valeur ?</b><br>La chaîne de valeur est un outil permettant de distinguer les étapes nécessaires pour la création de valeur pour un ou des produits, de l'approvisionnement en matière première au service après-vente.</p>
<p><b>2. Qu'est-ce que l'internationalisation de la chaîne de valeur ?</b><br>L'internationalisation de cette chaîne de valeur c'est lorsqu'une entreprise décide d'implanter des étapes de leur chaîne de valeur dans des pays différents.</p>
<p><b>3. Pourquoi adopter ce comportement ?</b><br>Compétitivité prix ou hors prix : les E essayent de tirer parti des avantages comparatifs des différents pays ou alors cela peut être une stratégie de marché lorsque l'entreprise cherche à se rapprocher d'une demande dynamique ou encore à une stratégie d'approvisionnement en matière première.</p>
<p><b>4. Quelles formes cela peut prendre ?</b></p>
<ul><li>Par des investissements directs à l'étranger (IDE) lorsqu'une entreprise possède plus de 10&nbsp;% du capital d'une firme</li>
<li>Confiant une étape de valeur en sous-traitance</li>
<li>Quand une entreprise autorise à un autre E d'utiliser sa marque</li>
<li>La vente de la licence à d'autres E</li></ul></div>
<div class="def"><p><b>FTN = firme transnationale ou internationale :</b> entreprise constituée d'une société mère qui se situe dans le pays d'origine et l'ensemble des entreprises détenues et contrôlées par la société mère sont appelées filiales.</p></div>
<p>Le déploiement des firmes à l'international peut passer par un recours à la sous-traitance, par les partenariats ou les alliances. La financiarisation de l'économie tend à imposer une conception de la firme comme portefeuille d'activités qu'il faut continuellement recomposer pour maximiser la valeur actionnariale. Les firmes ont alors tendance à se recentrer sur leur cœur de métier CAD les étapes qui ont la plus grande valeur ajoutée et céder les autres.</p>
<p>Émerge alors un nouveau type d'organisation industrielle : la <b>firme réseau</b>, qui peut être définie comme un réseau de production verticalement intégré constitué d'entreprises juridiquement indépendantes coordonnées par une firme leader (comme une partie des holdings). Cette internationalisation de la chaîne de valeur se traduit par un poids important des firmes multinationales dans les économies domestiques. Ainsi en 2015, 2,2&nbsp;% des firmes multinationales en France étaient à l'origine de 50&nbsp;% de la valeur ajoutée et représentaient la moitié des effectifs salariés.</p>
<div class="def"><p><b>IDE = Investissement direct à l'étranger</b> = investissement d'une entreprise dans une société étrangère dont elle acquiert au moins 10&nbsp;% du capital ou des droits de propriété.</p></div>
<p>Les entreprises peuvent réaliser des <b>IDE verticaux</b> dits de délocalisation grâce à la division internationale du travail. Les pays émergents peuvent signer des accords de sous-traitance pour réaliser des tâches nécessitant un travail non-qualifié qui était jusque-là produit dans les pays du nord.</p>
<p>Il en résulte une baisse de la demande de travail non-qualifié dans les pays non développés ce qui accentue les inégalités. Dans les pays en développement les inégalités sont également renforcées parce que la demande de travail peu qualifié fait augmenter les revenus de ceux qui possèdent quelques qualifications.</p>
<div class="rem"><p><b>Remarque :</b> l'intensité des tâches est toutefois plus intensive en travail qualifié que par le passé dans les pays en développement.</p></div>
<p>Les <b>IDE horizontaux</b> consistent à disperser sur différents territoires des processus de production plus ou moins semblables pour se rapprocher de la demande de marché et de ses spécificités, réduire les coûts de production liés aux transports et contourner les barrières douanières et tarifaires. Ainsi pour alléger les coûts les entreprises peuvent multiplier les implantations et ainsi également réduire la pression fiscale.</p>
<p><b>Illustration — l'iPhone :</b> La production du smartphone d'Apple permet d'illustrer le concept de chaîne de valeur mondiale. En effet, l'iPhone est conçu en Californie mais sa production nécessite les 5 continents. Les matières premières viennent d'Afrique du Sud, d'Asie et d'Océanie. Les différentes composantes sont fabriquées en Asie du Sud-Est mais le contrôle de l'écran reste aux États-Unis, d'autres éléments encore viennent d'Europe. Tous ces biens intermédiaires sont assemblés en Chine dans des usines sous-traitantes, le produit final est exporté vers les différents marchés où il est mis à disposition du consommateur grâce aux réseaux commerciaux d'Apple.</p>
<div class="exo"><div class="exo-t">Exercice — réagir (courbe du sourire)</div>
<p><b>2-</b> Le choix de localisation d'une entreprise comme Apple se décide en fonction des règles de commerce internes aux pays étrangers qui proposent les meilleurs avantages à l'implantation pour une division de la production des tâches à faible valeur ajoutée. Ainsi elle déploie les assemblages dans les pays d'Asie «&nbsp;low cost&nbsp;» puis importe les composants à forte capacité technologique des pays développés et ramène après la production au sein de sa nation, les USA, pour la R&D et le design.</p>
<p><b>3-</b> Le passage «&nbsp;L'ouverture des frontières et l'essor des technologies de l'information ont d'ailleurs permis depuis les années 2000 "d'approfondir" la courbe du sourire, en permettant de délocaliser les tâches peu intenses en valeur ajoutée et en travail qualifié dans les pays émergents&nbsp;» montre que l'ouverture des frontières et les nouvelles technologies ont permis à des FTN comme Apple de «&nbsp;creuser&nbsp;» la courbe du sourire en gardant chez elles les tâches à forte valeur ajoutée (design, R&D) et en délocalisant les tâches peu qualifiées et répétitives dans les pays émergents. Résultat : ces pays ont vu arriver beaucoup d'emplois industriels, souvent mal payés et peu qualifiés, mais qui ont quand même permis une montée en compétence progressive dans certains secteurs. Ainsi, Apple et d'autres FTN ont participé à l'évolution de la qualité de l'emploi dans ces pays, mais de façon inégale, en créant surtout des postes bas de gamme au début, dépendants des coûts bas proposés et de la demande internationale profitant des avantages comparatifs.</p></div>`,
savoir:[

{num:"3.5", short:"Les effets induits du commerce international ; libre-échange et protectionnisme",
text:"Comprendre les effets induits par le commerce international : gains moyens en termes de baisse de prix, réduction des inégalités entre pays, accroissement des inégalités de revenus au sein de chaque pays ; comprendre les termes du débat entre libre-échange et protectionnisme.",
cours:`
<h4>A — Les avantages liés à l'échange</h4>
<div class="def"><p><b>Libre-échange</b> = théorie qui préconise la suppression des entraves à l'échange.</p></div>
<p>Le libre-échange serait favorable aux consommateurs car ils pourraient accéder à une plus grande variété de biens à des prix moindres. La spécialisation du libre-échange permet des gains de productivité car au fur et à mesure que les coûts des commerces diminuent, le poids des firmes exportatrices augmente et les firmes les plus performantes gagnent des parts de marché. Dans le même temps, la concurrence étrangère fait disparaître les firmes domestiques les moins efficaces. La concurrence internationale a donc des effets différents selon les firmes et leur niveau de productivité.</p>
<p>Le commerce international engendre une réallocation des ressources en main d'œuvre des entreprises les moins productives vers les entreprises les plus productives faisant augmenter la productivité moyenne et le bien-être moyen. Le commerce agit sur l'incitation à innover au travers de la taille de marché et de l'effet de la concurrence. Les entreprises en frontière sont davantage invitées à innover que celles qui sont plus reculées. Un déroulé vertueux est donc possible grâce au libre-échange car les biens de compétitivité permettent de baisser les prix ce qui facilite les exportations.</p>

<h4>B — Les limites du libre-échange</h4>
<h5>1 / Le libre-échange, domination et dépendance</h5>
<div class="exo"><div class="exo-t">Exercice — évolution des inégalités</div>
<p><b>Montrez l'évolution des inégalités en dehors et au sein du pays.</b><br>D'après l'évolution historique des inégalités mondiales de revenus en coefficient de Theil de 1870 à 2011 en fonction des inégalités globales, entre pays et à l'intérieur, on voit que depuis 1870 les inégalités globales ont augmenté légèrement passant de 0.7 à 0.9 en 1990. En revanche on peut remarquer que bien que l'évolution des inégalités globales semble constante, au niveau des inégalités au sein des pays et entre pays, qui composent la tendance globale, il y a eu une inversion entre le taux d'inégalité au sein des pays et celles entre les pays. En effet là où avant 1930, les inégalités au sein du pays étaient plus importantes que celles entre les pays, à hauteur de 0.5 points constant jusqu'à 1910 contre 0.2 pour les inégalités entre pays en 1870. Cependant on a pu remarquer que de la période de 1870 à 1910, là où le taux d'inégalités était stable, les inégalités entre les pays, elles, ont augmenté de 0.2 points, venant à devenir majoritaires à partir de 1935 suite à la baisse des inégalités au sein des pays survenue à partir de 1910. Ainsi depuis 1960 la tendance a de nouveau su se stabiliser pour les 2 types d'inégalités. On peut expliquer cette évolution notamment avec la démocratisation des libres échanges et le grand développement des pays émergents devenus des puissances économiques comme la Chine ou l'Inde, ayant moins de restrictions vis-à-vis du mode de production et donc agrandissant le fossé d'inégalité face aux pays restreints par des codes sociaux et moraux dans le processus productif. Pourtant on peut voir que toujours d'après le graphique, depuis les années 2000 on a une baisse des inégalités globales et entre pays de 0.2 points en 10 ans, explicable notamment grâce à la création de l'OMC en 1995 qui a su avoir des effets sur les droits de douanes et surtout avec l'arrivée des nouvelles normes écologiques de plus en plus prises au sérieux au cours du XXIe siècle.</p></div>
<p>Pour cerner de manière pertinente les effets du commerce international sur les inégalités il convient de distinguer l'inégalité internationale et l'inégalité interne aux nations. L'inégalité internationale mesure les écarts de revenus moyens des différents pays tandis que les inégalités internes chiffrent les écarts de revenus au sein de la nation. Les travaux de <b>François Bourguignon</b> identifient depuis les années 90 un recul des inégalités internationales qui s'explique notamment par l'émergence de grandes nations comme l'Inde et la Chine qui en s'insérant dans l'échelle de valeur mondiale ont connu un rattrapage économique permettant l'émergence d'une vaste classe moyenne. En parallèle on constate une augmentation des inégalités au sein des pays. Pour <b>Krugman</b> lorsque les barrières aux échanges sont faibles, l'activité économique a tendance à se concentrer dans les métropoles dynamiques au détriment des périphéries pour bénéficier des effets d'agglomération.</p>
<p>L'effet <b>SUPERSTAR</b> montre qu'en interagissant avec le progrès technique, la mondialisation commerciale renforce les inégalités à l'intérieur de la nation. Par exemple les NTIC permettent aux offreurs de s'adresser à un marché planétaire en développant des outils numériques et ainsi conquérir des parts de marché.</p>
<h5>2 / Le libre-échange peut fragiliser l'économie nationale</h5>
<p>L'ouverture internationale réduit l'autonomie des choix politiques et économiques ainsi un pays qui effectue une politique de relance tout seul verra les capitaux fuir entraînant une baisse des taux de change et donc une dégradation de la balance commerciale. Un pays doit donc mener une politique cohérente de celle de ses voisins.</p>
<div class="def"><p><b>Délocalisation</b> = fermeture d'une entreprise nationale pour en ouvrir une dans un autre pays aux conditions favorables.</p></div>
<p>Une entreprise peut sous-traiter ou externaliser une partie de sa production ce qui peut avoir un effet indirect sur l'emploi quand la sous-traitance se fait dans des pays étrangers. De plus suivant l'évolution de la situation de marché, une activité peut être réinternalisée ou au contraire externalisée.</p>
<p>Les conséquences de la mondialisation sont différentes selon les pays. En effet les pays producteurs de matières premières sont dépendants de la demande et notamment celle des pays développés. Le libre-échange a engendré une division internationale du travail (DIT) correspondant au besoin des pays développés à l'économie de marché. (Exemple : l'URSS, tout était dirigé par l'État.)</p>
<h5>3 / Le protectionnisme, réponse aux limites du libre-échange</h5>
<p><b>A- Les fondements du protectionnisme</b></p>
<div class="exo"><div class="exo-t">Exercice — protectionnisme éducateur</div>
<p><b>4/</b> Les industries naissantes supportent des coûts de production plus élevés que des concurrents étrangers déjà présents sur le marché car ces dernières, débutant seulement leurs activités, font face à un manque d'expérience de production appelé «&nbsp;effet d'apprentissage&nbsp;» mais aussi ne profitent pas, du fait de leur petite taille, d'avantages d'économies d'échelle dont leurs grandes firmes en tirent profit.</p>
<p><b>5/</b> Pour pouvoir grandir et se préparer et se solidifier dans leur production et leur taille, ces petites entreprises ont besoin de protection pour pouvoir grandir sans se faire dépasser dès le début d'activité.</p>
<p><b>6/</b> Si on suit cette thèse, le protectionnisme aurait plus vocation à être temporaire sur le début de l'activité des industries naissantes en tant que protection transitoire pour durer jusqu'à ce que la production soit assez grande pour pouvoir peser autant que les industries étrangères qui viennent s'installer.</p>
<p><b>7/</b> Ce «&nbsp;protectionnisme éducateur&nbsp;» est caractérisé comme offensif car il ne permet pas à la concurrence internationale de gagner des parts de marché face à des plus petites et moins efficientes entreprises pour les permettre de grandir jusqu'à devenir un sérieux concurrent pour ces derniers.</p></div>
<p>Les pays peuvent pratiquer le protectionnisme quand ils refusent d'abandonner certaines activités ou certains secteurs (stratégiques, culturels, etc.). Le protectionnisme éducateur peut être mis en place pour laisser le temps à une entreprise de grandir et d'être apte à affronter la concurrence ou encore pour laisser le temps à certains secteurs pour se moderniser. Ce type de protectionnisme peut passer par des subventions, il y a donc un coût pour l'État, il doit être temporaire. En parallèle les importations dans le secteur protégé continuent librement (il n'y a pas de barrière douanière ou tarifaire).</p>
<p><b>B- Les avantages et inconvénients du protectionnisme</b></p>
<div class="exo"><div class="exo-t">Exercice — instruments du protectionnisme</div>
<p><b>1)</b> Les droits de douanes peuvent limiter le commerce international car ils parviennent à augmenter le prix d'un produit arrivé sur le marché intérieur pour combler cet écart de prix avec les produits étrangers.</p>
<p><b>2)</b><br>a = Protectionnisme tarifaire «&nbsp;subventions publiques&nbsp;»<br>b = Protectionnisme tarifaire «&nbsp;baisse du taux de change&nbsp;»<br>c = Protectionnisme tarifaire «&nbsp;droits de douanes&nbsp;»<br>d = Protectionnisme non-tarifaire «&nbsp;Normes sanitaires ou techniques&nbsp;»<br>e = Protectionnisme tarifaire «&nbsp;droits de douanes&nbsp;»<br>f = Protectionnisme non-tarifaire «&nbsp;Règle du contenu local&nbsp;»</p></div>
<div class="exo"><div class="exo-t">Exercice — justification du protectionnisme (protectionnisme défensif)</div>
<p><b>8)</b><br>a/ Sécurité nationale<br>b/ Dumping, dumping social, fiscal et/ou environnemental<br>c/ Nécessité de restructurer un secteur et de protéger l'emploi<br>d/ Sécurité alimentaire</p>
<p><b>9)</b> Le dumping est considéré comme une concurrence déloyale car comme le dumping est défini comme le fait de vendre à un prix inférieur aux coûts de production. Lorsqu'un État allège les contraintes sociales (bas salaires, faible protection des travailleurs), fiscales (faibles impôts sur les sociétés) ou environnementales (faibles normes antipollution) qui pèsent sur ses entreprises, il leur permet de produire à des coûts beaucoup plus faibles que les entreprises des pays où ces normes sont plus strictes (comme en Europe ou aux États-Unis). Cette situation est considérée comme une concurrence déloyale car la différence de prix à l'exportation ne résulte pas d'une meilleure productivité ou d'une innovation, mais d'un avantage artificiel créé par l'État. Cela désavantage les producteurs étrangers qui respectent des normes coûteuses et peut entraîner des pertes d'emplois dans les pays importateurs.</p>
<p><b>10)</b> Les formes de protectionnisme présentées (protection des industries vieillissantes, lutte contre le dumping, sécurité alimentaire et sécurité nationale) sont qualifiées de défensives car leur objectif principal n'est pas de conquérir de nouveaux marchés (protectionnisme offensif) mais de protéger l'économie nationale, l'emploi, et les intérêts vitaux du pays contre une menace extérieure.</p>
<ul><li>Défendre l'emploi et les secteurs (vieillissants ou soumis à concurrence déloyale) pour éviter le chômage et la désindustrialisation.</li>
<li>Défendre l'indépendance et la souveraineté (sécurité nationale et alimentaire) pour ne pas dépendre de l'étranger pour des biens stratégiques.</li>
<li>Il s'agit de réagir aux défaillances du marché ou aux pratiques jugées agressives d'autres pays.</li></ul></div>
<p>Généralement c'est la peur du chômage qui engendre des mesures protectionnistes car il permet de lutter contre le dumping fiscal et social fait par les autres. Le dumping social consiste à créer une concurrence entre les travailleurs en jouant sur le niveau de protection sociale. Le dumping fiscal quant à lui consiste à mettre en place des règles plus avantageuses.</p>`,
savoir:[
"<b>Définitions :</b> libre-échange, délocalisation, dumping (vendre à un prix inférieur aux coûts de production), dumping social / fiscal, protectionnisme éducateur, protectionnisme offensif / défensif, DIT.",

cards:[
{q:"Quels sont les effets induits par le commerce international ?",
a:`<p><b>Le commerce international induit des gains moyens (baisse des prix, hausse de la productivité), une réduction des inégalités entre pays, mais un accroissement des inégalités au sein de chaque pays.</b></p><p>Car le libre-échange est favorable aux consommateurs, qui accèdent à une plus grande variété de biens à des prix moindres, et il engendre une réallocation des ressources en main d'œuvre des entreprises les moins productives vers les plus productives, faisant augmenter la productivité moyenne et le bien-être moyen.</p><p>En effet, les travaux de François Bourguignon identifient depuis les années 90 un recul des inégalités internationales, expliqué par l'émergence de grandes nations comme l'Inde et la Chine qui, en s'insérant dans la chaîne de valeur mondiale, ont connu un rattrapage économique permettant l'émergence d'une vaste classe moyenne. En parallèle, on constate une augmentation des inégalités au sein des pays : pour Krugman, l'activité se concentre dans les métropoles dynamiques au détriment des périphéries (effets d'agglomération), et l'effet superstar montre que la mondialisation, en interagissant avec le progrès technique, renforce les inégalités internes.</p>`},
{q:"Le libre-échange est-il toujours avantageux ?",
a:`<p><b>Le libre-échange procure des gains réels mais présente des limites qui peuvent fragiliser l'économie nationale et creuser les inégalités internes.</b></p><p>Car, du côté des avantages, il offre aux consommateurs variété et prix moindres, permet des gains de productivité par la spécialisation et incite à innover via la taille de marché et l'effet de concurrence.</p><p>Mais en effet, la concurrence étrangère fait disparaître les firmes domestiques les moins efficaces ; l'ouverture internationale réduit l'autonomie des choix politiques (un pays qui relance seul voit les capitaux fuir, son taux de change baisser et sa balance commerciale se dégrader) ; les délocalisations et la sous-traitance à l'étranger ont un effet indirect sur l'emploi ; et les pays producteurs de matières premières restent dépendants de la demande des pays développés (DIT).</p><p>Illustration : recul des inégalités entre pays (Bourguignon) mais hausse des inégalités au sein des pays (Krugman, effet superstar) — d'où le débat sur le recours au protectionnisme.</p>`},
{q:"Qu'est-ce que le protectionnisme éducateur ?",
a:`<p><b>Le protectionnisme éducateur est une protection temporaire mise en place pour laisser le temps à une entreprise naissante de grandir et d'être apte à affronter la concurrence, ou à certains secteurs de se moderniser.</b></p><p>Car les industries naissantes supportent des coûts de production plus élevés que leurs concurrents étrangers déjà présents : elles font face à un manque d'expérience de production (l'«&nbsp;effet d'apprentissage&nbsp;») et, du fait de leur petite taille, ne profitent pas des économies d'échelle des grandes firmes.</p><p>En effet, ce protectionnisme peut passer par des subventions — il y a donc un coût pour l'État et il doit être temporaire ; en parallèle, les importations dans le secteur protégé continuent librement (pas de barrière douanière ou tarifaire). Il est qualifié d'offensif car il vise à faire grandir les entreprises jusqu'à devenir de sérieux concurrents.</p>`},
{q:"Pourquoi le dumping est-il considéré comme une concurrence déloyale ?",
a:`<p><b>Le dumping — vendre à un prix inférieur aux coûts de production — est une concurrence déloyale car l'avantage de prix est artificiel, créé par l'État, et non le fruit d'une meilleure productivité.</b></p><p>Car lorsqu'un État allège les contraintes sociales (bas salaires, faible protection des travailleurs), fiscales (faibles impôts sur les sociétés) ou environnementales (faibles normes antipollution), il permet à ses entreprises de produire à des coûts beaucoup plus faibles que celles des pays où ces normes sont plus strictes.</p><p>En effet, cela désavantage les producteurs étrangers qui respectent des normes coûteuses et peut entraîner des pertes d'emplois dans les pays importateurs — c'est généralement la peur du chômage qui engendre des mesures protectionnistes.</p><p>Précisions du cours : le dumping social consiste à créer une concurrence entre travailleurs en jouant sur le niveau de protection sociale ; le dumping fiscal à mettre en place des règles fiscales plus avantageuses.</p>`},
{q:"Quels sont les instruments et les justifications du protectionnisme défensif ?",
a:`<p><b>Le protectionnisme défensif vise à protéger l'économie nationale, l'emploi et les intérêts vitaux du pays contre une menace extérieure, et non à conquérir de nouveaux marchés.</b></p><p>Car ses justifications sont : la sécurité nationale, la lutte contre le dumping (social, fiscal, environnemental), la nécessité de restructurer un secteur et de protéger l'emploi, et la sécurité alimentaire.</p><p>En effet, ses instruments sont tarifaires (droits de douane qui augmentent le prix des produits étrangers sur le marché intérieur, subventions publiques, baisse du taux de change) ou non tarifaires (normes sanitaires ou techniques, règle du contenu local).</p><p>Il s'agit de réagir aux défaillances du marché ou aux pratiques jugées agressives d'autres pays : défendre l'emploi pour éviter le chômage et la désindustrialisation, et défendre l'indépendance pour ne pas dépendre de l'étranger pour des biens stratégiques.</p>`}
]}
]});

text:"Savoir distinguer la mobilité sociale intergénérationnelle des autres formes de mobilité (géographique, professionnelle).",
cours:`
<h4>I — La mobilité sociale</h4>
<p>La mobilité sociale est au cœur des démocraties et est l'idéal de nos sociétés. Au sens général la mobilité désigne la situation d'une situation à l'autre. On peut ainsi comparer la situation du père avec celle du fils. On parle alors de mobilité inter-générationnelle. La question de la mobilité renvoie au problème de l'égalité des chances et interroge sur les valeurs de la société.</p>
<h4>A — Les différentes formes de mobilités</h4>
<p>Dans une société les positions ne sont pas le fruit du hasard mais sont liées à l'origine sociale de l'individu ainsi qu'à son parcours de vie. L'école et la formation professionnelle sont des éléments déterminants d'autant que le statut social ne se transmet pas de la même manière au sein des différents groupes sociaux. La mobilité peut s'exercer au sein de la structure sociale :</p>
<ul>
<li><b>la mobilité verticale</b> = changement de position dans la structure qui a un effet sur la progression de la régression dans la hiérarchie sociale. On peut aussi parler de mobilités ascendante ou descendante, cette dernière pouvant être assimilée à la notion de déclassement social (confère la notion d'ascenseur social) ;</li>
<li><b>la mobilité sociale horizontale</b> qui correspond à une situation dans laquelle un individu garde la même position sociale hiérarchiquement parlant (ouvriers / employés).</li>
</ul>
<p>Les années 60 garantissaient un emploi stable et à plein temps, l'enjeu sociétal était donc tourné vers les mobilités ascendantes CAD avoir un emploi plus prestigieux et mieux rémunéré que ses parents. Mais les chocs pétroliers ont engendré une montée du chômage et une précarisation de l'emploi ce qui a modifié la donne. On peut donc constater en ce qui concerne les défavorisés il y a un risque de mobilité descendante vers le nouveau prolétariat caractérisé par la précarité, le chômage et l'exclusion. De plus le malaise des classes moyennes est lié au fait que les diplômes ne garantissent plus l'accès à un emploi stable.</p>
<p>La <b>mobilité structurelle</b> est la mobilité due aux modifications générales de la structure sociale. Elle est en lien avec les changements de la structure sociale (moins d'agriculteurs, plus de cadres) = tertiarisation.</p>
<p>Le PT est un facteur explicatif, en effet il influe sur les types d'emplois tout comme la modification des biens et services des ménages. Les individus trouvent donc une place ou pas en fonction des évolutions (confère Chapitre 2 : comment est structurée la société française actuelle ?).</p>
<p>Il convient encore de distinguer :</p>
<ul>
<li><b>la mobilité intra-générationnelle :</b> qui correspond à la mobilité au cours d'une carrière CAD lorsqu'un individu change de PCS au cours de sa vie d'adulte ;</li>
<li><b>la mobilité inter-générationnelle :</b> qui est entre 2 générations, le statut d'un individu est donc différent de celui de son milieu d'origine.</li>
</ul>
<p>La mobilité peut avoir une dernière origine : celle liée au monde du travail. 2 types de mobilités :</p>
<ul>
<li><b>les mobilités géographiques :</b> qui sont des migrations internes ou externes au pays qui n'engendrent pas toujours de modifications du milieu social mais cela peut conduire à l'exode rural ou à l'émigration ;</li>
<li><b>la mobilité professionnelle :</b> c'est le changement d'entreprise ou de type de travail qui n'engendre pas forcément de changement de statut social.</li>
</ul>
<p>Les différentes formes de mobilités se renforcent mutuellement, les changements de métiers, d'entreprise, de statut, favorisent une mobilité intra-générationnelle. Elle témoigne également du degré de démocratisation d'une société, en effet dans une société démocratique on revendique l'égalité des chances (= méritocratie : l'individu a sa place dû à son mérite et non grâce à son réseau ou son milieu social).</p>
<p>Si la mobilité sociale par nature se fait dans des sociétés stratifiées connaissant des différences de statuts sociaux, il n'en demeure pas moins qu'elle est valorisée dans les sociétés ouvertes aux changements.</p>`,

a:`<p><b>On distingue la mobilité verticale (ascendante ou descendante), la mobilité horizontale, la mobilité intergénérationnelle, la mobilité intragénérationnelle, ainsi que les mobilités géographique et professionnelle.</b></p><p>Car la mobilité verticale est un changement de position qui fait progresser ou régresser dans la hiérarchie sociale (la descendante pouvant être assimilée au déclassement social), tandis que la mobilité horizontale correspond à une situation où l'individu garde la même position hiérarchique (ouvriers / employés).</p><p>En effet, la mobilité intergénérationnelle compare le statut d'un individu à celui de son milieu d'origine (le père et le fils), alors que la mobilité intragénérationnelle correspond au changement de PCS au cours de la vie d'adulte.</p><p>Illustration : dans une société démocratique, la mobilité renvoie à l'égalité des chances — la méritocratie, où l'individu doit sa place à son mérite et non à son réseau ou son milieu social.</p>`},

text:"Comprendre les principes de construction, les intérêts et les limites des tables de mobilité comme instrument de mesure de la mobilité sociale.",
cours:`
<h4>B — Les tables de mobilités</h4>
<div class="exo"><div class="exo-t">Questionnaire portant sur la vidéo</div>
<p><b>1. Qu'est-ce qu'une table de mobilité sociale ?</b><br>Une table de mobilité sociale est un outil statistique qui permet de mesurer et d'analyser les déplacements des individus ou des groupes entre différentes positions sociales (par exemple, des catégories socioprofessionnelles) au cours du temps, généralement entre deux générations (mobilité intergénérationnelle) ou au sein d'une même carrière (mobilité intragénérationnelle).</p>
<p><b>2. Quel type de mobilité les tables de mobilité permettent-elles d'étudier ?</b><br>La mobilité intragénérationnelle : évolution de la position sociale d'un individu au cours de sa carrière (ex. : un employé qui devient manager). La mobilité intergénérationnelle : comparaison de la position sociale des enfants avec celle de leurs parents (ex. : un enfant d'ouvrier qui devient cadre).</p>
<p><b>3. Pourquoi le «&nbsp;champ&nbsp;» des tables de mobilité concerne le plus souvent la classe d'âge allant de 40 à 59 ans ?</b><br>Stabilité professionnelle : à 40-59 ans, les individus ont généralement atteint une position sociale stable, ce qui permet d'éviter les biais liés aux débuts de carrière ou aux transitions précoces. Équilibre générationnel : elle permet de comparer des générations complètes (parents et enfants) sans inclure des individus trop jeunes ou en fin de carrière. Représentativité : cette tranche couvre une période où les individus sont actifs et où les données sont plus fiables.</p>
<p><b>4. Quelle mobilité présente la table des effectifs ?</b><br>La table des effectifs (ou table de flux) présente les mouvements bruts entre les catégories sociales. Elle indique le nombre absolu d'individus passant d'une catégorie d'origine à une catégorie de destination. Par exemple : «&nbsp;1000 enfants d'ouvriers sont devenus cadres&nbsp;».</p>
<p><b>5. Qu'exprime la table des destinées ? Quelles sont ses unités ?</b><br>La table des destinées (ou table de probabilités conditionnelles) exprime la probabilité qu'un individu issu d'une catégorie sociale d'origine accède à une catégorie sociale de destination. Elle répond à la question : «&nbsp;Parmi les enfants d'ouvriers, quelle proportion devient cadre ?&nbsp;» Unité : pourcentage (%) ou probabilité (entre 0 et 1).</p>
<p><b>6. Qu'exprime la table des recrutements ? Quelles sont ses unités ?</b><br>La table des recrutements (ou table de probabilités marginales) montre la contribution relative de chaque catégorie d'origine à une catégorie de destination. Elle répond à la question : «&nbsp;Parmi tous les cadres, quelle proportion est issue de la catégorie des ouvriers ?&nbsp;» Unité : pourcentage (%) ou probabilité (entre 0 et 1).</p>
<p><b>7. Quels sont les principaux avantages des tables de mobilité ?</b></p>
<ul><li>Mesure objective : elles fournissent une représentation quantitative et comparable de la mobilité sociale.</li>
<li>Analyse des inégalités : elles permettent d'identifier les barrières ou les facilités de mobilité entre catégories sociales.</li>
<li>Comparaisons temporelles ou spatiales : elles facilitent l'étude des évolutions dans le temps ou entre pays.</li>
<li>Outils pour les politiques publiques : elles aident à évaluer l'efficacité des mesures visant à réduire les inégalités.</li></ul>
<p><b>8. Quelles sont les limites des tables de mobilité ?</b></p>
<ul><li>Simplification des catégories : les catégories socioprofessionnelles sont des regroupements qui peuvent masquer des réalités plus nuancées.</li>
<li>Biais de sélection : certaines populations (ex. : chômeurs, inactifs) sont parfois exclues ou mal représentées.</li>
<li>Effets de structure : les changements dans la structure des emplois (ex. : déclin de l'industrie) peuvent fausser l'interprétation de la mobilité.</li>
<li>Données rétrospectives : les tables dépendent de la qualité des données déclaratives, qui peuvent être biaisées par la mémoire ou la subjectivité.</li>
<li>Mobilité horizontale ignorée : elles ne captent pas toujours les déplacements entre catégories de même niveau hiérarchique (ex. : un employé qui change de secteur sans promotion).</li></ul></div>

<h5>1 — La construction des tables de mobilités</h5>
<p>Les tables de mobilités sont des tableaux à double entrée montrant l'origine sociale des hommes d'une génération et la destination du fils. Une table de mobilités présente donc sous forme synthétique les effectifs de l'enquête avec généralement en colonnes la position du fils et en ligne celle du père et donc la position sociale d'origine. Ces tables sont établies par l'INSEE sur la base des professions exercées par les actifs entre 40 et 59 ans. On distingue 2 sortes de tables :</p>
<ul>
<li><b>les tables de recrutement</b> qui permettent de savoir ce que faisaient les parents des fils appartenant à une CSP donnée ; elles répondent à la question «&nbsp;d'où viennent les fils&nbsp;» ;</li>
<li><b>les tables de destinée</b> qui permettent de savoir ce que deviennent les fils originaires d'une CSP donnée ; elles répondent à la question «&nbsp;que deviennent les fils de&nbsp;».</li>
</ul>
<div class="exo"><div class="exo-t">Exercice — table de recrutement</div>
<ol>
<li>Dans la première colonne du tableau, le chiffre en rouge représente la part d'ouvriers issus d'une famille d'agriculteurs, et dans la 6e colonne 56.8&nbsp;% des ouvriers sont issus de parents ouvriers.</li>
<li>La part de cadres dont le père était ouvrier est de 19.9&nbsp;% contre 30.3&nbsp;% lorsque le père était lui-même cadre.</li>
<li>La diagonale de chiffres sur ce tableau représente la part de fils étant issus de la même PCS que leurs parents. La ligne ensemble quant à elle représente la part de la catégorie de PCS dans les fils de l'ancienne génération face aux autres PCS.</li>
<li>La très forte différence entre les tables de destinée et de recrutement pour les agriculteurs s'explique par la combinaison d'une fermeture sociale extrême et du déclin démographique de la profession. L'immobilité sociale des agriculteurs est la plus élevée de toutes les catégories (84,1&nbsp;% des fils d'agriculteurs le deviennent), ce qui se traduit dans la table de destinée. En revanche, comme la profession a connu une diminution forte de ses effectifs au fil du temps, elle recrute très peu de nouveaux membres en dehors du cercle familial. Par conséquent, la proportion d'agriculteurs ayant une origine sociale autre qu'agriculteur est très faible (10,1&nbsp;% du recrutement total), ce qui est le chiffre clé dans la table de recrutement.</li>
</ol></div>
<p>Ces tables de mobilités sont transversales, elles résultent d'enquêtes sur l'emploi. Depuis 1953 et dans les années 70 s'ajoute une nouvelle enquête «&nbsp;formation et qualification professionnelle&nbsp;» (FQP). Les individus n'ont pas la même profession toute leur vie mais on n'en considère qu'une seule, par convention on considère celle du fils au moment de l'enquête et celle du père au moment où le fils termine ses études. On mesure ainsi la mobilité inter-générationnelle et non la mobilité intra-générationnelle.</p>
<div class="exo"><div class="exo-t">Exercice vidéo — limites</div>
<p><b>Q1 Illustrez comment les tables de mobilité permettent de rendre compte des évolutions de la structure sociale. Sont-elles toutes repérables ?</b><br>Les tables de mobilités permettent de se rendre compte des évolutions de la structure sociale : en comparant la répartition des emplois entre les générations (parents / enfants) ou en comparant la salarisation entre les générations, étudier l'évolution du niveau de qualification.</p>
<p><b>Q2 Quel est le deuxième avantage des tables ?</b><br>Il permet de mesurer si une société est juste en évaluant la méritocratie des «&nbsp;fils de…&nbsp;» ou en étudiant la mobilité des individus en fonction de leur PCS.</p>
<p><b>Q3 Quelles sont les limites des tables de mobilité ?</b><br>Les limites de ces tables résident autant dans leur structure en comparant des situations complexes comme celle des salariés et des non-salariés ou parce qu'elles comparent les PCS elles-mêmes or certaines PCS sont proches (ouvriers / employés). Les tranches d'âge aussi sont jugées comme trop larges car laissant assez de temps pour évoluer dans le monde du travail et donc de rendre ces études obsolètes. De l'autre côté elles sont aussi difficiles à mettre en place car elles arrivent difficilement à analyser la mobilité des femmes car la salarisation est dite différente de celle des hommes. En plus les évolutions des structures parentales et d'éducation évoluent entre les générations tout comme le prestige des positions sociales.</p></div>
<p>Les tables de mobilités offrent une vision synthétique de la mobilité sociale permettant une approche quantitative et renforçant la démarche scientifique des sciences sociales. Elles facilitent l'analyse de l'évolution de la mobilité au fil du temps rendant repérables les trajectoires probables ou improbables grâce aux tables de recrutement et de destinée. Elles permettent également de mettre en lumière le degré d'immobilité et donc de reproduction sociale. Les évolutions de la structure sociale (tertiarisation, salarisation et hausse des qualifications) sont visibles grâce à l'analyse des mobilités (confère Chapitre 2 : comment est structurée la société française actuelle ?).</p>

<h5>2 — Les limites des tables de mobilité</h5>
<p>Il existe un biais statistique dans la construction des tables. En effet elles sont des enquêtes déclaratives, certains individus ne connaissent pas forcément toutes les informations sur leurs pairs et certains n'hésitent pas à enjoliver certaines situations. Or pour mesurer la mobilité sociale des individus il faut avoir des infos précises.</p>
<p>L'utilisation des PCS rend difficiles les comparaisons internationales. De plus il n'y en a seulement 6 or plus il y a de PCS, plus la proba d'en changer est forte. À l'inverse du fait qu'il y en a très peu, il y a plus de chances de mesurer des reproductions sociales. De plus, plus la classification des PCS est fine, CAD se décompose en sous-catégories, plus cela peut montrer des trajectoires de mobilité sociale à l'intérieur d'une catégorie (ex passage d'ouvrier à ouvrier qualifié).</p>
<p>Les tables de mobilités sont construites à un moment précis dans la vie des individus ce qui ne permet pas de rendre compte de la mobilité intra-générationnelle (âge père / âge du fils).</p>
<p>Les études de mobilité n'ont longtemps concerné que les hommes en raison du peu d'activité des femmes. La position sociale était appréhendée à partir de celle de leur conjoint et la mobilité par rapport à leur père (de la femme). De plus un problème souvent évoqué est que la femme à une date donnée peut être inactive (plus de précarisation, enfant) ce qui perturbe la lecture des tables. Il est donc nécessaire d'utiliser des nouveaux outils plus qualitatifs pour dépasser les limites quantitatives.</p>`,
savoir:[
"<b>Principes de construction :</b> tableau à double entrée (colonnes = position du fils, lignes = position du père), établi par l'INSEE sur les actifs de 40 à 59 ans, enquêtes emploi + enquête FQP ; convention : profession du fils au moment de l'enquête, du père quand le fils termine ses études → on mesure la mobilité INTERgénérationnelle.",
"<b>Les 2 tables à distinguer :</b> table de recrutement (« d'où viennent les fils ? ») / table de destinée (« que deviennent les fils de ? ») ; la table des effectifs (flux bruts) ; la diagonale = les immobiles (reproduction sociale).",

"<b>Limites à réciter :</b> enquêtes déclaratives (biais, enjolivement) ; seulement 6 PCS (peu de PCS → surestime la reproduction ; classification fine → mobilité intra-catégorie) ; comparaisons internationales difficiles ; photo à un moment précis (pas de mobilité intragénérationnelle) ; mobilité des femmes longtemps ignorée (position saisie via le conjoint, inactivité perturbant la lecture).",
"<b>Chiffres à mobiliser :</b> 84,1 % des fils d'agriculteurs deviennent agriculteurs (immobilité la plus forte) mais 10,1 % seulement du recrutement agricole vient d'une autre origine ; 19,9 % des fils d'ouvriers deviennent cadres contre 30,3 % des fils de cadres ; 56,8 % des ouvriers sont fils d'ouvriers."

{num:"4.3", short:"Mobilité observée, mobilité structurelle et fluidité sociale",
text:"Comprendre que la mobilité observée comporte une composante structurelle (mobilité structurelle) ; comprendre que la mobilité peut aussi se mesurer de manière relative indépendamment des différences de structure entre origine et position sociales (fluidité sociale) et qu'une société plus mobile n'est pas nécessairement une société plus fluide.",
cours:`
<h4>C — Il existe différents types de mobilités</h4>
<p>On distingue en premier lieu la <b>mobilité brute</b> qui correspond aux individus qui changent de position sociale par rapport à celle de leurs pairs. Sur la diagonale on constate donc les immobiles.</p>
<div class="rem"><p><b>Remarque :</b> si les enfants changent de PCS faute de place (qu'ils auraient dû devenir mais ne peuvent pas, genre agriculteur) on parle de <b>mobilité contrainte</b>.</p></div>
<div class="def">
<p><b>Mobilité nette</b> = mobilité brute − mobilité structurelle ; elle traduit la fluidité sociale, CAD l'égalité des chances. On parle également de mobilité pure.</p>
<p><b>Mobilité structurelle</b> = pour la constater on compare les marges que l'on rapporte à l'effectif total = ∑ |(colonne ensemble − ligne ensemble)| / 2</p></div>
<div class="exo"><div class="exo-t">Exercice — tableau CSP</div>
<p><b>Q1 - Calculer la mobilité totale :</b> (78+79+48+67+83+54) / 6 = 68.8&nbsp;%.</p>
<p><b>Q2 - Calculer le nombre d'immobiles :</b> 2 488 milles immobiles sur 7 045 milles.</p>
<p><b>Q3 - Montrez que les agriculteurs souffrent d'une mobilité contrainte.</b></p></div>
<div class="exo"><div class="exo-t">Exercice — table de mobilité fictive</div>
<p><b>Q2 - Quelle est la société la plus mobile ?</b><br>La société la plus mobile est la société fictive 2, car elle présente une proportion plus élevée d'individus changeant de position sociale par rapport à leurs parents (25&nbsp;% contre 20&nbsp;% dans la société fictive 1). Cela signifie que les trajectoires sociales y sont plus fréquemment différentes de l'origine sociale.</p>
<p><b>Q3 - En comparant les 2 sociétés fictives, est-ce que plus de mobilité signifie plus de fluidité ?</b><br>Non, plus de mobilité ne signifie pas forcément plus de fluidité. En comparant les deux sociétés fictives, on constate que la société 2 est plus mobile (25&nbsp;% de mobiles contre 20&nbsp;%), mais les inégalités des chances y sont exactement les mêmes que dans la société 1 : dans les deux cas, le rapport des probabilités relatives est de 9. Cela signifie que, même si la société 2 offre plus de mouvements sociaux, l'origine sociale continue d'influencer aussi fortement les trajectoires dans les deux sociétés. Autrement dit, la mobilité observée augmente, mais la fluidité sociale (égalité des chances) reste identique.</p></div>
<p>La mobilité structurelle découle de la transformation de la population active. Les enfants issus de CSP en déclin vont être recrutés par celles en essor. Ainsi la répartition des CSP entre le père et le fils n'est pas identique. Elle représente une part importante de la mobilité, en effet elle concernait 25&nbsp;% des individus en 2003 contre seulement 20&nbsp;% entre 2014 et 2015. Si on prend l'ex des fils d'agriculteurs, comment expliquer que seulement 1/4 le soient devenus eux-mêmes ? Cela s'explique en partie par la dureté du travail et les faibles revenus, mais il faut également prendre en compte les évolutions structurelles CAD les évolutions techniques et économiques qui ont modifié le monde agricole (la taille des exploitations a augmenté et le nombre d'emplois diminue, ils sont donc contraints à la mobilité faute de place).</p>
<div class="rem"><p>💡 <b>Remarque :</b> la mobilité observée s'explique en partie par la mobilité structurelle qui représente la mobilité minimale imposée par l'évolution de la structure de l'emploi entre 2 générations. La partie de la mobilité observée qui n'est pas structurelle est la mobilité nette. Cependant il est souvent difficile de distinguer ces 2 types de mobilités (structurelle et nette) dans les tableaux statistiques. Ainsi la mesure de la mobilité ne permet pas toujours de savoir s'il s'agit d'une mobilité contrainte ou liée aux évolutions structurelles. C'est pour cela que les sociologues se sont intéressés à la fluidité sociale.</p></div>
<p>La <b>fluidité sociale</b> consiste à mesurer la force du lien entre l'origine sociale et la position sociale indépendamment de la taille des groupes et de leurs évolutions. On peut alors l'appréhender en utilisant le rapport des chances relatives (odds ratio).</p>
<div class="def"><p><b>Fluidité sociale</b> = proba relative d'égalité des chances = odds ratio : rapport des chances relatives d'accéder aux différentes positions sociales.</p>
<p>Exemple : probabilité d'un enfant d'ouvrier de devenir cadre / probabilité d'un enfant de cadre de devenir cadre.</p>
<p><b>Mobilité brute = mobilité observée :</b> proportion de fils qui n'ont pas la même position sociale que leur père.</p></div>
<p>Dans le cadre des tables de mobilités, un rapport de chances relatives = 1 traduit l'absence de lien entre l'origine sociale et la destinée sociale. Plus la valeur du rapport diffère, plus la répartition des positions sociales est inégalitaire. Les chances d'accès sont égales quelle que soit la CSP. En France en 1977, un fils de cadre avait 28x plus de chances de devenir cadre qu'un enfant d'employé ou d'ouvrier. En 2015 ce rapport est descendu à 12, l'égalité des chances a donc baissé.</p>
<div class="rem"><p>💡 <b>Remarque :</b> il ne faut pas confondre fluidité et mobilité, ils ne sont pas synonymes. En effet l'augmentation de la mobilité peut concerner des trajectoires sociales sans changement de niveau de qualification d'une hiérarchie dans l'emploi. Dans ce cas une société est plus mobile mais n'a pas fait progresser la probabilité pour un enfant issu d'une CSP moins qualifiée d'atteindre des CSP plus qualifiées.</p></div>`,
savoir:[
"<b>Définitions incontournables :</b> mobilité brute/observée (proportion de fils n'ayant pas la position du père), mobilité structurelle (mobilité minimale imposée par l'évolution de la structure de l'emploi, formule : ∑|colonne ensemble − ligne ensemble|/2), mobilité nette = brute − structurelle, mobilité contrainte, fluidité sociale (odds ratio = rapport des chances relatives).",
"<b>Mécanisme de la mobilité structurelle :</b> les enfants issus de CSP en déclin sont recrutés par celles en essor (ex. des agriculteurs : taille des exploitations en hausse, emplois en baisse → mobilité contrainte faute de place) ; elle concernait 25 % des individus en 2003, 20 % en 2014-2015.",
"<b>Lecture de l'odds ratio :</b> rapport = 1 → absence de lien origine/destinée ; plus le rapport s'éloigne de 1, plus la société est inégalitaire. Chiffres clés : 1977 = un fils de cadre avait 28 fois plus de chances de devenir cadre qu'un enfant d'ouvrier/employé ; 2015 = 12.",
"<b>L'idée centrale de l'objectif :</b> une société plus mobile n'est pas nécessairement plus fluide — démonstration des sociétés fictives (25 % vs 20 % de mobiles mais même odds ratio de 9 : l'origine sociale pèse autant).",
"<b>À ne pas confondre :</b> mobilité ≠ fluidité — la hausse de la mobilité peut concerner des trajectoires sans changement de niveau de qualification."
],
