text:"Savoir identifier les multiples facteurs de structuration et de hiérarchisation de l'espace social (catégorie socioprofessionnelle, revenu, diplôme, composition du ménage, position dans le cycle de vie, sexe, lieu de résidence).",
cours:`
<h4>A — Comprendre la stratification sociale</h4>
<p>La hiérarchisation sociale suppose un classement des individus et des groupes d'individus selon des critères dans l'espace social. Ces critères sont à la fois sociaux et économiques (revenus, diplômes, CSP) et socio-démographiques (composition du ménage, position dans le cycle de vie, le sexe et le lieu de résidence).</p>
<p>La structuration de l'espace social se caractérise par l'existence de groupes qui composent la société et par les rapports qu'ils entretiennent entre eux. Cette structuration peut être fondée par ressemblance ou dissonance et met en évidence les goûts et les pratiques dans la société.</p>
<div class="exo"><div class="exo-t">Exercice</div>
<p><b>1/</b> Les lignages hiérarchisés en Afrique, le système de castes en Inde, les sociétés d'ordres en Europe. Ces modèles peuvent coexister car ces trois partagent une même idée de «&nbsp;structure&nbsp;» de rapports d'inégalité et de domination.</p>
<p><b>2/</b> La disparition d'inégalités entre groupes permet un meilleur respect et une meilleure cohabitation des appartenants mais n'efface toutefois pas la hiérarchisation entre eux. On parle juste d'harmonisation. Si on enlève les inégalités de ce fonctionnement, la domination restera toujours en place.</p>
<p><b>3/</b> Les critères de classement de cette stratification tournent généralement autour du revenu, du statut professionnel, du rapport au pouvoir et du prestige. Elle ne fait pas disparaître la domination entre les groupes mais apporte une vision moins fermée laissant plus facilement place aux transfuges de classe car on se base majoritairement sur les statuts professionnels.</p></div>
<p>La stratification sociale repose sur des critères socio-économiques :</p>
<ul>
<li><b>Le revenu et le patrimoine :</b> il existe une très grosse dispersion des revenus. Pour le dernier centième, il est possible de le décomposer en trois classes de revenus : les plus aisés dépassent les 700 k€ ; les très élevés ont un revenu compris entre 260 et 700 k€ ; les personnes aisées entre 106 et 260 k€. Ce centième concentre 7&nbsp;% des revenus.</li>
<li><b>Les PCS :</b> consistent à postuler que les groupes d'individus ayant des caractéristiques objectivement comparables du point de vue des conditions de travail et de la formation ont toutes les chances de développer des pratiques sociales communes.</li>
<li><b>La composition du ménage :</b> les inégalités économiques dépendent aussi du niveau de vie du ménage = revenu disponible / nombre d'unités de consommation. La composition prend en compte le nombre de personnes ainsi que leurs âges. Ainsi, par exemple, être seul accroît la probabilité d'être pauvre.</li>
<li><b>Le genre :</b> quel que soit le milieu social, les femmes souffrent de discriminations ou d'inégalités propres au genre. Ainsi, souvent, la division du travail se juxtapose avec la division sexuée.</li>
<li><b>L'âge</b> est également un facteur social avec des effets sur la position sociale de l'individu (prestige, revenus, chance d'accès au pouvoir). Les jeunes sont également davantage touchés par la précarité, d'où la mise en place de politiques en leur faveur. Renvoie à la notion de cycle de vie.</li>
<li><b>Le diplôme</b> constitue un indicateur qui est composé des savoirs et des savoir-faire. La société peut alors être représentée dans un espace à deux dimensions : d'une part en fonction des ressources globales (axe vertical), d'autre part en fonction de la structure de leurs capitaux (économique et social, cf. Pierre Bourdieu) (axe horizontal).</li>
<li><b>Le lieu de résidence</b> est à la fois un reflet de la position sociale et un facteur d'élection ou de stigmatisation qui rend plus ou moins facile l'accès au travail.</li>
</ul>

<h4>B — La mesure des inégalités</h4>
<div class="exo"><div class="exo-t">Exercice — types d'inégalités</div>
<p><b>1/</b> Économiques - intellectuelles - culturelles - accès aux politiques.</p>
<p><b>2/</b> Valoriser = consommer des biens hors de notre capacité d'achat - discuter de sujets scientifiques ou littéraires réputés, films d'auteur, musiques classiques - vocabulaire soutenu et implication dans la pensée politique.<br>Dévaloriser = acheter au plus bon marché - faire peu d'activités culturelles - regarder des séries sur son téléphone - parler de notions simples sans connaissance et ne pas prêter beaucoup d'attention aux politiques.</p>
<p><b>3/</b> La classe moyenne supérieure : située entre les classes avec le plus de poids, elle est souvent minoritaire, a peu de poids dans le champ politique et subit les mauvais aspects de la classe moyenne et de la classe supérieure aisée.</p></div>
<p>Les inégalités sont historiquement et socialement construites. Il existe une dynamique des inégalités : celles d'hier ne sont pas celles d'aujourd'hui ou de demain. L'espace des inégalités est multidimensionnel :</p>
<ul><li>économiques, exemple : le revenu, le patrimoine</li>
<li>sociales, exemple : éducation, santé</li>
<li>symboliques, exemple : les diplômes</li></ul>
<p>Les inégalités purement économiques se traduisent par un partage inégal des richesses pouvant engendrer un effet cumulatif des inégalités et ainsi polariser la structure sociale.</p>
<div class="def">
<p><b>Inégalités économiques</b> = répartition non uniforme des richesses de la population.</p>
<p><b>Inégalités sociales</b> = différences verticalement structurées qui se traduisent par un avantage ou un désavantage d'accès à des ressources valorisées.</p>
<p><b>Quantile</b> = 1/5</p></div>
<div class="exo"><div class="exo-t">Exercices</div>
<p><b>Question 1)</b> On remarque que la différence de revenus entre les femmes et les hommes au premier décile est de 237 − 164 = 73.</p>
<p><b>Question 2)</b> Entre le premier et le 9e décile, on remarque que le revenu loyer est multiplié par 14 environ, soit un écart massif de revenus entre le décile le plus pauvre et le plus riche, montrant l'inégalité de revenus entre eux.</p>
<p><b>Question 3)</b> Parce qu'il y a différents facteurs qui viennent influencer ce résultat notamment en fonction du temps de travail, des conditions, etc.</p>
<p><b>Question 4)</b> C'est dans la tranche des moins de 25 ans qu'on remarque que les inégalités de salaires sont les plus grandes. On remarque cet écart lorsqu'on voit la différence entre le salaire des plus de 25 ans et celui des moins de 25 ans, en moyenne 3x plus élevé, avec à peu près 2x plus de jours rémunérés. De l'autre côté, ce sont les ouvriers et les employés qui sont aussi les moins bien représentés avec un salaire annuel autour de 14 k€ avec une très petite différence sur le nombre de jours payés.</p></div>
<p>Les inégalités de la société varient d'une société à l'autre car les ressources valorisées ne sont pas les mêmes. Ainsi, la division sociale est un mode de stratification parmi d'autres comme par exemple en Inde où le système de castes, bien que aboli, régit la société. En France, les PCS constituent une stratification par le travail mais on considère que certaines PCS engendrent un certain degré d'homogénéité sociale.</p>
<div class="exo"><div class="exo-t">Exercice courbe de Lorenz</div>
<p><b>Question 4)</b> Le point A sur la courbe représente l'instant où la distribution est parfaitement égalitaire entre le patrimoine en France et le niveau de vie.</p>
<p><b>Question 5)</b> On remarque que le niveau de vie est moins accessible pour 20&nbsp;% de la population là où le patrimoine l'est plus pour 100&nbsp;% de la population à une certaine échelle.</p>
<p><b>Question 6)</b> 0,34.</p>
<p><b>Question 7)</b> Entre 1970 les inégalités ont diminué de 0,34 à environ 0,29 soit une diminution de 0,05, quand bien même cette évolution n'a pas toujours été constante et a connu de nombreux pics, notamment en 2011 en remontant à 0,31.</p></div>
<p>Les inégalités peuvent être appréhendées au travers de différents indicateurs tels que :</p>
<ul><li>l'indicateur de dispersion avec le rapport interdécile (D9/D1)</li>
<li>le coefficient de Gini (compris entre 0 et 1), 0 étant la distribution parfaite, 1 étant la situation la plus inégalitaire</li>
<li>la courbe de Lorenz : plus on s'éloigne de la bissectrice, plus les inégalités sont marquées</li></ul>`,

complement:`<p><b>Comprendre la notion : « l'espace social français est-il structuré et hiérarchisé aujourd'hui ? »</b></p>
<p>Le sujet contient deux idées qu'il faut bien <b>distinguer</b> :</p>
<h5>1. « Structuré » = organisé en groupes (logique horizontale)</h5>
<p>Dire que la société est <b>structurée</b>, c'est dire qu'elle n'est pas une masse d'individus identiques : elle est organisée en <b>groupes distincts</b> (les PCS, par exemple) dont les membres partagent des conditions de vie, des goûts et des pratiques communes, et qui entretiennent des rapports entre eux. C'est une logique de <b>différenciation</b> : « qui ressemble à qui, qui se distingue de qui ».</p>
<h5>2. « Hiérarchisé » = classé du plus au moins doté (logique verticale)</h5>
<p>Dire que la société est <b>hiérarchisée</b>, c'est dire que ces groupes ne sont pas seulement différents : ils sont <b>classés, ordonnés, inégaux</b>. Certains sont « au-dessus » d'autres selon des critères de revenu, de patrimoine, de prestige ou de pouvoir. C'est une logique d'<b>inégalité et de domination</b> : « qui est au-dessus de qui ».</p>
<h5>3. Comment ça marche aujourd'hui en France</h5>
<p>L'espace social français est à la fois structuré et hiérarchisé par de <b>multiples facteurs qui se combinent et se cumulent</b> : des facteurs économiques (revenu et patrimoine, PCS) et des facteurs socio-démographiques (diplôme, genre, âge / cycle de vie, composition du ménage, lieu de résidence). Plus un individu cumule de ressources, plus il occupe une position élevée : c'est l'<b>effet cumulatif</b> des inégalités, qui peut polariser la structure sociale.</p>
<p>C'est exactement l'idée de l'<b>espace social de Bourdieu</b> : on peut situer chaque individu sur deux axes — le <b>volume global de ses ressources</b> (axe vertical = la hiérarchie) et la <b>structure de ses capitaux</b> (axe horizontal = la différenciation). Aujourd'hui, cette hiérarchisation persiste (le coefficient de Gini ou le rapport D9/D1 le mesurent), même si les frontières entre groupes sont devenues plus floues (moyennisation, individualisation — voir objectif 2.3).</p>`,
trame:`<div class="trame-steps">
<div class="ts"><span class="tsn">1</span><div class="ts-body"><span class="ts-lbl">Définitions</span>Distingue d'emblée <b>structuration</b> (la société organisée en groupes différenciés — logique horizontale) et <b>hiérarchisation</b> (ces groupes classés de façon inégale — logique verticale). Annonce la multiplicité des facteurs.</div></div>
<div class="ts"><span class="tsn">2</span><div class="ts-body"><span class="ts-lbl">Partie 1 — les facteurs économiques</span>Le <b>revenu et le patrimoine</b> (forte dispersion : le dernier centième concentre 7&nbsp;% des revenus) et la <b>PCS</b> (conditions et pratiques communes), avec le <b>niveau de vie</b> selon la composition du ménage (être seul accroît le risque de pauvreté).</div></div>
<div class="ts"><span class="tsn">3</span><div class="ts-body"><span class="ts-lbl">Partie 2 — les facteurs socio-démographiques</span>Le <b>diplôme</b>, le <b>genre</b>, l'<b>âge</b> (cycle de vie) et le <b>lieu de résidence</b>. Insiste sur l'<b>effet cumulatif</b> et l'<b>espace social de Bourdieu</b> (volume + structure des capitaux). Mentionne la mesure : Gini, D9/D1, courbe de Lorenz.</div></div>
<div class="ts concl"><span class="tsn">→</span><div class="ts-body"><span class="ts-lbl">Conclusion / ouverture</span>L'espace social est structuré ET hiérarchisé par des facteurs multiples qui se cumulent — puis ouvre sur le débat de la pertinence des classes sociales (objectif 2.3).</div></div>
</div>`,

{q:"Quels sont les facteurs de structuration et de hiérarchisation de l'espace social ?",
a:`<p><b>L'espace social français est structuré et hiérarchisé par de multiples facteurs : le revenu et le patrimoine, la PCS, le diplôme, la composition du ménage, l'âge (cycle de vie), le sexe et le lieu de résidence.</b></p><p>Car la hiérarchisation sociale suppose un classement des individus selon des critères à la fois sociaux et économiques (revenus, diplômes, CSP) et socio-démographiques (composition du ménage, position dans le cycle de vie, sexe, lieu de résidence).</p><p>En effet, chacun de ces facteurs produit des inégalités : il existe une très grosse dispersion des revenus (le dernier centième concentre 7&nbsp;% des revenus) ; être seul accroît la probabilité d'être pauvre ; les femmes souffrent de discriminations propres au genre quel que soit le milieu social ; les jeunes sont davantage touchés par la précarité ; le lieu de résidence est à la fois un reflet de la position sociale et un facteur d'élection ou de stigmatisation.</p><p>Illustration : selon Pierre Bourdieu, la société peut être représentée dans un espace à deux dimensions — les ressources globales (axe vertical) et la structure des capitaux économique et social (axe horizontal).</p>`},
{q:"Comment mesure-t-on les inégalités ?",
a:`<p><b>Les inégalités peuvent être appréhendées au travers de différents indicateurs : le rapport interdécile, le coefficient de Gini et la courbe de Lorenz.</b></p><p>Car les inégalités économiques — répartition non uniforme des richesses de la population — doivent être objectivées pour être comparées dans le temps et entre sociétés.</p><p>En effet, le rapport interdécile (D9/D1) mesure la dispersion ; le coefficient de Gini est compris entre 0 (distribution parfaite) et 1 (situation la plus inégalitaire) ; sur la courbe de Lorenz, plus on s'éloigne de la bissectrice, plus les inégalités sont marquées.</p><p>Illustration : d'après l'exercice du cours, le revenu est multiplié par environ 14 entre le premier et le 9e décile en France, et le coefficient de Gini est passé de 0,34 en 1970 à environ 0,29, avec un pic à 0,31 en 2011 — les inégalités ont diminué mais pas constamment.</p>`},
{q:"Pourquoi dit-on que l'espace des inégalités est multidimensionnel ?",
a:`<p><b>L'espace des inégalités est multidimensionnel car il combine des inégalités économiques, sociales et symboliques.</b></p><p>Car les inégalités économiques portent sur le revenu et le patrimoine, les inégalités sociales sur l'éducation et la santé, et les inégalités symboliques sur les diplômes.</p><p>En effet, les inégalités purement économiques se traduisent par un partage inégal des richesses pouvant engendrer un effet cumulatif des inégalités et ainsi polariser la structure sociale. De plus, les inégalités sont historiquement et socialement construites : celles d'hier ne sont pas celles d'aujourd'hui ou de demain, car les ressources valorisées varient d'une société à l'autre.</p><p>Illustration : en Inde, le système de castes, bien qu'aboli, régit la société, tandis qu'en France les PCS constituent une stratification par le travail.</p>`}
]},

{num:"2.2", short:"Les évolutions de la structure socioprofessionnelle",
text:"Comprendre les principales évolutions de la structure socioprofessionnelle en France depuis la seconde moitié du XXe siècle (salarisation, tertiarisation, élévation du niveau de qualification, féminisation des emplois).",
cours:`
<h4>C — L'évolution de la structure sociale</h4>
<p>On distingue 3 secteurs d'activité :</p>
<ul><li>primaire (ex. : agriculture)</li>
<li>secondaire (industrie)</li>
<li>tertiaire (services)</li></ul>
<p>Le développement de la mobilité sociale (changement de position sociale d'un individu), la démocratisation scolaire, l'augmentation du nombre d'emplois qualifiés notamment dans le tertiaire sont des phénomènes bouleversant la structure de classe. Néanmoins, de nombreuses publications insistent dès les années 90 sur la persistance, voire le renouveau, des inégalités économiques et sociales. Le processus d'enrichissement collectif rapide d'après-guerre a pris fin et de nouvelles formes de ré… <span class="lacune">(manque du cours — passage incomplet dans la fiche d'origine)</span></p>
<div class="rem"><p><b>Extrait de l'introduction de dissertation du cours :</b> En 2023, l'INSEE estimait que 10&nbsp;% des Français les plus riches percevaient près de 25&nbsp;% des revenus totaux du pays. Ce chiffre illustre les importantes disparités qui persistent au sein de la société française actuelle, composée de groupes aux ressources et modes de vie très variés. Les inégalités économiques concernent l'accès aux revenus et au patrimoine, tandis que les inégalités sociales portent sur l'éducation, l'emploi ou le logement. Ces différences entraînent une stratification sociale, c'est-à-dire une hiérarchisation des individus et des groupes selon divers critères dans l'espace social. La structure sociale correspond à l'organisation de ces groupes et à leurs interactions.</p></div>
`,

complement:`<h4>D — Les grandes évolutions de la structure socioprofessionnelle depuis 1950</h4>
<p>Depuis le milieu du XXe&nbsp;siècle, la structure socioprofessionnelle (la répartition de la population active entre les groupes sociaux et professionnels) a été bouleversée par <b>quatre grandes évolutions étroitement liées</b> : la salarisation, la tertiarisation, l'élévation du niveau de qualification et la féminisation des emplois.</p>

<h5>1 — La salarisation</h5>
<div class="def"><p><b>Salarisation :</b> augmentation de la part des salariés (personnes qui travaillent contre une rémunération dans un lien de subordination à un employeur) dans la population active occupée, au détriment des indépendants (agriculteurs, artisans, commerçants, professions libérales).</p></div>
<p><b>Évolution chiffrée :</b> les salariés représentaient environ <b>65&nbsp;% de la population active occupée en 1950</b>, contre près de <b>88&nbsp;% aujourd'hui</b>. À l'inverse, la part des indépendants est passée d'environ 35&nbsp;% à près de 12&nbsp;%.</p>
<p><b>Mécanismes explicatifs :</b> le déclin de l'agriculture et du petit commerce (mondes d'indépendants) a réduit le travail non salarié ; le développement de la grande entreprise industrielle puis des services et l'essor de la <b>fonction publique</b> ont multiplié les emplois salariés ; la généralisation de la <b>protection sociale</b> (Sécurité sociale créée en 1945) a fait du statut de salarié la norme d'emploi protectrice.</p>
<p><b>Nuance :</b> la salarisation marque le pas depuis les années 2000. Le statut d'<b>auto-entrepreneur</b> (créé en 2009) et l'essor des plateformes numériques relancent le travail indépendant — un indépendant souvent économiquement dépendant d'un donneur d'ordre (« faux indépendants »), ce qui brouille la frontière salariat/indépendance.</p>

<h5>2 — La tertiarisation</h5>
<div class="def"><p><b>Tertiarisation :</b> accroissement du poids du secteur tertiaire (les services) dans l'emploi et dans la valeur ajoutée, au détriment des secteurs primaire (agriculture) et secondaire (industrie).</p></div>
<p><b>Données chiffrées :</b> le secteur primaire occupait près de <b>30&nbsp;% des actifs en 1950</b>, contre <b>moins de 3&nbsp;% aujourd'hui</b> ; le secondaire est passé d'environ 30&nbsp;% à près de 20&nbsp;% ; le tertiaire, qui employait moins de la moitié des actifs au milieu du XXe&nbsp;siècle, en occupe désormais <b>près de 80&nbsp;%</b> (plus de 3 actifs sur 4).</p>
<p><b>Mécanismes explicatifs :</b> la <b>désindustrialisation</b> (forts gains de productivité dans l'industrie, délocalisations, et externalisation de services autrefois internes aux usines) ; le développement de l'<b>État-providence</b>, qui crée de nombreux emplois de services publics (santé, éducation, administration) ; la hausse du niveau de vie, qui oriente la demande des ménages vers les services (loisirs, santé, restauration).</p>
<p><b>Liens et nuances :</b> la tertiarisation alimente la salarisation (la plupart des emplois de services sont salariés) et la féminisation (nombre de métiers de services sont occupés par des femmes). Mais le tertiaire est <b>très hétérogène</b> : il associe des emplois très qualifiés et bien rémunérés (cadres, ingénieurs) et des emplois peu qualifiés et précaires (caissiers, aide à domicile) — d'où une <b>polarisation</b>. Une partie de la « désindustrialisation » est en outre un trompe-l'œil statistique (externalisation d'activités désormais comptées dans le tertiaire).</p>

<h5>3 — L'élévation du niveau de qualification</h5>
<div class="def"><p><b>Élévation du niveau de qualification :</b> hausse du niveau de formation et de diplôme de la population active, accompagnée de la progression des emplois et des catégories socioprofessionnelles les plus qualifiés.</p></div>
<p><b>Lien avec la massification scolaire :</b> la part d'une génération obtenant le baccalauréat est passée d'environ <b>20&nbsp;% en 1970 à près de 80&nbsp;% aujourd'hui</b>, et le nombre de diplômés de l'enseignement supérieur a fortement augmenté.</p>
<p><b>Progression des CSP supérieures :</b> la part des <b>cadres et professions intellectuelles supérieures</b> a plus que doublé depuis les années 1980 (d'environ 8&nbsp;% à plus de 20&nbsp;% de la population active occupée), de même que celle des professions intermédiaires, tandis que reculaient les ouvriers et les agriculteurs.</p>
<p><b>Mécanismes :</b> les besoins de l'économie (progrès technique, tertiaire qualifié) exigent une main-d'œuvre plus formée ; la démocratisation scolaire et les politiques éducatives ont élargi l'accès aux diplômes.</p>
<p><b>Nuance — le déclassement :</b> l'élévation des qualifications est plus rapide que celle des emplois disponibles. D'où une <b>dévalorisation des diplômes</b> et un risque de <b>déclassement</b> (occuper un emploi inférieur à son niveau de diplôme) : c'est le <b>paradoxe d'Anderson</b> — avoir un diplôme plus élevé que ses parents ne garantit plus une position sociale supérieure. Les inégalités scolaires se sont en partie déplacées vers l'enseignement supérieur.</p>

<h5>4 — La féminisation des emplois</h5>
<div class="def"><p><b>Féminisation des emplois :</b> augmentation de la part des femmes dans la population active et dans l'emploi, traduisant leur participation croissante au marché du travail.</p></div>
<p><b>Évolution du taux d'activité féminin :</b> le taux d'activité des femmes (15-64 ans) est passé d'environ <b>45&nbsp;% au début des années 1970 à près de 68&nbsp;% aujourd'hui</b>, se rapprochant de celui des hommes ; les femmes représentent désormais près de <b>48&nbsp;% de la population active</b>.</p>
<p><b>Mécanismes explicatifs :</b><br>
• <b>juridiques</b> : droit de travailler et de gérer ses biens sans l'autorisation du mari (1965), maîtrise de la fécondité (contraception, loi Neuwirth 1967 ; IVG, loi Veil 1975), lois sur l'égalité professionnelle (1972 sur l'égalité de rémunération, loi Roudy 1983) ;<br>
• <b>scolaires</b> : les filles réussissent en moyenne mieux à l'école et sont majoritaires parmi les diplômés du supérieur, ce qui accroît leur insertion professionnelle ;<br>
• <b>sectoriels</b> : la tertiarisation et la salarisation ont créé des emplois de services (santé, éducation, commerce) massivement occupés par des femmes ; le développement des modes de garde et l'évolution des mentalités ont accompagné le mouvement.</p>
<p><b>Nuances — une féminisation inachevée et inégale :</b><br>
• le <b>plafond de verre</b> : les femmes restent sous-représentées aux postes de direction et de pouvoir ;<br>
• la <b>ségrégation professionnelle</b> : horizontale (concentration des femmes dans un nombre restreint de métiers, souvent dans le soin et les services) et verticale (concentration aux échelons inférieurs) ;<br>
• les <b>écarts de salaire</b> persistent (de l'ordre de 24&nbsp;% de revenu salarial en moyenne tous temps de travail confondus, et encore plusieurs points à poste et temps de travail comparables) ;<br>
• le <b>temps partiel subi</b> : le temps partiel est occupé à environ 80&nbsp;% par des femmes, ce qui pèse sur leurs revenus et leurs carrières (« double journée » avec le travail domestique).</p>

<h5>5 — Des évolutions qui se renforcent mutuellement</h5>
<p>Ces quatre transformations ne sont pas indépendantes : elles forment un système qui s'auto-entretient. La <b>tertiarisation</b> crée des emplois majoritairement <b>salariés</b> (salarisation), souvent <b>qualifiés</b> (élévation des qualifications) et largement occupés par des <b>femmes</b> (féminisation). La <b>massification scolaire</b> nourrit à la fois l'élévation des qualifications et la féminisation (réussite scolaire des filles). La <b>salarisation</b> et la protection sociale ont stabilisé l'emploi, favorisant l'entrée durable des femmes sur le marché du travail.</p>
<p>Au total, la France est passée d'une société agricole et industrielle, masculine et peu diplômée, à une <b>société post-industrielle</b> tertiarisée, salariée, qualifiée et féminisée — ce qui a profondément recomposé la structure sociale (recul des ouvriers et des agriculteurs, essor des cadres et des professions intermédiaires) sans pour autant effacer les inégalités.</p>`,
trame:`<div class="trame-steps">

<div class="ts"><span class="tsn">2</span><div class="ts-body"><span class="ts-lbl">Partie 1 — les transformations</span>La <b>tertiarisation</b> et la <b>salarisation</b>, l'<b>élévation du niveau de qualification</b> (démocratisation scolaire, hausse des emplois qualifiés) et la <b>féminisation</b> des emplois → développement de la mobilité sociale qui bouleverse la structure de classe.</div></div>

</div>`,

{num:"2.3", short:"Théories des classes (Marx, Weber, Bourdieu) et débats sur leur pertinence",
text:"Connaître les théories des classes et de la stratification sociale dans la tradition sociologique (Marx, Weber) ; comprendre que la pertinence d'une approche en termes de classes sociales pour rendre compte de la société française fait l'objet de débats théoriques et statistiques : évolution des distances inter- et intra-classes, articulation avec les rapports sociaux de genre, identifications subjectives à un groupe social, multiplication des facteurs d'individualisation.",
cours:`
<h4>A — La théorie de Karl Marx</h4>
<p>Marx a une conception des réalistes des classes sociales, il distingue les groupes sociaux qui sont objectivement repérables dans une société mais qui n'ont pas conscience d'exister en tant que groupe et ceux qui sont, non seulement repérables, mais qui ont conscience d'être un groupe, d'avoir des intérêts communs et qui se mobilisent pour les défendre. Seuls ces derniers sont considérés par Marx comme une classe sociale à part entière.</p>
<p>La notion de classe sociale pour Marx s'inscrit dans une société fondée sur les rapports de production, ses modes de production qui évoluent au cours de l'histoire et constituent selon lui le fondement caché de la structure sociale.</p>
<div class="exo"><div class="exo-t">Exercice</div>
<p><b>Q1 Quelle conception de classe a Marx ?</b><br>Vision réaliste = il définit les classes selon la place qu'occupent les individus dans les rapports de production.</p>
<p><b>Q2 Définissez les deux classes qui existent selon Marx.</b><br>La bourgeoisie (possède les moyens de production) et le prolétariat (possède la force de travail qu'il échange contre un salaire).</p>
<p><b>Q3 Sur quoi se fonde la distinction de classe ?</b><br>Elle se fonde sur les rapports entre l'humain et la production.</p>
<p><b>Q4 Comment distinguer la classe en soi et pour soi ?</b><br>Là où la classe en soi regroupe uniquement des individus ayant la même place dans la production, la classe pour soi possède un état de conscience en plus.</p>
<p><b>Q5 Quel est l'élément fondamental chez Marx ? Quel est l'enjeu ?</b><br>La lutte des classes.</p></div>
<p>La place occupée dans le processus productif définit l'appartenance à la classe sociale. Ainsi, dans une société capitaliste, il existe une opposition radicale entre :</p>
<ul><li>les bourgeois = ceux qui possèdent les forces de production</li>
<li>les prolétaires = ceux qui vendent leur force de travail</li></ul>
<p>Le capitalisme, quant à lui, polarise la société en deux classes étant en opposition avec des situations inégales sans possibilité de changements, ce qui justifie la lutte des classes. La domination du prolétariat dépasse le cadre économique du fait de l'instrumentalisation des institutions et des idéologies dominantes.</p>
<p><b>Warren Buffett</b> en 2006, dans le Times, déclare : «&nbsp;il y a lutte des classes aux États-Unis, bien sûr, mais c'est ma classe, la classe des riches, qui mène la lutte et nous gagnons&nbsp;».</p>
<p>Pour Marx, la dimension économique est centrale mais il faut également prendre en compte la conscience de classe. Ainsi on distingue :</p>
<ul><li><b>la classe en soi</b> = qui est constituée par un rapprochement objectif des positions sociales, c.-à-d. des individus dans la même situation partageant les mêmes difficultés mais qui n'ont pas nécessairement conscience d'appartenir ;</li>
<li><b>la classe pour soi</b> = qui nécessite le développement de liens sociaux et une capacité de mobilisation. Ainsi, les individus sont en lutte et ont des intérêts communs à défendre (classe qui nous intéresse pour le bac) («&nbsp;montrez la différence de structure entre Marx et Weber&nbsp;»).</li></ul>
<p><b>1️⃣ Structure économique de la société</b> (ce que Marx appelle «&nbsp;réaliste&nbsp;» ou «&nbsp;objective&nbsp;») — deux classes principales : 1. Bourgeoisie → dominante, possède les moyens de production ; 2. Prolétariat → dominée, ne possède rien. 👉 Ici, il n'y a que deux classes.</p>
<p><b>2️⃣ À l'intérieur du prolétariat</b> (niveau de conscience) — on distingue : classe en soi → prolétaires objectivement unis par leur position, mais pas conscients de leurs intérêts communs ; classe pour soi → prolétaires conscients et mobilisés. 👉 Ce n'est pas une troisième classe sociale : c'est une subdivision du prolétariat selon la conscience de classe.</p>

<h5>Le conflit de classes, moteur de l'histoire</h5>
<p>Pour Karl Marx, le <b>conflit de classes est le moteur de l'histoire</b>. Dans la société capitaliste, bourgeoisie et prolétariat entretiennent une relation fondamentalement <b>antagoniste</b> : la bourgeoisie, qui possède les moyens de production, tire profit du travail des ouvriers en s'appropriant la <b>plus-value</b>.</p>
<div class="def"><p><b>Plus-value :</b> différence entre la valeur produite par le travailleur et le salaire qu'il reçoit, et que la bourgeoisie s'approprie.</p></div>
<p>Cette <b>exploitation</b> génère un conflit structurel et inévitable entre les deux classes. Cependant, ce conflit ne devient effectif que lorsque le prolétariat passe de la <b>classe en soi</b> à la <b>classe pour soi</b> : tant que les ouvriers n'ont pas conscience de leur condition commune et de leurs intérêts collectifs, ils subissent sans se mobiliser.</p>
<p>C'est la <b>prise de conscience de classe</b> — favorisée selon Marx par les conditions de misère croissante du capitalisme — qui permet au prolétariat de s'organiser (syndicats, partis) et d'engager la lutte contre la bourgeoisie, lutte dont l'aboutissement serait la <b>révolution</b> et le renversement du capitalisme.</p>

<figure class="marx-schema">
<div class="ms-grid">
<div class="ms-head ms-h1">Critère : rapport aux<br>moyens de production</div>
<div class="ms-head ms-h2">Niveau de conscience<span>(enjeu du prolétariat uniquement)</span></div>
<div class="ms-box ms-bourg"><span class="ms-t">Bourgeoisie</span><span class="ms-d">Possède les moyens de production</span></div>

<h4>B — La théorie de Max Weber</h4>
<div class="exo"><div class="exo-t">Exercice</div>
<p><b>Q6 Quelle est la conception de classe pour Weber ?</b><br>Il a une vision nominaliste des classes = les classes sont des outils sociologiques.</p>
<p><b>Q7 Quelles sont les 3 hiérarchies de classe ? Illustrez avec des exemples.</b><br>Ordre économique = la richesse avec de grands PDG par exemple.<br>Ordre social = le prestige social selon la réputation, l'emploi, etc., comme l'exemple d'Omar Sy figurant comme une des personnalités préférées des Français.<br>Ordre politique = regroupe les individus qui luttent pour le pouvoir comme le président Emmanuel Macron par exemple.</p>
<p><b>Q8 Comment définir un groupe de statut ?</b></p>
<p><b>Q9 En résumé, quels sont les points communs et les différences entre les deux auteurs ?</b></p></div>
<p>Max Weber a une conception dite nominaliste des classes sociales et une vision tridimensionnelle de la stratification sociale. Max Weber se démarque de Karl Marx car il envisage le comportement humain à partir des raisonnements et des motivations des individus, c'est ce qu'il nomme l'individualisme méthodologique.</p>
<div class="def"><p><b>Classe sociale</b> = agrégation d'individus présentant un certain nombre de caractéristiques communes sans qu'il y ait pour autant conscience d'appartenir.</p></div>
<p>Dans l'analyse de Weber, le concept de classe est tridimensionnel :</p>
<ul>
<li><b>L'ordre économique</b>, c.-à-d. l'avoir. Les individus appartiennent à une même classe sociale s'ils ont les mêmes chances d'accéder aux biens et services. Le niveau de revenus et de patrimoine est donc un critère. C'est différent de chez Marx car ce n'est pas la position dans le mode de production qui est déterminante. → Ici c'est la notion de classes sociales (propriétaire / non propriétaire).</li>
<li><b>L'ordre social</b>, c.-à-d. le savoir. Il a une analyse en termes de groupes de statut. Le niveau de prestige, la considération sociale se traduit par un style de vie en particulier sur le mode de consommation et d'habitat. Le style de vie est le critère essentiel mais il y a d'autres facteurs à prendre tels que la naissance, l'éducation. → Ici c'est la notion de groupe de statut (degré d'honneur ou de prestige).</li>
<li><b>L'ordre politique</b>, c.-à-d. le pouvoir. La classe sociale repose sur la conquête du pouvoir politique pour contrôler l'État. Dans une société démocratique, la proximité avec le ou les partis au pouvoir détermine la hiérarchie politique. Ainsi, les partis sont une extension des groupes de statut permettant l'action sociale. → Ici c'est la notion de partis (pouvoir).</li>
</ul>
<p>À partir de ces critères, Max Weber confond 4 types de classes sociales :</p>
<ul>
<li><b>la classe ouvrière :</b> en effet, à mesure que la mécanisation progresse, le groupe des ouvriers devient plus homogène. Cette classe est constituée massivement d'individus dénués de biens matériels et sans pouvoir dans l'organisation de la production ;</li>
<li><b>la petite bourgeoisie :</b> elle occupe une situation économique commune par rapport au marché ;</li>
<li><b>la classe moyenne salariée :</b> elle ne possède pas de propriété qui la rende indépendante mais sa position repose sur une formation technique, exemple : les fonctionnaires ;</li>
<li><b>les classes privilégiées :</b> elles sont privilégiées par la propriété ou l'éducation. La classe privilégiée conquiert possession et pouvoir dans la production.</li>
</ul>
<p>Pour Max Weber, les oppositions entre les classes sociales ne sont pas conflictuelles si certaines conditions socio-économiques sont réunies. En effet, si une mobilité est possible avec des chances d'accès aux positions relativement similaires, alors le conflit ne se justifie pas.</p>
<div class="def"><p><b>Groupe de statut :</b> degré d'honneur ou de prestige = considération dont bénéficie un groupe du fait de sa position sociale, mutuellement reconnue par les individus.</p></div>

<h4>C — L'analyse de classe toujours pertinente selon Pierre Bourdieu</h4>
<div class="exo"><div class="exo-t">Exercice</div>
<p><b>1/</b> Les biens, activités, les lectures, les classes économiques.</p>
<p><b>2/</b> Les différences entre les biens divergent en fonction des différents groupes sociaux car ces derniers se distinguent entre leurs niveaux de vie, leurs revenus et leurs temps libres. De ce fait, les classes supérieures peuvent s'adonner à des biens de forte valeur, des cols de champagne ou des activités très coûteuses comme l'équitation, là où les classes inférieures s'adonnent à des vins bon marché ou encore à des activités peu coûteuses. Pourtant, dans une même classe, on peut aussi assister à des divergences face aux points de vue politiques.</p></div>
<p>Pierre Bourdieu développe un espace social traversé par des rapports de domination où les classes sont inégalement dotées et relativement cloisonnées mais où l'action collective reste virtuelle. Il emprunte à Marx la notion de capital éco (revenus + patrimoine) mais accorde une place importante :</p>
<ul><li><b>au capital culturel :</b> qui peut être certifié par des diplômes mais également correspondre à des biens ;</li>
<li><b>au capital social :</b> qui correspond aux relations + le réseau ;</li>
<li><b>capital symbolique :</b> renvoie à la considération que confèrent les 3 autres capitaux.</li></ul>
<p>La hiérarchie sociale découle de la distribution inégale de ces capitaux en se basant notamment sur une dimension quantitative, les classes sociales dominantes étant les plus dotées.</p>
<div class="def"><p><b>Habitus</b> = ensemble des manières d'être, d'agir et de penser d'un individu. Il est le fruit d'un apprentissage lié au groupe d'appartenance.</p></div>
<div class="exo"><div class="exo-t">Exercice (chanson IAM)</div>
<p><b>Q1. À quels groupes sociaux IAM fait-il référence ?</b><br>Aux groupes fortunés et aux groupes précaires.</p>
<p><b>Q2. Trouvez des exemples de pratiques culturelles pour chacun des groupes.</b><br>Le père de la chanson part au travail à vélo et croise un homme en costume et grosse voiture. Pour l'auteur des paroles, il pratique du foot seul avec du matériel démuni là où l'homme en costume envoie son fils à la crèche et en vacances.</p>
<p><b>Q3. De quelle année date la chanson ? Peut-on dire que la notion de classe sociale est toujours d'actualité ?</b><br>Elle a été publiée en 1997 et nous montre effectivement que cette notion de classes sociales existe toujours.</p>
<p><b>Q4. Comment la notion de déterminisme social est-elle évoquée dans la chanson ? Existe-t-il dans la chanson de la mobilité sociale ?</b><br>Elle est évoquée via le refrain où l'auteur se plaint de ne pas être né sous la bonne étoile et que donc les routes ne sont pas les mêmes que pour ceux justement nés sous cette étoile et qu'il ne peut rien faire hormis être spectateur de son futur, synonyme de désespoir pour lui.</p>
<p><b>Q5. Comment interpréter le titre de la chanson ?</b></p>
<p><b>Q6. Existe-t-il des rapports de domination ?</b><br>Il existe bien une forme de domination dans la société des puissants qui ont une influence et une prestance que certaines personnes de milieu défavorisé n'ont pas la chance d'avoir.</p></div>
<p>Entre les classes sociales, le conflit n'est pas une nécessité mais il existe des rapports de domination et de lutte. Les classes sociales dominantes cherchent à imposer leur modèle culturel ; de ce fait elles doivent contrôler les institutions productrices de légitimité, à savoir l'école et l'État.</p>

<h4># Comparaison des 3 visions</h4>
<table>
<tr><th>Vision de Marx</th><th>Vision de Max Weber</th><th>Vision de Pierre Bourdieu</th></tr>
<tr>
<td><b>Unidimensionnelle :</b> la société est analysée uniquement par rapport au rapport de production.<br><br><b>Deux classes principales :</b> Bourgeoisie → classe dominante, propriétaire des moyens de production ; Prolétariat → classe dominée, travaille pour les bourgeois.<br><br><b>Deux niveaux de conscience dans le prolétariat :</b> classe en soi → n'a pas conscience d'être un groupe ; classe pour soi → a conscience d'appartenir à un groupe et peut lutter pour ses intérêts.<br><br><b>Lutte des classes</b> → causée par le fossé entre bourgeoisie et prolétaires, moteur de l'histoire selon Marx.<br><br><b>Vision réaliste</b> → classes sociales objectivement repérables, basées sur la position dans le mode de production.<br><br><b>Stratification</b> → claire, basée sur les groupes repérables et leurs relations de pouvoir économique.</td>
<td><b>Tridimensionnelle :</b> la société est analysée selon 3 dimensions indépendantes : 1. Ordre économique → accès aux biens et services, niveau de revenus et de patrimoine (propriétaires / non propriétaires) ; 2. Ordre social → prestige, considération sociale, style de vie, naissance, éducation (groupes de statut) ; 3. Ordre politique → pouvoir et influence sur les décisions collectives, appartenance à des partis ou institutions.<br><br><b>Nominaliste / individualiste méthodologique</b> → les classes et groupes sont définis par les comportements et motivations des individus, pas seulement par leur position économique.<br><br><b>Mobilité sociale possible</b> → si les chances d'accès aux ressources ou au pouvoir sont similaires, le conflit social n'est pas automatique.<br><br><b>Pas forcément de conflit</b> → contrairement à Marx, la société peut rester stable si les individus peuvent progresser dans l'une ou l'autre dimension.<br><br><b>Vision réaliste + flexible</b> → les groupes sont identifiables (par richesse, prestige ou pouvoir), mais l'accent est mis sur les différences de chances et d'opportunités individuelles, pas uniquement sur la lutte entre classes.</td>
<td><b>Multidimensionnelle :</b> la société se structure selon plusieurs types de capitaux : 1. Capital économique → revenus, patrimoine, ressources financières ; 2. Capital culturel → diplômes, savoirs, compétences, habitudes culturelles ; 3. Capital social → réseau de relations, contacts utiles ; 4. (Parfois mentionné) Capital symbolique → prestige, reconnaissance sociale.<br><br><b>Espace social</b> → la société peut être représentée comme un espace à deux (ou plusieurs) dimensions : position sur l'axe des ressources → qui possède quoi ; structure des capitaux → quelle combinaison de capitaux (éco, culturel, social).<br><br><b>Division et hiérarchie sociale</b> → les individus ou groupes sont différenciés selon leurs capitaux et leur habitus (manières de penser, de se comporter, goûts).<br><br><b>Effet cumulatif des inégalités</b> → la possession de capitaux permet de reproduire les positions sociales, créant des écarts qui se renforcent au fil du temps.<br><br><b>Stratification flexible mais structurée</b> → ce n'est pas juste un conflit économique (comme Marx) mais une polarisation selon les ressources et pratiques culturelles et sociales.<br><br><b>Vision réaliste / empirique</b> → Bourdieu observe concrètement les positions sociales et les pratiques des individus pour analyser les inégalités et la reproduction sociale.</td>
</tr></table>

<h4>III — La remise en cause des classes sociales</h4>
<h5>A) La théorie de Mendras et la baisse des distances interclasses</h5>
<p>Mendras représente la société au travers d'une toupie. La classe moyenne est constituée de la constellation populaire et d'une partie de la constellation centrale. La toupie indique un phénomène de moyennisation de la société : plus elle est ventrue, plus le phénomène prend de l'ampleur.</p>
<div class="rem"><p><b>Remarque :</b> la population se divise pour les 3/4 dans les constellations : la constellation centrale est composée des cadres tandis que la constellation populaire rassemble les ouvriers et employés. Autour gravitent les différentes galaxies, c.-à-d. les indépendants, les pauvres et l'élite.</p>
<p><b>Remarque :</b> la notion de distance interclasses renvoie à la thèse de la moyennisation.</p></div>
<div class="rem"><p><b>⚠ Consigne du cours :</b> Paragraphe argumenté moyennisation + évolution des taux d'équipement. Sujet = montrez que la distance interclasses s'est réduite (pourquoi) (chiffres - 0 paraphrase). <b>Elle va poser une question dessus !!!!!</b></p></div>
<p>La réduction de la distance interclasses repose sur 3 aspects :</p>
<ul><li>l'atténuation des disparités de revenus, de patrimoine et de loisirs, notamment depuis la fin de la 1re GM et surtout avec l'augmentation des droits ;</li>
<li>l'homogénéisation des comportements et des pratiques, ce qui renvoie également au style de vie ;</li>
<li>la formation d'une vaste classe moyenne.</li></ul>
<p>Le développement de la mobilité sociale (changement de position sociale d'un individu), la démocratisation scolaire, l'augmentation du nombre d'emplois qualifiés notamment dans le tertiaire sont des phénomènes bouleversant la structure de classe. Néanmoins, de nombreuses publications insistent dès les années 90 sur la persistance, voire le renouveau, des inégalités économiques et sociales. Le processus d'enrichissement collectif rapide d'après-guerre a pris fin et de nouvelles formes de ré… <span class="lacune">(manque du cours)</span></p>

<h5>B) L'individualisation complexifie l'identification à un groupe</h5>
<div class="def">
<p><b>Identité singulière</b> = ensemble des caractéristiques singulières (rôle, valeurs) que l'individu s'attribue (identité pour soi).</p>
<p><b>Identité collective</b> = manière dont les individus se définissent et sont définis par les autres sur la base de leurs appartenances sociales.</p>
<p><b>Identité sociale</b> = combinaison de l'identité collective et singulière.</p></div>
<div class="exo"><div class="exo-t">Exercice — processus d'individualisation</div>
<ol><li>L'individualisation désigne un processus de long terme de construction de l'individu comme sujet, lié à la démocratie et au marché.</li>
<li>Les périodes importantes qui ont joué un rôle dans le processus d'individualisation sont l'époque de la Renaissance ou le 19e siècle puis une seconde phase beaucoup plus récente d'il y a quelques années.</li>
<li>Sortir d'une religion.</li>
<li>Là où le processus d'individualisation est un phénomène qui permet de se rapprocher du soi dit authentique et permet de s'émanciper pour trouver une forme d'autonomie, il peut aussi avoir des revers négatifs en favorisant l'isolement ou encore la fragilité de sa situation et tendre vers une fragilisation de la cohésion sociale.</li></ol></div>
<p>Avec la montée de l'individualisme, l'individu a moins l'impression de dépendre de l'identité collective. Ce processus participerait à l'affaiblissement du déterminisme social. Il existe différents critères d'individualisation tels que le diplôme, le revenu, le lieu de résidence, le contrat de travail, le genre et les nouvelles technologies.</p>
<div class="exo"><div class="exo-t">Exercice — individualisation et technologies</div>
<p><b>5 -</b> Mettre une note Uber = individualisation. La personne notée = j'arrive à rendre chaque personne unique en fonction d'un critère, donc individualisation = distinction par rapport aux autres.</p>
<p><b>9 -</b> Les classements, employé du mois, etc., ça impacte l'organisation du travail.</p></div>
<p>Les transformations dans l'organisation du travail brisent les solidarités avec notamment le système des primes individuelles ou encore la suppression des postes en interne. La baisse du syndicalisme est également un symbole de l'affaiblissement des liens collectifs et de la montée de l'individualisme. Les nouvelles technologies peuvent se mettre au service de l'individualisation notamment dans le monde du travail avec l'apparition des notes et des avis en ligne, comme pour les chauffeurs Uber.</p>

<h5>C) Les rapports de genre</h5>
<p>Le genre est une catégorie d'analyse de ce que l'appartenance de sexe peut produire. Il s'agit d'observer dans un certain contexte (société, institution, milieu social, etc.) la manière dont certaines pratiques, traits de caractère, comportements sont associés au masculin ou au féminin. De ceci découlent des inégalités.</p>
<p>L'analyse en termes de classes sociales a souvent mis de côté les inégalités liées au genre, les rendant quasi invisibles. Les recherches sur le genre ont autorisé une remise en cause de la définition classique du travail qui se réduisait pour l'essentiel au travail salarié. Il faut donc croiser les critères de genre avec l'approche en termes de classes sociales car les deux ont une approche en termes de domination.</p>

<h5>D) Une identification subjective</h5>
<div class="exo"><div class="exo-t">Exercice — identification subjective</div>
<p><b>1)</b> 6,7&nbsp;%.</p>
<p><b>2)</b> Elle a évolué notamment grâce à la diminution du sentiment de non-appartenance ou encore au déclin de la classe ouvrière.</p>
<p><b>3)</b> L'identification subjective ne correspond pas toujours à la position objective d'un individu car l'individu a tendance à se situer par rapport à la moyenne sans conscience subjective de la vraie position : ainsi, les individus ont fortement tendance à se situer dans la classe moyenne même en étant parfois issus d'un milieu populaire.</p></div>
<p>L'identification subjective au groupe social désigne un sentiment d'adhésion et d'appartenance à ce groupe qui participe à une identité professionnelle. La fragilisation des situations d'emploi ainsi que le chômage affaiblissent le sentiment d'appartenance commun à une catégorie professionnelle.</p>
<p>La trajectoire familiale et scolaire explique le rapport plus ou moins heureux au travail. L'identification subjective porte alors plutôt sur le travail ou, au contraire, sur des aspects plus valorisants tels que les activités sportives, familiales, musicales, religieuses, etc.</p>
<p>Le sentiment d'appartenance tend à décliner notamment chez les ouvriers, même si l'augmentation des inégalités est constatée. Il y a un retour des classes sociales mais pas forcément de conscience des classes, ainsi la bourgeoisie serait la dernière classe sociale au sens de Marx… ou pas forcément : pour certains, 10&nbsp;% en 1999 → 7,2&nbsp;% en 2009 → 6,7&nbsp;% en 2013.</p>
<p>C'est ce que certains sociologues appellent la «&nbsp;déstructuration des classes sociales&nbsp;» ou la «&nbsp;crise de la conscience de classe&nbsp;».</p>

<h4>Introduction pour une dissertation de SES sur la structure sociale française</h4>
<p>En 2023, l'INSEE estimait que 10&nbsp;% des Français les plus riches percevaient près de 25&nbsp;% des revenus totaux du pays. Ce chiffre illustre les importantes disparités qui persistent au sein de la société française actuelle, composée de groupes aux ressources et modes de vie très variés. Les inégalités économiques concernent l'accès aux revenus et au patrimoine, tandis que les inégalités sociales portent sur l'éducation, l'emploi ou le logement. Ces différences entraînent une stratification sociale, c'est-à-dire une hiérarchisation des individus et des groupes selon divers critères dans l'espace social. La structure sociale correspond à l'organisation de ces groupes et à leurs interactions.</p>
<p>L'organisation des groupes sociaux a été analysée par plusieurs sociologues. Marx opposait bourgeoisie et prolétariat dans un rapport de production antagoniste. Weber développait une approche tridimensionnelle articulée autour de l'avoir, du pouvoir et du prestige. Bourdieu a montré comment les inégalités de capital économique, culturel et social façonnent un espace social traversé par des rapports de domination, tandis que Mendras suggérait une «&nbsp;moyennisation&nbsp;» avec sa représentation en toupie.</p>
<p>Les transformations récentes, marquées par l'individualisme, l'évolution des rapports de genre et les nouvelles formes d'identification subjective, interrogent la pertinence des analyses traditionnelles en termes de classes sociales. Nous chercherons donc à comprendre dans quelle mesure ces inégalités et cette stratification façonnent réellement la structure de la société française aujourd'hui.</p>
<p>Pour répondre à cette problématique, nous verrons d'abord quelles sont les caractéristiques fondamentales de la structure sociale française actuelle, puis nous analyserons comment les différents courants sociologiques interprètent cette stratification, avant d'examiner les remises en question contemporaines du concept de classes sociales face aux évolutions récentes de la société.</p>

<h4>Conclusion pour une dissertation sur la structure sociale française actuelle</h4>
<p>La société française contemporaine reste stratifiée malgré ses transformations. Les inégalités économiques, sociales et culturelles façonnent des groupes distincts aux contours plus flous.</p>
<p>Les approches sociologiques se complètent : Marx a souligné les rapports de production, Weber a ajouté sa conception tridimensionnelle, et Bourdieu a précisé le rôle des capitaux et de l'habitus dans la reproduction des inégalités.</p>
<p>Toutefois, l'individualisation, la moyennisation (Mendras) et l'évolution des rapports de genre ont modifié la structure sociale. Le décalage entre position objective et identification subjective illustre cette complexification.</p>
<p>Les classes sociales demeurent pertinentes mais doivent être analysées dynamiquement, en intégrant les nouvelles inégalités. La structure sociale française résulte d'une reproduction des inégalités traditionnelles et de l'émergence de nouvelles fractures sociales.</p>`,

cards:[
{q:"Quelle est la conception des classes sociales chez Karl Marx ?",
a:`<p><b>Marx a une conception réaliste des classes sociales : il définit les classes selon la place qu'occupent les individus dans les rapports de production.</b></p><p>Car dans une société capitaliste, il existe une opposition radicale entre les bourgeois, qui possèdent les forces de production, et les prolétaires, qui vendent leur force de travail.</p><p>En effet, le capitalisme polarise la société en deux classes en opposition, avec des situations inégales sans possibilité de changement, ce qui justifie la lutte des classes — l'élément fondamental chez Marx et le moteur de l'histoire. Marx distingue aussi la classe en soi (individus dans la même situation, sans conscience d'appartenir) de la classe pour soi (qui développe des liens sociaux, une conscience et une capacité de mobilisation).</p><p>Illustration : Warren Buffett déclarait en 2006 dans le Times : «&nbsp;il y a lutte des classes aux États-Unis, bien sûr, mais c'est ma classe, la classe des riches, qui mène la lutte et nous gagnons&nbsp;».</p>`},
{q:"Quelle est la conception des classes sociales chez Max Weber ?",
a:`<p><b>Weber a une conception nominaliste des classes sociales et une vision tridimensionnelle de la stratification sociale.</b></p><p>Car il se démarque de Marx en envisageant le comportement humain à partir des raisonnements et motivations des individus : c'est l'individualisme méthodologique.</p><p>En effet, le concept de classe est chez lui tridimensionnel : l'ordre économique (l'avoir — les chances d'accéder aux biens et services, notion de classes sociales), l'ordre social (le savoir — prestige et considération sociale traduits par un style de vie, notion de groupes de statut) et l'ordre politique (le pouvoir — conquête du pouvoir politique, notion de partis). Il en déduit 4 types de classes : la classe ouvrière, la petite bourgeoisie, la classe moyenne salariée (ex : les fonctionnaires) et les classes privilégiées.</p><p>Nuance essentielle : pour Weber, les oppositions entre classes ne sont pas conflictuelles si une mobilité est possible avec des chances d'accès relativement similaires — contrairement à Marx.</p>`},
{q:"En quoi l'analyse de Pierre Bourdieu renouvelle-t-elle l'approche en termes de classes ?",
a:`<p><b>Bourdieu développe un espace social traversé par des rapports de domination, où les classes sont inégalement dotées en capitaux.</b></p><p>Car il emprunte à Marx la notion de capital économique (revenus + patrimoine) mais accorde une place importante au capital culturel (certifié par des diplômes ou correspondant à des biens), au capital social (les relations + le réseau) et au capital symbolique (la considération que confèrent les trois autres capitaux).</p><p>En effet, la hiérarchie sociale découle de la distribution inégale de ces capitaux, les classes dominantes étant les plus dotées. L'habitus — ensemble des manières d'être, d'agir et de penser, fruit d'un apprentissage lié au groupe d'appartenance — différencie les groupes par leurs pratiques.</p><p>Illustration : les classes dominantes cherchent à imposer leur modèle culturel et doivent pour cela contrôler les institutions productrices de légitimité, à savoir l'école et l'État.</p>`},
{q:"Qu'est-ce que la moyennisation de la société selon Mendras ?",
a:`<p><b>Mendras représente la société au travers d'une toupie qui indique un phénomène de moyennisation : plus elle est ventrue, plus le phénomène prend de l'ampleur.</b></p><p>Car la classe moyenne est constituée de la constellation populaire et d'une partie de la constellation centrale : les 3/4 de la population se divisent dans ces constellations (la centrale composée des cadres, la populaire rassemblant ouvriers et employés), autour desquelles gravitent les galaxies des indépendants, des pauvres et de l'élite.</p><p>En effet, la réduction de la distance interclasses repose sur 3 aspects : l'atténuation des disparités de revenus, de patrimoine et de loisirs (depuis la fin de la 1re GM et avec l'augmentation des droits) ; l'homogénéisation des comportements et des pratiques (style de vie) ; la formation d'une vaste classe moyenne.</p><p>Nuance : dès les années 90, de nombreuses publications insistent sur la persistance, voire le renouveau, des inégalités économiques et sociales — le processus d'enrichissement collectif rapide d'après-guerre a pris fin.</p>`},
{q:"Comment l'individualisation remet-elle en cause l'approche en termes de classes sociales ?",
a:`<p><b>Avec la montée de l'individualisme, l'individu a moins l'impression de dépendre de l'identité collective, ce qui participerait à l'affaiblissement du déterminisme social.</b></p><p>Car l'individualisation est un processus de long terme de construction de l'individu comme sujet, lié à la démocratie et au marché, et il existe différents critères d'individualisation : le diplôme, le revenu, le lieu de résidence, le contrat de travail, le genre et les nouvelles technologies.</p><p>En effet, les transformations dans l'organisation du travail brisent les solidarités, avec notamment le système des primes individuelles ou la suppression des postes en interne ; la baisse du syndicalisme est également un symbole de l'affaiblissement des liens collectifs.</p><p>Illustration : les nouvelles technologies se mettent au service de l'individualisation dans le monde du travail, avec l'apparition des notes et avis en ligne, comme pour les chauffeurs Uber.</p>`},
{q:"Pourquoi l'identification subjective fragilise-t-elle l'analyse en termes de classes ?",
a:`<p><b>L'identification subjective au groupe social — le sentiment d'adhésion et d'appartenance à ce groupe — ne correspond pas toujours à la position objective de l'individu.</b></p><p>Car l'individu a tendance à se situer par rapport à la moyenne, sans conscience subjective de sa vraie position : les individus ont fortement tendance à se situer dans la classe moyenne, même en étant parfois issus d'un milieu populaire.</p><p>En effet, la fragilisation des situations d'emploi et le chômage affaiblissent le sentiment d'appartenance commun à une catégorie professionnelle ; le sentiment d'appartenance tend à décliner notamment chez les ouvriers, même si l'augmentation des inégalités est constatée.</p><p>Illustration chiffrée : l'identification à la classe ouvrière est passée de 10&nbsp;% en 1999 à 7,2&nbsp;% en 2009 puis 6,7&nbsp;% en 2013 — il y a un retour des classes sociales mais pas forcément de conscience de classe : c'est la «&nbsp;déstructuration des classes sociales&nbsp;» ou la «&nbsp;crise de la conscience de classe&nbsp;».</p>`}
]}
]});

{num:"3.1", short:"Dotations factorielles et technologiques (avantages comparatifs)",
text:"Comprendre le rôle des dotations factorielles et technologiques (avantages comparatifs) dans les échanges commerciaux et la spécialisation internationale.",
cours:`
<h4>A — L'évolution du commerce international</h4>
<div class="def"><p><b>Commerce international</b> = ensemble des échanges de biens et services entre des agents résidents sur des territoires économiques différents.</p></div>
<p>Depuis le XXe siècle, la croissance des échanges internationaux a engendré l'interdépendance entre les pays. En effet, avant le XXe siècle, ce sont les produits agricoles, comestibles, qui dominent les échanges mais les produits manufacturés ont rapidement pris la dominante bien que les échanges de services atteignent 20&nbsp;% des échanges mondiaux.</p>
<p>On peut distinguer 3 groupes dominants :</p>
<ul><li>L'UE</li><li>Les USA et l'Aléna (alliance de pays nord-américains)</li><li>Les NPIA (nouveaux pays industrialisés asiatiques)</li></ul>
<p>On assiste donc à une tripolarisation des échanges mais la part des pays émergents prend de l'ampleur, notamment avec les BRICS.</p>
<p>En 1947, 23 pays signent des accords sur la libéralisation du commerce de marchandises avec le GATT (General Agreement on Tariffs and Trade). Les accords de Marrakech en 1994 donnent lieu à la création de l'OMC (Organisation mondiale du commerce) l'année suivante.</p>

<h4>B — Pourquoi échanger</h4>
<h5>1) Des avantages absolus aux avantages comparatifs</h5>
<p><b>La théorie des avantages absolus :</b> Pour <b>Adam Smith</b>, chaque pays doit se spécialiser dans la production et les exportations de produits où il a un avantage absolu, c'est-à-dire des coûts de production &lt; à ceux des autres. Économiste classique, il s'oppose au protectionnisme car le commerce international est un jeu à somme positive (tout le monde gagne). En effet, il est possible d'avoir une production de biens supérieure à une situation d'autarcie (je ferme complètement mes frontières, rien ne rentre) et cela permet de pacifier les échanges.</p>
<p><b>Les avantages comparatifs :</b> sont développés par <b>David Ricardo</b>. Chaque pays doit se spécialiser dans le produit où il est le meilleur ou dans la production où il a le moins de désavantage afin de permettre une allocation optimale des facteurs de production. 3 hypothèses fondent ce modèle :</p>
<ul><li>les facteurs de production sont immobiles au niveau international</li>
<li>les facteurs de production sont mobiles au niveau national</li>
<li>les biens sont mobiles au niveau international</li></ul>
<div class="exo"><div class="exo-t">Exercice tableau (drap / vin)</div>
<table><tr><th></th><th>Portugal</th><th>Angleterre</th></tr>
<tr><td>drap</td><td>90</td><td>10</td></tr>
<tr><td>vin</td><td>80</td><td>12</td></tr>
<tr><td>rapport yt drap</td><td>1.1</td><td>0.9</td></tr>
<tr><td>rapport yt vin</td><td>1.5</td><td>0.67</td></tr></table>
<p><b>1) Quel pays a un avantage absolu sur les draps, le vin ?</b><br>Le Portugal a l'avantage sur la production du drap et du vin.</p>
<p><b>3) Dans quelle production l'Angleterre est-elle le plus efficace en termes d'avantage comparatif ?</b><br>L'Angleterre est le plus efficace en production de vin.</p>
<p><b>4) Comment doivent se spécialiser les pays ?</b><br>Le Portugal dans les draps, l'Angleterre dans le vin.</p></div>
<p>Chaque nation a intérêt à se spécialiser dans la production pour laquelle elle a le coût relatif le plus faible et à se procurer les biens qu'elle ne produit plus grâce à l'échange international. Ainsi, alors qu'un pays peut être privé d'avantages absolus, il est toujours potentiellement détenteur d'un avantage comparatif et peut donc se spécialiser.</p>
<p>Ainsi, chacun se spécialisant là où il est relativement le meilleur ou relativement le moins mauvais permet une allocation des ressources optimale et une production mondiale supérieure comparée à l'autarcie.</p>
<div class="rem"><p><b>💡 À retenir — Smith vs Ricardo en une phrase :</b></p>
<p><b>Smith</b> → «&nbsp;tu échanges seulement si tu es objectivement <u>meilleur</u> que ton voisin sur un produit&nbsp;» (avantage <b>absolu</b>).</p>
<p><b>Ricardo</b> → «&nbsp;tu échanges <u>même si tu es moins bon partout</u> : tu as forcément quelque chose à apporter&nbsp;» (avantage <b>comparatif</b>).</p></div>
<p>La conséquence concrète est décisive : <b>Ricardo justifie pourquoi les pays pauvres ou moins développés ont quand même intérêt à participer au commerce international</b> — ce que Smith ne pouvait pas expliquer, puisque selon lui un pays moins performant dans tous les domaines n'aurait <b>aucun avantage absolu</b> et donc aucun intérêt à échanger avec qui que ce soit. C'est d'ailleurs pour cette raison que <b>Ricardo est considéré comme bien plus important que Smith dans l'histoire de la pensée économique sur le commerce international</b>.</p>

<h5>2) La dotation factorielle</h5>
<div class="rem"><p><b>🔎 En clair :</b> la théorie HOS part d'une idée simple : chaque pays possède des quantités différentes de facteurs de production, principalement le <b>capital</b> (machines, technologies) et le <b>travail</b> (main d'œuvre). Or, plus un facteur est <b>abondant</b> dans un pays, moins il coûte cher. Un pays a donc naturellement intérêt à produire et exporter les biens qui utilisent en grande quantité le facteur dont il dispose le plus.</p>
<p>Exemples : l'<b>Allemagne</b>, riche en capital, exporte des voitures et des machines ; le <b>Bangladesh</b>, riche en travail peu qualifié, exporte des vêtements.</p>
<p>Contrairement à <b>Ricardo</b>, qui expliquait les échanges par des différences de technologie entre pays, <b>HOS suppose que la technologie est identique partout</b> — ce qui différencie les pays, c'est uniquement ce qu'ils possèdent en abondance.</p></div>
<p>La <b>théorie HOS (Modèle Heckscher-Ohlin-Samuelson)</b> propose une idée où un pays est amené à exporter les produits incorporant une plus forte quantité de facteurs de production, c'est-à-dire celles dont ils sont les mieux dotés.</p>
<p>Cette théorie suppose que :</p>
<ul><li>les facteurs de production sont parfaitement mobiles à l'intérieur des nations mais immobiles entre les nations ;</li>
<li>les technologies sont identiques dans les 2 nations (contrairement à Ricardo il n'y a pas de différences entre les nations) ;</li>
<li>les préférences des consommateurs sont similaires au sein des 2 nations. Celles-ci se différencient uniquement par la dotation relative en facteurs.</li></ul>
<div class="exo"><div class="exo-t">Exercice — dotations factorielles</div>
<p><b>1)</b> La dotation factorielle correspond à la capacité du facteur capital d'un pays dans le but de mesurer les niveaux de productivité. Au niveau de l'Allemagne, le facteur travail qualifié car elle possède un taux fort d'importations en travail qualifié, a + 0,10 de part par secteur au-delà d'une intensité de travail dépassant les 0,25. En revanche, au Bangladesh le facteur prédominant est plus le facteur travail, car ce dernier se tourne bien moins vers les importations américaines avec un seuil toujours inférieur à 0,003 tous niveaux d'intensité confondus.</p>
<p><b>2)</b> Le passage souligné explique qu'un pays dont le facteur capital est prédominant sera en mesure de produire plus de biens dont la production est «&nbsp;à forte intensité capitalistique&nbsp;» car le pays en question possédera plus de capital au départ et que donc le coût du capital y sera moins élevé.</p>
<p>Dotation factorielle = QTÉ DE CHACUN DES FACTEURS QUE CHACUN DES PAYS POSSÈDE.</p>
<p>Moins de contraintes sur recherches et dev, aussi si j'achète beaucoup de machines je paierai moins et aussi avec un capital je peux acheter plus.</p></div>
<div class="def"><p><b>Dotation factorielle</b> = chaque pays est caractérisé par une certaine quantité de facteurs de production (travail + capital).</p></div>
<p>La combinaison des facteurs travail et capital peut privilégier l'un des deux facteurs, cela donne un avantage comparatif au pays qui utilise le plus ce facteur de production et permet donc une meilleure allocation des ressources. Ainsi, par exemple, le Bangladesh se spécialise dans la production de biens à l'exportation nécessitant une forte dotation dans le facteur travail dans l'industrie textile tandis que l'Allemagne se spécialisera davantage dans les produits nécessitant une intensité dans le facteur capital, exemple l'industrie automobile.</p>

<h5>3) La dotation technologique</h5>
<p>Les avantages comparatifs peuvent également être le fruit de dotations technologiques différentes. On appelle <b>dotation technologique</b> d'un pays le volume de capital technologique (que l'on peut mesurer par le volume de brevets) et le volume de capital humain (que l'on peut mesurer par le niveau de diplôme moyen de la population active) disponible dans cette économie.</p>
<p>Plus le stock de capital technologique et humain est élevé, plus la combinaison productive est efficace, ce qui se traduit par une productivité du travail plus élevée. Ce qui permet de baisser les coûts de production permet de donner un avantage comparatif.</p>`,

a:`<p><b>Pour David Ricardo, chaque pays doit se spécialiser dans le produit où il est le meilleur ou dans la production où il a le moins de désavantage, afin de permettre une allocation optimale des facteurs de production.</b></p><p>Car chaque nation a intérêt à se spécialiser dans la production pour laquelle elle a le coût relatif le plus faible et à se procurer les biens qu'elle ne produit plus grâce à l'échange international.</p><p>En effet, alors qu'un pays peut être privé d'avantages absolus, il est toujours potentiellement détenteur d'un avantage comparatif et peut donc se spécialiser : chacun se spécialisant là où il est relativement le meilleur ou relativement le moins mauvais permet une allocation des ressources optimale et une production mondiale supérieure comparée à l'autarcie.</p><p>Illustration : dans l'exemple du cours, le Portugal détient l'avantage absolu sur le drap et le vin, mais l'Angleterre, plus efficace relativement dans le vin, doit s'y spécialiser tandis que le Portugal se spécialise dans le drap. Le modèle repose sur 3 hypothèses : facteurs immobiles au niveau international, mobiles au niveau national, biens mobiles internationalement.</p>`},
{q:"Quel est le rôle des dotations factorielles dans la spécialisation internationale ?",
a:`<p><b>Selon la théorie HOS (Heckscher-Ohlin-Samuelson), un pays est amené à exporter les produits incorporant une plus forte quantité du facteur de production dont il est le mieux doté.</b></p><p>Car chaque pays est caractérisé par une certaine quantité de facteurs de production (travail + capital) : c'est sa dotation factorielle. La combinaison des facteurs peut privilégier l'un des deux, ce qui donne un avantage comparatif au pays qui utilise le plus ce facteur et permet une meilleure allocation des ressources.</p><p>En effet, cette théorie suppose que les facteurs sont parfaitement mobiles à l'intérieur des nations mais immobiles entre elles, que les technologies sont identiques (contrairement à Ricardo) et que les préférences des consommateurs sont similaires : les pays ne se différencient que par leur dotation relative en facteurs.</p><p>Illustration : le Bangladesh se spécialise dans l'industrie textile, qui nécessite une forte dotation en facteur travail, tandis que l'Allemagne se spécialise dans les produits à forte intensité capitalistique, comme l'industrie automobile.</p>`},
{q:"Comment les dotations technologiques expliquent-elles les avantages comparatifs ?",
a:`<p><b>Les avantages comparatifs peuvent être le fruit de dotations technologiques différentes : le volume de capital technologique et de capital humain disponible dans une économie.</b></p><p>Car on mesure le capital technologique par le volume de brevets et le capital humain par le niveau de diplôme moyen de la population active.</p><p>En effet, plus le stock de capital technologique et humain est élevé, plus la combinaison productive est efficace, ce qui se traduit par une productivité du travail plus élevée ; cette productivité permet de baisser les coûts de production, ce qui donne un avantage comparatif.</p>`},
{q:"Pourquoi Adam Smith considère-t-il le commerce international comme un jeu à somme positive ?",
a:`<p><b>Pour Adam Smith, chaque pays doit se spécialiser dans la production et l'exportation des produits où il a un avantage absolu, c'est-à-dire des coûts de production inférieurs à ceux des autres.</b></p><p>Car, économiste classique, il s'oppose au protectionnisme : le commerce international est un jeu à somme positive — tout le monde gagne.</p><p>En effet, il est possible d'avoir une production de biens supérieure à une situation d'autarcie (fermeture complète des frontières), et l'échange permet de pacifier les relations entre nations.</p>`}
]},

{num:"3.2", short:"Le commerce entre pays comparables",
text:"Comprendre le commerce entre pays comparables (différenciation des produits, qualité des produits, et fragmentation de la chaîne de valeur).",
cours:`
<h4>B — Le commerce entre pays comparables</h4>
<p>Les pays comparables sont des pays qui ont le même niveau de développement et qui exportent des biens comparables CAD dont les exportations consistent essentiellement en du commerce intra-branche. Le commerce inter-branche correspond à un commerce de produits de branches d'activités différentes. (Ex : la France vend des produits manufacturés à l'Afrique du Sud et importe en contrepartie des matières premières.) En 40 ans le commerce intra-branche dans le commerce mondial a triplé en passant de 10&nbsp;% en 1960 à plus de 35 en 2016. Il est mesuré avec l'indice Grubel-Lloyd. Cela signifie donc que des pays comparables échangent de plus en plus entre eux.</p>

<h5>1) La différenciation de produits</h5>
<p>Il existe de nombreuses possibilités pour différencier les produits comme par exemple :</p>
<ul><li>la nature du produit (forme, design, innovation, fiabilité, etc.)</li>
<li>les services liés (commande à distance, livraison, délais, installation, SAV)</li>
<li>la technologie</li>
<li>l'image de marque (symbole, évènements)</li></ul>
<p>Les économistes parlent de <b>différenciation horizontale</b> lorsque les firmes proposent des produits différents de leurs concurrents (taille, forme, couleur, design) mais des qualités et des prix comparables. Dans une structure de marché qualifiée de concurrence monopolistique, chaque firme est en situation de monopole sur un produit au sein d'un ensemble de produits différenciés horizontalement. Dans ces conditions le commerce entre pays comparables s'explique par la différence de goût des consommateurs. Ainsi même si 2 nations se caractérisent par des dotations factorielles et technologiques proches elles ont intérêt à échanger car la satisfaction des consommateurs augmente du fait de la diversité de choix.</p>
<p>Les firmes peuvent également <b>diversifier verticalement</b> leurs produits en proposant des produits similaires mais sur des gammes différentes. La différence de qualité permet donc d'expliquer le commerce entre pays comparables. Il faut noter que ce type de commerce intra-branche est compatible avec une analyse interne d'avantage comparatif. Ainsi les pays vont se spécialiser sur un niveau de gamme en fonction de leur dotation relative en travail et technologies.</p>
<div class="exo"><div class="exo-t">Exercice — différenciation produit</div>
<p><b>1)</b> Entre la France et l'Allemagne il y a une différence d'exportation quant à la qualité des produits exportés. En effet la France exporte en majorité des produits mid-gamme (48&nbsp;%) et en minorité du haut de gamme (22&nbsp;%) là où l'Allemagne exporte en minorité du bas de gamme avec 8&nbsp;% contre 65&nbsp;% de haut de gamme. On constate que l'Allemagne vend donc en majorité de la haute qualité là où la France exporte de tout.</p></div>

<h5>3) La fragmentation de la chaîne de valeur</h5>
<p>Les modifications organisationnelles couplées à la baisse des coûts de commerce ont conduit les firmes à fragmenter la chaîne de valeur en de multiples tâches qui seront réalisées dans des pays différents afin de bénéficier des avantages comparatifs. Cette fragmentation de la chaîne de valeur génère de fait avec les échanges intra-branche les produits semi-finis. Selon l'OMC l'exportation des biens intermédiaires représentait en 2016 40&nbsp;% des exportations mondiales de marchandises et 45&nbsp;% des exportations de ces produits semi-finis constituent du commerce intra-branche.</p>
<div class="def"><p><b>La DIPP (division internationale du processus productif)</b> = processus qui consiste pour une entreprise à s'implanter dans différents pays en fonction des avantages spécifiques qu'ils génèrent en fonction de l'étape de production.</p>
<p><b>Produits semi-finis :</b> conso intermédiaires.</p></div>
<p>Les échanges internationaux entre pays comparables ne concernent pas que le commerce de produits finis mais concernent aussi des consommations intermédiaires et également des pièces détachées qui feront l'objet d'un assemblage. Ce type de commerce est la conséquence de la fragmentation de la chaîne de valeur.</p>
<p>Des pays globalement similaires en termes de dotations factorielles vont alors se spécialiser sur des niveaux de gamme différents pour un même produit. L'exemple du lanceur spatial Ariane illustre cette fragmentation de la chaîne de valeur entre pays comparables puisque sa fabrication implique 600 entreprises de 13 pays européens.</p>`,
savoir:[
"<b>Définitions :</b> pays comparables (même niveau de développement, exportations de biens comparables), commerce intra-branche / inter-branche, différenciation horizontale / verticale, DIPP, produits semi-finis (consommations intermédiaires).",
"<b>Chiffres à mobiliser :</b> le commerce intra-branche a triplé en 40 ans (10 % en 1960 → plus de 35 % en 2016, indice Grubel-Lloyd) ; biens intermédiaires = 40 % des exportations mondiales en 2016 (OMC), dont 45 % en intra-branche.",
"<b>Mécanisme différenciation horizontale :</b> produits différents (taille, forme, design) à qualité/prix comparables → concurrence monopolistique → le commerce s'explique par la différence de goûts des consommateurs → gain de diversité même à dotations proches.",
"<b>Mécanisme différenciation verticale (qualité) :</b> gammes différentes pour des produits similaires → les pays se spécialisent sur un niveau de gamme selon leur dotation relative. Exemple chiffré : Allemagne 65 % d'exportations haut de gamme vs France 48 % de milieu de gamme et 22 % de haut de gamme.",
"<b>Mécanisme fragmentation :</b> baisse des coûts du commerce → chaîne de valeur découpée en tâches réalisées dans différents pays selon leurs avantages comparatifs → essor des échanges de biens intermédiaires. Exemple à citer : le lanceur Ariane (600 entreprises, 13 pays européens)."
],

</div>`,
