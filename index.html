],
trame:`<div class="trame-steps">
<div class="ts"><span class="tsn">1</span><div class="ts-body"><span class="ts-lbl">Définitions</span>Distingue <b>mobilité observée/brute</b>, <b>mobilité structurelle</b> (imposée par l'évolution de la structure de l'emploi), <b>mobilité nette</b> (= brute − structurelle) et <b>fluidité sociale</b> (odds ratio).</div></div>
<div class="ts"><span class="tsn">2</span><div class="ts-body"><span class="ts-lbl">Partie 1 — la composante structurelle</span>Une partie de la mobilité est <b>contrainte</b> par l'évolution des emplois : les enfants des CSP en déclin (agriculteurs) sont recrutés par celles en essor → mobilité forcée faute de place (25&nbsp;% en 2003, 20&nbsp;% en 2014-15).</div></div>
<div class="ts"><span class="tsn">3</span><div class="ts-body"><span class="ts-lbl">Partie 2 — fluidité ≠ mobilité</span>La <b>fluidité</b> se mesure par l'odds ratio (=1 → aucun lien origine/destinée). Chiffres : en 1977 un fils de cadre avait 28 fois plus de chances de devenir cadre qu'un fils d'ouvrier, 12 fois en 2015. Une société plus mobile n'est pas forcément plus fluide (sociétés fictives : 25&nbsp;% vs 20&nbsp;% mais même odds ratio).</div></div>
<div class="ts concl"><span class="tsn">→</span><div class="ts-body"><span class="ts-lbl">Conclusion</span>La fluidité, qui mesure l'égalité des chances « toutes choses égales par ailleurs », est le vrai indicateur de démocratisation.</div></div>
</div>`,
plans:[
{ec:"EC1",q:"L'évolution de la structure socioprofessionnelle suffit-elle à expliquer la mobilité sociale ?",body:`<p><span class="pt">Intro :</span> distinguer mobilité observée, structurelle et fluidité.</p><p><span class="pt">I.</span> Oui en partie : la mobilité structurelle (tertiarisation, salarisation) impose une mobilité contrainte importante.</p><p><span class="pt">II.</span> Mais non : la mobilité nette et la fluidité montrent que l'origine sociale pèse toujours (odds ratio : 28 → 12) ; rôle de l'école et de la famille (objectif 4.5).</p><p><span class="pt">Concl :</span> la structure explique beaucoup, mais pas l'égalité des chances.</p>`}
],
cards:[
{q:"Qu'est-ce que la mobilité structurelle ?",
a:`<p><b>La mobilité structurelle est la mobilité minimale imposée par l'évolution de la structure de l'emploi entre deux générations.</b></p><p>Car elle découle de la transformation de la population active : les enfants issus de CSP en déclin vont être recrutés par celles en essor, si bien que la répartition des CSP entre le père et le fils n'est pas identique.</p><p>En effet, elle représente une part importante de la mobilité : elle concernait 25&nbsp;% des individus en 2003 contre 20&nbsp;% entre 2014 et 2015.</p><p>Illustration : si seulement 1/4 des fils d'agriculteurs le sont devenus eux-mêmes, cela s'explique en partie par la dureté du travail et les faibles revenus, mais aussi par les évolutions structurelles — la taille des exploitations a augmenté et le nombre d'emplois a diminué : ils sont contraints à la mobilité faute de place (mobilité contrainte).</p>`},
{q:"Qu'est-ce que la fluidité sociale et comment la mesure-t-on ?",
a:`<p><b>La fluidité sociale mesure la force du lien entre l'origine sociale et la position sociale, indépendamment de la taille des groupes et de leurs évolutions : c'est la probabilité relative d'égalité des chances.</b></p><p>Car on l'appréhende avec le rapport des chances relatives (odds ratio) : par exemple, la probabilité d'un enfant d'ouvrier de devenir cadre rapportée à la probabilité d'un enfant de cadre de devenir cadre.</p><p>En effet, un rapport égal à 1 traduit l'absence de lien entre origine et destinée sociale ; plus la valeur diffère de 1, plus la répartition des positions sociales est inégalitaire.</p><p>Illustration chiffrée : en France en 1977, un fils de cadre avait 28 fois plus de chances de devenir cadre qu'un enfant d'employé ou d'ouvrier ; en 2015 ce rapport est descendu à 12 — l'inégalité des chances a diminué mais reste forte.</p>`},
{q:"Une société plus mobile est-elle nécessairement une société plus fluide ?",
a:`<p><b>Non : plus de mobilité ne signifie pas forcément plus de fluidité — mobilité et fluidité ne sont pas synonymes.</b></p><p>Car la mobilité observée comporte une composante structurelle imposée par l'évolution de la structure de l'emploi, tandis que la fluidité mesure l'égalité des chances indépendamment de ces évolutions de structure.</p><p>En effet, dans l'exercice du cours comparant deux sociétés fictives, la société 2 est plus mobile (25&nbsp;% de mobiles contre 20&nbsp;%) mais les inégalités des chances y sont exactement les mêmes : dans les deux cas, le rapport des probabilités relatives est de 9. La mobilité observée augmente, mais l'origine sociale continue d'influencer aussi fortement les trajectoires.</p><p>De plus, l'augmentation de la mobilité peut concerner des trajectoires sans changement de niveau de qualification : la société est plus mobile sans que progresse la probabilité, pour un enfant de CSP moins qualifiée, d'atteindre une CSP plus qualifiée.</p>`},
{q:"Comment distingue-t-on mobilité brute, mobilité structurelle et mobilité nette ?",
a:`<p><b>La mobilité nette est égale à la mobilité brute moins la mobilité structurelle.</b></p><p>Car la mobilité brute (ou observée) correspond à la proportion d'individus qui changent de position sociale par rapport à leurs pères — sur la diagonale de la table se trouvent les immobiles ; la mobilité structurelle se calcule en comparant les marges rapportées à l'effectif total (∑ |colonne ensemble − ligne ensemble| / 2).</p><p>En effet, la mobilité nette traduit la fluidité sociale, c'est-à-dire l'égalité des chances — on parle aussi de mobilité pure. Mais il est souvent difficile de distinguer les deux types dans les tableaux statistiques : la mesure ne permet pas toujours de savoir s'il s'agit d'une mobilité contrainte ou liée aux évolutions structurelles, raison pour laquelle les sociologues se sont intéressés à la fluidité sociale.</p>`}
]},

{num:"4.4", short:"Lire les tables : ascension, reproduction, déclassement, hommes/femmes",
text:"À partir de la lecture des tables de mobilité, être capable de mettre en évidence des situations de mobilité ascendante, de reproduction sociale et de déclassement, et de retrouver les spécificités de la mobilité sociale des hommes et de celles des femmes.",
cours:`
<h4>D — La mobilité selon le genre</h4>
<p>Depuis la fin des années 70 la mobilité sociale des hommes entre 35 et 59 ans est restée globalement stable. En 2015 comme en 1977 près de 2/3 d'entre eux appartiennent à des CSP différentes de celles de leur père. En parallèle celle des femmes entre 35 et 59 ans a progressé de 12 points par rapport à celle de leur mère et de 6 points par rapport à leur père. Ces mobilités sociales sont de moins en moins liées à l'évolution de la structure sociale entre les générations. Depuis 40 ans les hommes comparés à leur père ont plus de mouvements ascendants que descendants. Par rapport à leur mère les femmes restent beaucoup plus nombreuses à connaître une ascension sociale plutôt qu'un déclassement, en revanche par rapport à leur père les trajectoires des femmes sont plus ascendantes que descendantes. La reproduction sociale chez les hommes reste forte parmi les cadres, employés et ouvriers qualifiés tandis que celle des femmes reste prononcée parmi les moins qualifiées.</p>
<p>Les femmes ont connu une forte croissance des ascensions sociales et un recul des déclassements pour toutes les catégories salariées. Les trajectoires intergénérationnelles des femmes salariées se sont fortement rapprochées de celles des hommes. Les évolutions ont été du même ordre lorsqu'elles ont été comparées à leur père mais les inégalités sociales de genre dans l'accès aux catégories les plus qualifiées demeurent fortes. La transmission des inégalités sociales s'est réduite jusqu'en 93 mais stagne depuis.</p>
<div class="rem"><p><b>Remarque :</b> l'emploi féminin reste concentré dans des CSP ouvrières (ouvriers employés). 52&nbsp;% des filles sont dans ces catégories contre 42&nbsp;% des fils et seulement 15&nbsp;% des filles sont cadres ou professions intermédiaires supérieures soit 5 points de moins que les fils.</p></div>
<div class="exo"><div class="exo-t">Rappels de lecture des tables (exercices du cours)</div>
<p>La diagonale de chiffres représente la part de fils issus de la même PCS que leurs parents (reproduction sociale / les «&nbsp;immobiles&nbsp;»). La part de cadres dont le père était ouvrier (19,9&nbsp;%) illustre une mobilité ascendante ; 84,1&nbsp;% des fils d'agriculteurs le deviennent (immobilité la plus élevée) ; 56,8&nbsp;% des ouvriers sont issus de parents ouvriers. La mobilité descendante correspond à la notion de déclassement social.</p></div>`,
savoir:[
"<b>Savoir repérer dans une table :</b> la diagonale = reproduction sociale (immobiles) ; au-dessus/en dessous selon la hiérarchie = mobilité ascendante ou déclassement. Exemples chiffrés : 19,9 % des fils d'ouvriers deviennent cadres (ascension), 84,1 % des fils d'agriculteurs restent agriculteurs (reproduction), 56,8 % des ouvriers sont fils d'ouvriers.",
"<b>Spécificités hommes :</b> mobilité globalement stable depuis la fin des années 70 (≈ 2/3 dans une CSP différente du père en 1977 comme en 2015) ; plus de mouvements ascendants que descendants ; reproduction forte chez les cadres, employés et ouvriers qualifiés.",
"<b>Spécificités femmes :</b> mobilité en progression (+12 points vs la mère, +6 points vs le père) ; forte croissance des ascensions et recul des déclassements ; trajectoires rapprochées de celles des hommes ; mais reproduction prononcée parmi les moins qualifiées et inégalités d'accès aux catégories les plus qualifiées toujours fortes.",
"<b>Chiffres genre à citer :</b> 52 % des filles dans les CSP ouvriers/employés contre 42 % des fils ; 15 % des filles cadres ou professions intermédiaires supérieures (5 points de moins que les fils) ; transmission des inégalités réduite jusqu'en 1993 puis stagnation."
],
sujets:[],
trame:`<div class="trame-steps">
<div class="ts"><span class="tsn">1</span><div class="ts-body"><span class="ts-lbl">Méthode de lecture</span>Rappelle comment lire une table : la <b>diagonale</b> = reproduction sociale (immobiles) ; au-dessus/en dessous selon la hiérarchie = <b>ascension</b> ou <b>déclassement</b>. Précise toujours recrutement (« lire en colonne ») ou destinée (« en ligne »).</div></div>
<div class="ts"><span class="tsn">2</span><div class="ts-body"><span class="ts-lbl">Partie 1 — les trois situations</span>Reproduction : 84,1&nbsp;% des fils d'agriculteurs restent agriculteurs, 56,8&nbsp;% des ouvriers sont fils d'ouvriers. Ascension : 19,9&nbsp;% des fils d'ouvriers deviennent cadres. Déclassement : trajectoires descendantes dans la hiérarchie.</div></div>
<div class="ts"><span class="tsn">3</span><div class="ts-body"><span class="ts-lbl">Partie 2 — hommes / femmes</span>Hommes : mobilité stable depuis 1977 (≈ 2/3 dans une autre CSP), plus d'ascensions que de déclassements. Femmes : mobilité en progression (+12 pts vs la mère), forte croissance des ascensions, mais reproduction prononcée chez les moins qualifiées (52&nbsp;% des filles en CSP ouvriers/employés vs 42&nbsp;% des fils).</div></div>
<div class="ts concl"><span class="tsn">→</span><div class="ts-body"><span class="ts-lbl">Conclusion</span>Les tables révèlent une mobilité réelle mais une reproduction persistante, avec des trajectoires genrées qui se rapprochent sans s'égaliser.</div></div>
</div>`,
cards:[
{q:"Comment repérer dans une table de mobilité l'ascension, la reproduction et le déclassement ?",
a:`<p><b>La diagonale de la table représente la reproduction sociale (les immobiles, fils issus de la même PCS que leurs parents) ; hors diagonale, on lit la mobilité ascendante ou descendante (déclassement).</b></p><p>Car une situation de mobilité ascendante correspond à un fils accédant à une position plus élevée que celle de son père — par exemple, 19,9&nbsp;% des fils d'ouvriers deviennent cadres ; le déclassement correspond à la mobilité descendante.</p><p>En effet, les chiffres du cours illustrent la reproduction : 84,1&nbsp;% des fils d'agriculteurs le deviennent (immobilité la plus élevée de toutes les catégories) et 56,8&nbsp;% des ouvriers sont issus de parents ouvriers ; à comparer aux 30,3&nbsp;% de fils de cadres qui deviennent cadres contre 19,9&nbsp;% pour les fils d'ouvriers.</p>`},
{q:"Quelles sont les spécificités de la mobilité sociale des femmes par rapport à celle des hommes ?",
a:`<p><b>Depuis la fin des années 70, la mobilité sociale des hommes est restée globalement stable tandis que celle des femmes a progressé.</b></p><p>Car en 2015 comme en 1977, près de 2/3 des hommes appartiennent à des CSP différentes de celles de leur père, alors que la mobilité des femmes a progressé de 12 points par rapport à leur mère et de 6 points par rapport à leur père.</p><p>En effet, les femmes ont connu une forte croissance des ascensions sociales et un recul des déclassements pour toutes les catégories salariées : leurs trajectoires intergénérationnelles se sont fortement rapprochées de celles des hommes. Mais la reproduction sociale des hommes reste forte parmi les cadres, employés et ouvriers qualifiés, tandis que celle des femmes reste prononcée parmi les moins qualifiées.</p><p>Illustration : l'emploi féminin reste concentré dans les CSP ouvriers/employés (52&nbsp;% des filles contre 42&nbsp;% des fils) et seulement 15&nbsp;% des filles sont cadres ou professions intermédiaires supérieures, 5 points de moins que les fils ; la transmission des inégalités s'est réduite jusqu'en 1993 mais stagne depuis.</p>`},
{q:"Les trajectoires des hommes sont-elles plutôt ascendantes ou descendantes ?",
a:`<p><b>Depuis 40 ans, les hommes comparés à leur père ont plus de mouvements ascendants que descendants.</b></p><p>Car ces mobilités sont de moins en moins liées à l'évolution de la structure sociale entre les générations.</p><p>En effet, la reproduction sociale chez les hommes reste néanmoins forte parmi les cadres, les employés et les ouvriers qualifiés.</p><p>De même pour les femmes : par rapport à leur mère, elles restent beaucoup plus nombreuses à connaître une ascension sociale plutôt qu'un déclassement, et par rapport à leur père leurs trajectoires sont également plus ascendantes que descendantes.</p>`}
]},

{num:"4.5", short:"Les facteurs de la mobilité : structure, école, famille",
text:"Comprendre comment l'évolution de la structure socioprofessionnelle, les niveaux de formation et les ressources et configurations familiales contribuent à expliquer la mobilité sociale.",
cours:`
<h4>II — Les déterminants de la reproduction sociale et de la mobilité sociale</h4>
<div class="exo"><div class="exo-t">Exercice — chanson méritocratie</div>
<p><b>Q1 Pourquoi la massification scolaire devient une ambition ?</b><br>Parce qu'elle permet une meilleure répartition des chances de réussite au BAC d'ici les années 2000 et ainsi tendre vers une égalité des chances dans sa vie professionnelle future.</p>
<p><b>Q2 Pourquoi l'école doit être un ascenseur social ?</b><br>Car elle offre une égalité des chances ultime pour que tous les enfants réussissent.</p>
<p><b>Q3.</b> Définir méritocratie. <b>Q4.</b> L'école est-elle méritocratique ? Justifiez. <b>Q6.</b> Qu'est-ce que les odds ratio ? <b>Q7.</b> Quelles sont les explications de l'échec de l'école ? <b>Q8.</b> Qu'est-ce que la peur du déclassement ? <b>Q9.</b> Quelles sont les solutions proposées ?</p></div>

<h4>A) La massification scolaire et le rôle de la formation</h4>
<p>Depuis la fin de la seconde guerre mondiale, on assiste à une démocratisation et une massification scolaire. Seuls 20&nbsp;% des élèves passaient leur bac en 1965 contre près de 80&nbsp;% en 2011 (objectif fixé près de 30 ans plus tôt par Jean-Pierre Chevènement). Cela s'explique notamment par la variété de BAC de plus en plus étendue. Les BAC technologiques ont été créés en 1968 et les BAC Pro en 1986. L'école s'est donc démocratisée en s'ouvrant au plus grand nombre mais l'égalité des chances reste à améliorer d'autant qu'on constate un déplacement des inégalités vers le supérieur.</p>
<h5>1 — Les déterminants de la réussite scolaire</h5>
<p>Les ressources familiales se définissent au travers des différents types de capitaux détenus par la famille :</p>
<ul>
<li><b>le capital économique</b> (= revenus + patrimoine) joue sur le niveau de bien-être des enfants, par exemple le fait d'avoir une chambre à soi augmente la probabilité de réussite à l'école. La détention du capital économique permet également de réduire le coût d'opportunité des études. En d'autres termes le coût de poursuite des études peut sembler comparativement moins élevé dans une famille aux revenus élevés que dans une famille au revenu faible ce qui engendre des stratégies au sein des familles ;</li>
<li><b>le capital culturel :</b> à revenus équivalents des parents les enfants réussissent mieux quand les parents sont plus diplômés en particulier la mère. En effet la détention d'un diplôme permet aux parents de mieux connaître les attentes pédagogiques et d'adopter les stratégies les plus rentables en termes de choix scolaires (choix d'options, spécialités, diplôme, etc.) ;</li>
<li><b>le capital social</b> (réseau et connaissances) contribue à l'insertion en particulier pour les enfants qui viennent de familles qui sont diplômées. Cela rejaillit également sur le rendement du diplôme. Ainsi à diplôme équivalent, un jeune issu de deux parents cadres a 1.3x plus de chances d'être cadre dès son premier emploi qu'un jeune issu d'une famille d'employés.</li>
</ul>
<p>On distingue 2 approches :</p>
<ul>
<li><b>l'approche déterministe :</b> pour <b>Pierre Bourdieu</b>, l'école reproduit et légitime les inégalités sociales car elle traite de manière égalitaire les enfants, quel que soit leur milieu social d'appartenance (principe de méritocratie). Or les enfants issus d'un milieu social favorisé ont généralement une meilleure dotation en capital culturel favorisant la réussite et engendrant de la reproduction sociale ;</li>
<li><b>une approche individualiste :</b> pour <b>Raymond Boudon</b>, il existe des stratégies au niveau des différents acteurs (famille, élève, établissement). Les parents ont des ambitions plus ou moins élevées pour leur progéniture et mettent en place des stratégies «&nbsp;coûts - risques - avantages&nbsp;». Ainsi les enfants issus de milieux favorisés sont davantage incités à faire des études longues alors que les enfants issus de milieux défavorisés sont eux incités à faire des études courtes.</li>
</ul>
<h5>2 — Les divergences entre la position sociale et le diplôme</h5>
<div class="def"><p><b>Paradoxe d'Anderson :</b> le diplôme, bien que plus élevé et étant une condition nécessaire, il ne garantit plus le statut social.</p></div>
<p>Selon <b>Becker</b>, le déclassement se définit comme l'impossibilité de rentabiliser l'investissement consenti par les familles, ce qui renvoie à la théorie du capital humain. La démocratisation scolaire a permis l'élévation du niveau global des diplômes ; pourtant, cela ne se traduit pas automatiquement par une position sociale supérieure à celle des parents. En effet, il y a une perte de valeur du diplôme, notamment des licences universitaires. Ainsi, à un niveau de diplôme équivalent ou supérieur à celui de ses parents, un bac +3 peut subir une situation de déclassement social.</p>
<p>Il est donc possible de parler de déclassement générationnel dont les facteurs sont multiples et s'entremêlent notamment quand il y a un fort niveau de chômage et une précarisation de l'emploi. La notion de déclassement revêt donc… d'une part l'incapacité de maintenir une position sociale héritée de ses parents et d'autre part un décalage entre le niveau de qualification d'un poste et celui possédé par l'individu.</p>

<h4>B) Le rôle des configurations familiales</h4>
<p>Les familles disposent de ressources variées mais inégalement réparties. Chaque famille transmet du capital éco / culturel et social à l'enfant ce qui tend à renforcer la reproduction sociale. Ainsi <b>Pierre Bourdieu</b> montre que ce que transmet la famille n'est pas seulement économique mais également culturel au sens où un ensemble de connaissances / références / habitudes sont transmises ce qui donne un avantage à l'individu. Le capital éco favorise l'accès aux études supérieures ce qui facilite la mobilité et l'accès à des études longues et sélectives. Il est également nécessaire pour s'installer en tant qu'indépendant ou pour la reprise d'une entreprise familiale. De plus à diplôme équivalent on constate qu'un fils d'ouvrier a moins de chances d'accéder à certains postes ce qui peut être dû au capital culturel plus faible ou au capital social.</p>
<p>La famille peut jouer un rôle actif dans la mobilité sociale en développant des stratégies d'ascension sociale. Ainsi on observe que les familles d'origine modeste peuvent avoir une réussite supérieure à condition de mettre les bonnes stratégies en place. Cela peut se constater notamment dans les familles d'origine étrangère car il y a une volonté d'intégration ainsi qu'une volonté de faire en sorte que les enfants n'aient pas les mêmes conditions. La taille de la fratrie impacte la mobilité, en effet plus le nombre d'enfants est important plus les ressources sont réparties. On constate ainsi que les premiers-nés ont un taux de réussite scolaire plus élevé que les frères et sœurs.</p>
<p>En effet les conditions de travail, notamment le fait d'avoir sa propre chambre favorise la réussite, de plus la transmission du capital culturel par les parents est plus aisée quand la taille d'une fratrie est petite (confère cours de première).</p>

<h4>C) L'évolution de la structure sociale</h4>
<p>La dynamique de la mobilité structurelle résulte du changement dans la structure socio-professionnelle entre les années 50 et aujourd'hui. La France est passée d'une société agricole à une société industrielle puis post-industrielle dans les années 70. Le salariat notamment dans les postes d'encadrement, notamment dans les catégories cadres, professions intellectuelles supérieures, professions intermédiaires. L'évolution de la structure d'emploi des hommes s'est faite plus rapidement que celle des femmes. La croissance annuelle de postes qualifiés a significativement diminué à la fin des années 80 au même moment où entraient sur le marché du travail les personnes ayant bénéficié de la vague d'expansion d'éducation secondaire et supérieure.</p>`,
savoir:[
"<b>Facteur 1 — l'évolution de la structure socioprofessionnelle :</b> passage d'une société agricole → industrielle → post-industrielle (années 70) ; salarisation et essor des postes d'encadrement ; ralentissement de la croissance des postes qualifiés fin années 80 au moment où arrivaient les diplômés de la massification.",
"<b>Facteur 2 — les niveaux de formation :</b> massification scolaire (20 % d'une classe d'âge au bac en 1965 → près de 80 % en 2011 ; bacs technologiques 1968, bacs pro 1986) ; mais déplacement des inégalités vers le supérieur ; paradoxe d'Anderson (le diplôme ne garantit plus le statut social) ; Becker et le déclassement (impossibilité de rentabiliser l'investissement éducatif, perte de valeur des licences).",
"<b>Facteur 3 — ressources et configurations familiales :</b> les 3 capitaux (économique : chambre à soi, coût d'opportunité des études ; culturel : diplôme des parents, surtout la mère, connaissance des attentes pédagogiques ; social : réseau — à diplôme équivalent, un jeune de parents cadres a 1,3x plus de chances d'être cadre dès le premier emploi) ; stratégies familiales d'ascension (familles d'origine étrangère) ; taille de la fratrie (premiers-nés avantagés).",
"<b>Le débat théorique à exposer :</b> Bourdieu (approche déterministe — l'école reproduit et légitime les inégalités car elle traite également des enfants inégalement dotés en capital culturel) vs Boudon (approche individualiste — stratégies coûts/risques/avantages : études longues pour les milieux favorisés, courtes pour les défavorisés).",
"<b>Définitions :</b> méritocratie, paradoxe d'Anderson, déclassement (double sens : incapacité à maintenir la position héritée / décalage qualification du poste vs qualification de l'individu)."
],
sujets:[
"Quels sont les facteurs explicatifs de la mobilité sociale ? (EC1)",
"L'évolution de la structure socioprofessionnelle suffit-elle à expliquer la mobilité sociale ? (EC1)",
"Dans quelle mesure l'École favorise-t-elle l'égalité des chances ? (EC1)",
"Comment expliquer les inégalités de réussite scolaire ? (EC1)"
],
trame:`<div class="trame-steps">
<div class="ts"><span class="tsn">1</span><div class="ts-body"><span class="ts-lbl">Définitions</span>Définis la mobilité sociale et annonce trois grands facteurs explicatifs : la structure, l'école, la famille.</div></div>
<div class="ts"><span class="tsn">2</span><div class="ts-body"><span class="ts-lbl">Partie 1 — structure et formation</span>L'<b>évolution de la structure socioprofessionnelle</b> (société agricole → industrielle → post-industrielle, salarisation, encadrement) et les <b>niveaux de formation</b> (massification : 20&nbsp;% au bac en 1965 → 80&nbsp;% en 2011 ; mais paradoxe d'Anderson : le diplôme ne garantit plus le statut).</div></div>
<div class="ts"><span class="tsn">3</span><div class="ts-body"><span class="ts-lbl">Partie 2 — famille et école (le débat théorique)</span>Les <b>ressources familiales</b> (3 capitaux : économique, culturel — surtout la mère, social — à diplôme égal un fils de cadre a 1,3× plus de chances d'être cadre). Débat : <b>Bourdieu</b> (l'école reproduit et légitime les inégalités) vs <b>Boudon</b> (stratégies individuelles coûts/risques/avantages).</div></div>
<div class="ts concl"><span class="tsn">→</span><div class="ts-body"><span class="ts-lbl">Conclusion</span>La mobilité résulte de la combinaison de ces facteurs ; l'école, censée démocratiser, reproduit aussi en partie les inégalités.</div></div>
</div>`,

{ec:"EC1",q:"L'évolution de la structure socioprofessionnelle suffit-elle à expliquer la mobilité sociale ?",body:`<p><span class="pt">Intro :</span> la structure est-elle le seul facteur ?</p><p><span class="pt">I.</span> Oui en partie : la mobilité structurelle (tertiarisation, salarisation) génère de la mobilité.</p><p><span class="pt">II.</span> Mais non : la formation, la famille (capitaux) et la fluidité (poids de l'origine) jouent aussi.</p><p><span class="pt">Concl :</span> la structure est nécessaire mais insuffisante.</p>`},
{ec:"EC1",q:"Dans quelle mesure l'École favorise-t-elle l'égalité des chances ?",body:`<p><span class="pt">Intro :</span> définir égalité des chances, méritocratie.</p><p><span class="pt">I.</span> L'école démocratise : massification, hausse des diplômes, ascension possible.</p><p><span class="pt">II.</span> Mais elle reproduit : inégalités déplacées vers le supérieur, Bourdieu (capital culturel), paradoxe d'Anderson.</p><p><span class="pt">Concl :</span> une démocratisation réelle mais inachevée.</p>`},

],
cards:[
{q:"Quels sont les facteurs explicatifs de la mobilité sociale ?",
a:`<p><b>La mobilité sociale s'explique par trois grands facteurs : l'évolution de la structure socioprofessionnelle, les niveaux de formation et les ressources et configurations familiales.</b></p><p>Car la France est passée d'une société agricole à une société industrielle puis post-industrielle dans les années 70, ce qui a imposé une mobilité structurelle : les enfants issus de CSP en déclin sont recrutés par celles en essor.</p><p>En effet, la massification scolaire (20&nbsp;% d'une classe d'âge au bac en 1965 contre près de 80&nbsp;% en 2011) a élevé le niveau de formation, et les ressources familiales — capital économique, culturel et social — déterminent largement la réussite scolaire et l'insertion professionnelle.</p><p>Illustration : à diplôme équivalent, un jeune issu de deux parents cadres a 1,3 fois plus de chances d'être cadre dès son premier emploi qu'un jeune issu d'une famille d'employés — preuve que la formation seule ne suffit pas à expliquer les trajectoires.</p>`},
{q:"Comment expliquer les inégalités de réussite scolaire ?",
a:`<p><b>Les inégalités de réussite scolaire s'expliquent par l'inégale dotation des familles en capitaux économique, culturel et social.</b></p><p>Car le capital économique (revenus + patrimoine) joue sur le bien-être de l'enfant — avoir une chambre à soi augmente la probabilité de réussite — et réduit le coût d'opportunité des études, ce qui engendre des stratégies différentes selon les familles ; le capital culturel fait qu'à revenus équivalents, les enfants réussissent mieux quand les parents sont plus diplômés, en particulier la mère, car le diplôme permet de connaître les attentes pédagogiques et d'adopter les stratégies les plus rentables (options, spécialités) ; le capital social (réseau) contribue à l'insertion.</p><p>En effet, deux approches théoriques s'opposent : pour Pierre Bourdieu (déterministe), l'école reproduit et légitime les inégalités car elle traite de manière égalitaire des enfants inégalement dotés en capital culturel ; pour Raymond Boudon (individualiste), les familles mettent en place des stratégies «&nbsp;coûts - risques - avantages&nbsp;» — les enfants de milieux favorisés sont incités aux études longues, ceux de milieux défavorisés aux études courtes.</p>`},
{q:"L'École favorise-t-elle l'égalité des chances ?",
a:`<p><b>L'école s'est démocratisée en s'ouvrant au plus grand nombre, mais l'égalité des chances reste à améliorer.</b></p><p>Car depuis la fin de la seconde guerre mondiale, on assiste à une démocratisation et une massification scolaire : seuls 20&nbsp;% des élèves passaient leur bac en 1965 contre près de 80&nbsp;% en 2011 (objectif fixé par Jean-Pierre Chevènement), grâce à la variété des bacs (technologiques créés en 1968, pro en 1986).</p><p>Mais en effet, on constate un déplacement des inégalités vers le supérieur, et le paradoxe d'Anderson montre que le diplôme, bien que plus élevé et condition nécessaire, ne garantit plus le statut social : selon Becker, la perte de valeur du diplôme (notamment des licences universitaires) peut conduire un bac+3 à une situation de déclassement social.</p><p>Illustration : pour Bourdieu, l'école reproduit et légitime même les inégalités, puisqu'elle traite de manière égalitaire des enfants dont les dotations en capital culturel sont inégales.</p>`},
{q:"Qu'est-ce que le paradoxe d'Anderson ?",
a:`<p><b>Le paradoxe d'Anderson désigne le fait que le diplôme, bien que plus élevé et étant une condition nécessaire, ne garantit plus le statut social.</b></p><p>Car la démocratisation scolaire a permis l'élévation du niveau global des diplômes, mais cela ne se traduit pas automatiquement par une position sociale supérieure à celle des parents.</p><p>En effet, il y a une perte de valeur du diplôme, notamment des licences universitaires : à un niveau de diplôme équivalent ou supérieur à celui de ses parents, un bac+3 peut subir une situation de déclassement social. Selon Becker, le déclassement se définit comme l'impossibilité de rentabiliser l'investissement consenti par les familles (théorie du capital humain).</p><p>On parle ainsi de déclassement générationnel, dont les facteurs s'entremêlent notamment en période de fort chômage et de précarisation de l'emploi : incapacité à maintenir la position sociale héritée des parents, et décalage entre le niveau de qualification du poste et celui de l'individu.</p>`},
{q:"Quel rôle jouent les configurations familiales dans la mobilité sociale ?",
a:`<p><b>Chaque famille transmet du capital économique, culturel et social à l'enfant, ce qui tend à renforcer la reproduction sociale — mais la famille peut aussi jouer un rôle actif dans l'ascension.</b></p><p>Car Pierre Bourdieu montre que ce que transmet la famille n'est pas seulement économique mais également culturel : un ensemble de connaissances, références et habitudes qui donnent un avantage à l'individu. Le capital économique favorise l'accès aux études longues et sélectives, et il est nécessaire pour s'installer en indépendant ou reprendre une entreprise familiale.</p><p>En effet, la famille peut développer des stratégies d'ascension sociale : les familles d'origine modeste peuvent avoir une réussite supérieure à condition de mettre les bonnes stratégies en place, ce qu'on observe notamment dans les familles d'origine étrangère (volonté d'intégration et de meilleures conditions pour les enfants).</p><p>Illustration : la taille de la fratrie impacte la mobilité — plus le nombre d'enfants est important, plus les ressources sont réparties ; les premiers-nés ont un taux de réussite scolaire plus élevé, et la transmission du capital culturel est plus aisée dans une petite fratrie.</p>`}
]}
]});

cours:`
<h4>A — Les caractéristiques de l'intégration européenne, la marche vers l'UEM</h4>
<p>L'intégration européenne concerne un ensemble de pays proches géographiquement qui décident de construire ensemble un espace économique et social au sein duquel il n'y aura pas d'entrave à l'échange (libre circulation des hommes ; capitaux ; marchandises). Ainsi depuis sa création en 1957, l'UE s'est progressivement élargie jusqu'à atteindre 28 membres avant la sortie des UK en 2020.</p>
<div class="def"><p><b>Intégration européenne :</b> processus par lequel l'addition de plusieurs économies distinctes conduit à la formation d'un vaste ensemble unifié.</p></div>
<p>Le libre-échange est censé apporter un surcroît de croissance économique, ainsi la création d'une zone économique intégrée permet d'être une réponse à la mondialisation.</p>
<p>L'intégration européenne s'est faite suite à la 2nde guerre mondiale afin de réduire le risque de conflit et répondre au besoin d'alliance économique et politique. L'UE crée donc une solidarité de fait mais cette construction n'est pas achevée sur le plan politique bien que sur le plan économique elle soit très poussée.</p>
<p>Le schéma de <b>B. Balassa</b> fait figure de référence et indique les 5 étapes d'intégration :</p>
<ol>
<li><b>la zone de libre-échange</b> = baisse voire suppression des barrières douanières</li>
<li><b>la zone douanière</b> = zone de libre-échange + tarif douanier commun</li>
<li><b>le marché commun</b> = zone douanière + libre circulation des travailleurs et des capitaux (entraîne besoin de règlementation)</li>
<li><b>l'union économique</b> = marché commun + politiques économiques communes (monétaire et budgétaire)</li>
<li><b>l'UEM</b> = union économique + monnaie unique + banque centrale</li>
</ol>
<div class="def"><p><b>Marché unique</b> = espace formé par la réunion de tous les pays membres de l'UE où les personnes, services et capitaux peuvent circuler librement.</p></div>
<div class="rem"><p>⚠️ <b>Attention :</b> Europe et Union européenne, ce n'est pas la même chose.</p></div>
<p><b>Plein de dates :</b></p>
<ul>
<li><b>1951</b> = création de la CECA : communauté européenne du charbon et de l'acier (France, Allemagne, Italie, Pays-Bas, Belgique, Luxembourg)</li>
<li><b>1957</b> = CEE communauté économique européenne qui fait suite à la signature du traité de Rome et instaure une zone de libre-échange</li>
<li><b>1968</b> = création de l'union douanière : les droits de douane sont supprimés entre les pays signataires et les pays se dotent d'un tarif douanier extérieur commun</li>
<li><b>1986</b> = l'acte unique est adopté, il parachève (termine) le marché unique ce qui instaure une libre circulation des personnes / capitaux après la suppression des barrières à la libre circulation des marchandises</li>
<li><b>1992</b> = traité de Maastricht</li>
<li><b>1997</b> = traité d'Amsterdam qui engendre le pacte de stabilité et de croissance (PSC) qui a pour objectif de contrôler les déficits</li>
<li><b>1999</b> = création de l'UEM</li>
<li><b>2002</b> = mise en place de l'Euro</li>
<li><b>2007</b> = traité de Lisbonne qui : simplifie la prise de décision CAD à une majorité à 55&nbsp;% des membres du conseil ; instaure une présidence permanente du conseil européen ; permet une coopération policière et judiciaire</li>
<li><b>31 décembre 2020</b> = le Brexit devient effectif après des négociations commencées avec l'activation de l'article 50 en mars 2017</li>
</ul>

<h4>B — Les effets en termes de croissance du marché unique</h4>
<p>Le marché unique aboutit à l'accroissement de la taille de marché et à des économies d'échelle. En effet la constitution d'un vaste marché par l'ouverture des frontières commerciales accroît les débouchés des entreprises et donc la production ce qui permet de réaliser des économies d'échelle. Le libre-échange permet donc une diminution des coûts de production ce qui se traduit par une baisse des prix ce qui stimule le pouvoir d'achat des agents économiques alors que les consommateurs peuvent bénéficier d'une plus grande variété de biens. La constitution du marché unique a donc des effets par l'intermédiaire de la concurrence sur la recherche de compétitivité et donc sur les prix.</p>
<div class="rem"><p>Les effets du marché unique sont inégalement répartis au sein des États membres. Les régions les plus centralisées et les plus urbanisées en bénéficient davantage (confère Chapitre 3 : quels sont les fondements du commerce international et l'internationalisation de la production ?).</p></div>
<p>Le marché unique permet de stimuler le marché par 3 canaux :</p>
<ul><li>la suppression des barrières</li>
<li>l'augmentation de la taille de marché</li>
<li>l'augmentation de la concurrence</li></ul>`,

{num:"5.2", short:"La politique européenne de la concurrence : objectifs, modalités, limites",
text:"Comprendre les objectifs, les modalités et les limites de la politique européenne de la concurrence.",
cours:`
<h4>A — La politique de la concurrence</h4>
<div class="exo"><div class="exo-t">Exercice — Académie de Versailles</div>
<p><b>1. Qu'est-ce que la politique de la concurrence ?</b><br>C'est un ensemble de règles, normes juridiques qui rendent effective la concurrence entre les producteurs. C'est donc un ensemble de mesures prises par les pouvoirs publics qui visent à favoriser la concurrence entre les entreprises sur les marchés.</p>
<p><b>2. Quels sont les grands textes du droit de la concurrence ayant inspiré le droit européen de la concurrence ?</b><br>Les grands textes du droit de la concurrence, c'est basé notamment sur le Sherman Act de 1890, le Clayton Act en 1914.</p>
<p><b>3. Quels sont les objectifs du droit de la concurrence ?</b><br>a. rendre effective la concurrence : faire en sorte qu'elle soit réelle ;<br>b. rendre équitable la concurrence : aucun acteur ne doit être favorisé ;<br>c. profiter aux consommateurs : pousse les prix à la baisse et pousse à la consommation.</p>
<p><b>4. Quels sont les moyens à mettre en œuvre pour atteindre ces objectifs ?</b><br>Pour atteindre ces objectifs il faut définir les règles du jeu concurrentiel puis après contrôler l'application de ces règles et enfin sanctionner les comportements déviants.</p>
<p><b>5. Quelles sont les principales règles sur lesquelles repose la politique européenne de la concurrence ?</b><br>Le droit de la concurrence repose sur 4 piliers :<br>i. la lutte contre les cartels et les ententes (Article 101 du TFUE)<br>ii. la lutte contre les abus de position dominante (Article 102 du TFUE)<br>iii. la limitation des aides d'État (Article 107 du TFUE)<br>iv. le contrôle des opérations de concentration (Règlement de 2004)</p>
<p><b>6. Quelles institutions ont pour prérogatives le contrôle et le respect des règles du jeu concurrentiel ?</b><br>C'est la commission européenne, l'autorité de la concurrence, la DGCCRF qui ont pour prérogatives le contrôle et le respect des règles du jeu concurrentiel.</p>
<p><b>7. De quels moyens disposent ces institutions pour faire respecter le droit de la concurrence ?</b><br>Pour faire respecter le droit de la concurrence ils disposent de sanctions (amendes), des programmes de clémence ou encore des interdictions de fusion et acquisition (position dominante).</p>
<p><b>8. Pourquoi considère-t-on parfois que le droit de la concurrence entre en conflit avec la politique industrielle ?</b><br>Comme ce droit empêche des deals de M&A, il empêche la formation de «&nbsp;champions européens&nbsp;» qui auraient pour objectif de concurrencer les géants chinois ou américains.</p>
<p><b>9. Pourquoi considère-t-on que le droit de la concurrence menace les services collectifs marchands ?</b><br>Comme il impose une ouverture progressive de certains secteurs à la concurrence, ce qui implique un démantèlement des monopoles publics = craintes / inquiétudes pour l'emploi (suppression de postes) et sur la qualité du service public.</p>
<p><b>10. Quelle est la troisième limite de la politique de la concurrence présentée dans cette vidéo ?</b><br>C'est que cette politique peine à faire face au numérique qui sont en position dominante sur leur marché là où les GAFAM ou GATX.</p></div>

<h5>1 — Les objectifs / modalités de la politique de concurrence</h5>
<p>Les autorités de la concurrence, au travers de la commission européenne notamment, doivent garantir que la concurrence soit libre, non faussée au sein du marché unique. Cette volonté de maintenir un degré de concurrence élevé a plusieurs objectifs :</p>
<ul>
<li>limiter le pouvoir de marché des entreprises afin qu'il y ait une baisse des prix ce qui contribue au pouvoir d'achat des consommateurs ;</li>
<li>cela incite les entreprises à innover pour qu'elles restent compétitives et gagnent des parts de marché. Cela permet d'augmenter la qualité et la diversification de l'offre ;</li>
<li>la concurrence et les innovations soutiennent la croissance grâce à la baisse des prix et l'augmentation de la productivité. Ces derniers permettent d'accroître les revenus distribués aux agents économiques ce qui augmente la demande globale (conso + investissement).</li>
</ul>
<div class="def"><p><b>Politique de la concurrence</b> = ensemble des mesures prises par la commission européenne pour renforcer et maintenir la concurrence dans l'UE.</p></div>
<div class="rem"><p><b>Remarque :</b> l'État peut décider de confier certains secteurs tels que l'électricité, le transport ferroviaire, etc. à des monopoles publics pour des raisons sociales relevant du principe de solidarité afin de garantir à toute la population un accès à des biens ou services considérés satisfaisant des besoins essentiels des individus. L'ouverture à la concurrence peut générer une raréfaction de certains services publics dans les zones rurales.</p></div>

<h5>2 — Les limites</h5>
<div class="exo"><div class="exo-t">Exercice — politique de la concurrence</div>
<p><b>10-</b> Les bénéfices que les consommateurs peuvent tirer seront notamment des baisses des prix des produits/services dans les secteurs qui s'ouvrent à la concurrence mais aussi une augmentation du nombre de produits devant se différencier verticalement ou horizontalement.</p>
<p><b>11-</b> La libéralisation des activités va conduire à une augmentation des acteurs économiques sur un marché, or dans le cadre de l'UE ces acteurs auront tendance à s'implanter proches des autres acteurs sur le marché. De ce fait, si auparavant il y avait peu d'acteurs dans les zones rurales, cette ouverture à la concurrence ne va pas foncièrement changer les paysages ruraux voire même au contraire les délaisser encore plus car le nombre d'acteurs dans un secteur géographique joue sur l'attractivité et le développement de la production.</p>
<p><b>12-</b> L'introduction de la concurrence dans le transport ferroviaire ne conduit pas forcément à des concentrations ou à des ententes si elle est encadrée par une régulation publique efficace. Au contraire, la concurrence peut favoriser une amélioration de la qualité, une baisse des coûts et une innovation accrue qui bénéficie aux usagers. Des autorités indépendantes peuvent prévenir les abus de position dominante (situation monopolistique) et garantir un accès équitable aux infrastructures.</p></div>
<p>La politique de concurrence européenne se heurte à des difficultés de mise en œuvre, en effet pour le contrôle des opérations de concentration la commission européenne doit être en mesure d'anticiper les effets des concentrations sur le degré de concurrence qui en résulterait sur le marché concerné. De plus les ententes illicites sont par nature dissimulées. Il est donc difficile de les repérer.</p>
<p>La politique de concurrence est parfois accusée de s'opposer à la politique industrielle qui vise à améliorer les performances des entreprises et la puissance industrielle d'un pays voire d'une zone économique. Ainsi certaines opérations de Fusion&Acquisition peuvent être sanctionnées par des amendes. Ces critiques émergent alors qu'il existe des pratiques commerciales concurrentes notamment aux USA et en Chine qui seraient moins strictes que dans l'UE.</p>
<p>Certaines entreprises anticipant des difficultés à conclure la concentration renonceraient à commencer le projet et seraient parfois in fine rachetées par des entreprises hors UE comme par exemple le groupe Pirelli qui a été racheté par l'entreprise chinoise CNRC. Par conséquent la politique européenne de la concurrence nuirait à l'émergence de champions européens notamment dans les domaines stratégiques et technologiques. Or ces grands groupes européens seraient source d'innovation, de croissance et d'emploi. Ils pourraient ainsi concurrencer les champions chinois qui bénéficient de politiques industrielles offensives avec notamment les nouvelles routes de la soie ou encore concurrencer les grandes firmes américaines qui profitent de mesures protectionnistes depuis l'élection de Donald Trump.</p>
<p>Seules 3 entreprises européennes en 2017 appartiennent au top 10 des plus grands groupes mondiaux (VP, VW, Royal Deutsch).</p>
<p>Le développement de l'industrie numérique crée des marchés oligopolistiques. Ces entreprises ont la capacité à fournir des prix attractifs en raison des économies d'échelle, des produits de qualité grâce à une capacité d'innovation liée au financement de la R&D. Or ces entreprises peuvent bénéficier de positions dominantes et en abuser en rachetant notamment des start-up innovantes pour éviter la concurrence. Ces pratiques anti-concurrentielles sont sanctionnées bien que difficilement repérables (GAFAM). Dans certains cas la politique de la concurrence peut être néfaste aux consommateurs. En effet l'ouverture de certains services publics à la concurrence comme ce fut le cas avec la libéralisation du prix de l'électricité et la suppression progressive des tarifs règlementés. Pour atteindre certains objectifs économiques et sociaux, l'UE peut s'en remettre à un régime d'exception en accordant des aides ou en mettant en place une lutte accrue contre les pratiques déloyales des pays hors UE.</p>`,

{num:"5.3", short:"Politique monétaire et politique budgétaire : agir sur la conjoncture",
text:"Comprendre comment la politique monétaire et la politique budgétaire agissent sur la conjoncture.",
cours:`
<h4>B — Les politiques monétaires et budgétaires impactent la conjoncture</h4>
<div class="def"><p><b>Politique conjoncturelle :</b> ensemble des actions des pouvoirs publics destinées à régulariser l'évolution globale de l'économie.</p></div>
<p>Une politique monétaire ou budgétaire : ce sont des politiques économiques qui agissent à court terme sur des variations de la conjoncture économique, celles-ci se caractérisant par différents indicateurs (croissance, taux de chômage, taux d'inflation, solde extérieur, etc. — confère le carré magique de KALDOR).</p>

<h5>1 — Les effets de la politique monétaire</h5>
<p>La politique monétaire désigne l'ensemble des décisions et des actions visant à agir sur la conjoncture économique par l'intermédiaire des taux d'intérêts et/ou la qté de monnaie en circulation.</p>
<p>La Bq centrale dispose de différents instruments dont les tx d'intérêt directeurs appliqués aux bq de second rang lors du refinancement pour piloter sa politique monétaire et ainsi lutter contre l'inflation (qui doit être comprise entre 2 et 4&nbsp;%). La baisse des tx directeurs facilite les refinancements ce qui va permettre d'avoir une baisse du coût du crédit pour les ménages et les entreprises.</p>
<p>La banque centrale dispose de plusieurs instruments dont les taux d'intérêt directeurs appliqués aux banques de second rang lors du refinancement pour piloter sa politique monétaire.</p>
<p>Un problème se pose : la politique monétaire est du ressort uniquement de la banque centrale européenne, les contrôles d'inflation sont de 2&nbsp;% ce qui est son principal objectif, le regard sur la croissance étant moindre. La politique budgétaire est du ressort exclusif des États, il peut donc exister un problème de coordination entre différentes politiques ; d'autant que les États membres peuvent avoir des intérêts divergents.</p>

<h5>2 — Les effets de la politique budgétaire</h5>
<div class="rem"><p>Le plus gros flop de politique de relance : 81 Mitterrand.</p></div>
<p>La politique budgétaire consiste à utiliser le budget de l'État par une action sur les dépenses publiques et/ou les prélèvements obligatoires afin d'atteindre les objectifs fixés par le gouvernement pour réguler l'activité économique. La mise en œuvre de la politique budgétaire suppose une variation du solde budgétaire, CAD la différence entre les recettes et les dépenses de l'État. La politique budgétaire permet d'agir sur la conjoncture de 2 manières :</p>
<ul>
<li><b>En phase de récession :</b> certaines dépenses publiques augmentent (ex : indemnités chômage) tandis que les recettes de l'État diminuent. Le déficit budgétaire induit un effet positif sur la demande globale car les dépenses &gt; prélèvements obligatoires notamment. La hausse de la demande globale engendre un surcroît de commandes pour les entreprises qui sont incitées à embaucher ce qui augmente la production donc la croissance. Dans le cas d'une croissance forte l'effet est opposé, les dépenses baissent tandis que les recettes augmentent. Le solde budgétaire devient excédentaire et la croissance est ralentie pour éviter la surchauffe ou atténuer l'effet de récession.</li>
<li><b>L'État peut mettre en place des mesures spécifiques</b> pour soutenir ou au contraire freiner l'activité économique, par exemple en cas de récession l'État peut décider de dépenses publiques exceptionnelles (hausse des investissements, politique de grands travaux, prestations sociales et soutien à l'emploi public…). Cela vient creuser le déficit. On parle alors de politique de relance. Inversement, lorsque la croissance est forte, le chômage est faible et qu'il y a de l'inflation, cette politique budgétaire peut aussi consister à freiner la consommation en investissement et par conséquent la consommation en diminuant les dépenses publiques et/ou les prélèvements obligatoires.</li>
</ul>
<p>Toutefois les effets de la politique budgétaire sur la conjoncture économique sont loin d'être certains :</p>
<ul>
<li>une augmentation du revenu des ménages ne se traduit pas toujours par une hausse de la consommation. Les ménages peuvent décider d'épargner et en faire de l'épargne de précaution ;</li>
<li>en cas de relance budgétaire, dans une économie ouverte une partie de cette relance bénéficiera à des agents économiques non résidents du fait d'une hausse des importations. L'effet au niveau national sera donc restreint ;</li>
<li>lorsque le déficit budgétaire est financé par l'emprunt il y a un risque d'éviction pouvant limiter l'efficacité de la relance. Les tx risquent d'augmenter car il y a une hausse de la demande de capitaux de l'État ce qui va entraîner une baisse de l'investissement privé qui est évincé par l'investissement public.</li>
</ul>
<table>
<tr><th></th><th>Politique monétaire</th><th>Politique budgétaire</th></tr>
<tr><td><b>Modalité d'action</b></td><td>Baisse des tx directeurs</td><td>Hausse / baisse des dépenses publiques et impôts</td></tr>
<tr><td><b>Menée par</b></td><td>Banque centrale</td><td>L'État membre</td></tr>
<tr><td><b>Degré de marge de manœuvre</b></td><td>Aucune pour les États membres — limite : pas possible de mener une politique de relance pour avoir de la croissance</td><td>Forte : 3&nbsp;% de déficit, 60&nbsp;% PIB — limite : le poids pour l'avenir peut limiter les marges de manœuvre en cas de crise</td></tr>
</table>`,
savoir:[
"<b>Définitions :</b> politique conjoncturelle, politique monétaire (action via les taux d'intérêt et/ou la quantité de monnaie), politique budgétaire (action sur dépenses publiques et/ou prélèvements obligatoires), solde budgétaire (recettes − dépenses). Référence : le carré magique de Kaldor (croissance, chômage, inflation, solde extérieur).",
"<b>Mécanisme monétaire :</b> baisse des taux directeurs appliqués aux banques de second rang lors du refinancement → baisse du coût du crédit pour ménages et entreprises → stimulation de l'activité ; objectif principal de la BCE : inflation ≈ 2 %.",
"<b>Mécanisme budgétaire en récession :</b> dépenses ↑ (indemnités chômage) + recettes ↓ → déficit → effet positif sur la demande globale → commandes → embauches → production → croissance. En surchauffe : politique de rigueur inverse.",
"<b>Politique de relance :</b> dépenses exceptionnelles (grands travaux, prestations sociales, emploi public) creusant le déficit. Exemple à citer : le « flop » de la relance Mitterrand 1981.",
"<b>Les 3 limites de la politique budgétaire :</b> épargne de précaution des ménages ; fuite de la relance vers les importations en économie ouverte ; effet d'éviction (l'emprunt public fait monter les taux et évince l'investissement privé).",
"<b>Tableau à connaître :</b> monétaire = banque centrale, aucune marge pour les États ; budgétaire = État membre, contrainte par les seuils 3 % de déficit / 60 % du PIB."
],

{num:"5.4", short:"Monnaie unique, budgets nationaux : défauts de coordination et chocs asymétriques",
text:"Savoir que la politique monétaire dans la zone euro, conduite de façon indépendante par la Banque centrale européenne, est unique alors que la politique budgétaire est du ressort de chaque pays membre mais contrainte par les traités européens ; comprendre les difficultés soulevées par cette situation (défaut de coordination, chocs asymétriques).",
cours:`
<h4>A — L'articulation des politiques monétaires et budgétaires</h4>
<p>L'adoption de la monnaie unique au sein de la zone euro suppose un transfert de compétence vers une institution supra-nationale. Elle est indépendante du pouvoir politique, ses décisions sont prises dans l'intérêt commun. Son principal objectif est la stabilité des prix avec un taux d'inflation autour de 2&nbsp;%. L'indépendance de la BCE permet de garantir la confiance et la stabilité des taux d'intérêt. La politique budgétaire est du ressort des États mais elle est encadrée par des traités dont le pacte de stabilité de croissance. Ces règles notamment sur le déficit et la dette visent à éviter que certains pays ne creusent abusivement leur déficit ce qui pourrait nuire aux pays autour.</p>
<p>Les pays en creusant excessivement leur déficit risquent de soulever des doutes quant à la soutenabilité de leur dette ce qui aura un impact négatif sur les tx d'intérêt. De plus une pô de relance trop accommodante engendre un risque d'inflation. En cas de tension inflationniste, la BCE est contrainte d'intervenir et de poser une politique de rigueur.</p>
<div class="exo"><div class="exo-t">Exercice — Difficultés de coordination et contraintes (vidéo)</div>
<p><b>1.</b> Malgré la volonté de faire converger les économies, les situations peuvent varier entre les pays européens selon quatre indicateurs principaux : le taux de croissance, le niveau d'inflation, le taux de chômage, l'état du commerce extérieur.</p>
<p><b>2. Choc asymétrique et inefficacité du policy-mix :</b> Un choc asymétrique (qui ne touche qu'un seul pays) rend le «&nbsp;policy-mix&nbsp;» (combinaison des politiques budgétaire et monétaire) inefficace car les objectifs deviennent contradictoires. Exemple : si un pays subit un choc négatif, il veut mener une politique budgétaire de relance. Mais si, au même moment, la zone euro globale risque l'inflation, la BCE mènera une politique monétaire restrictive (hausse des taux). Ces deux actions s'annulent : la hausse des taux d'intérêt freine l'investissement et la consommation, contrecarrant ainsi l'effort de relance du pays.</p>
<p><b>3. Externalités positives d'une relance isolée :</b> Une politique de relance isolée profite aux pays voisins. Une partie des dépenses engagées par le pays qui relance son économie va servir à acheter des produits étrangers. Cela crée un effet de débordement : les partenaires commerciaux voient leurs exportations augmenter sans avoir eux-mêmes financé de plan de relance.</p>
<p><b>4. Inefficacité d'une relance asymétrique :</b> Elle peut être inefficace pour le pays qui l'entreprend à cause de la contrainte extérieure : l'augmentation des importations vers les pays voisins crée une «&nbsp;fuite&nbsp;» des capitaux. Si les exportations ne progressent pas au même rythme, cela dégrade le solde extérieur (déficit commercial) et limite l'impact de la relance sur la croissance nationale.</p>
<p><b>5. Conséquences d'une politique de rigueur isolée :</b> Une politique de rigueur asymétrique réduit la demande intérieure (consommation et investissement) du pays concerné. Conséquence pour les partenaires : comme le pays achète moins, ses importations diminuent, ce qui pénalise les exportations de ses partenaires commerciaux. Cela crée une externalité négative par un «&nbsp;effet de contagion&nbsp;», ralentissant la croissance chez les voisins.</p>
<p><b>6. Traités européens et règles de discipline :</b> Deux traités majeurs encadrent la coordination budgétaire : le Pacte de Stabilité et de Croissance (1997) impose que le déficit public ne dépasse pas 3&nbsp;% du PIB et que la dette publique ne dépasse pas 60&nbsp;% du PIB ; le Pacte Budgétaire Européen (2012) introduit la «&nbsp;règle d'or&nbsp;» sur le déficit structurel (corrigé de la conjoncture) : ce déficit ne doit pas dépasser 0,5&nbsp;% du PIB si la dette est supérieure à 60&nbsp;%, ou 1&nbsp;% si elle est inférieure.</p>
<p><b>7. Assurance du respect de ces traités :</b> Le respect des règles est assuré par une surveillance multilatérale : le Conseil ECOFIN (ministres des finances) et la Commission européenne surveillent les budgets. En cas de dérapage, la Commission peut émettre une recommandation, puis un avertissement. Si rien ne change, une procédure pour déficit excessif est engagée, pouvant aboutir à une amende financière.</p></div>

<h5>1 — Les problèmes de coordination</h5>
<p>L'entrée dans l'UEM et l'adoption de la monnaie unique comportent des inconvénients car limitent les possibilités d'intervention des États :</p>
<ul>
<li>la croissance est ralentie et il est impossible de dévaluer pour gagner en compétitivité prix ;</li>
<li>en respectant les critères de Maastricht il est difficile d'adopter une politique de relance ;</li>
<li>pour satisfaire les critères de Maastricht de nombreux pays doivent s'engager dans une pô d'austérité ce qui est défavorable à la croissance.</li>
</ul>
<p>En l'absence de coopération entre les différents États chacun a intérêt à adopter un comportement de passager clandestin en laissant les autres pays assumer le coût d'une pô de relance tandis qu'eux bénéficieraient des externalités positives. Le problème de coordination budgétaire pourrait disparaître s'il y avait un budget européen conséquent et que la pô de relance était au nom de l'UE. La politique monétaire unique et les contraintes qui pèsent sur les pô budgétaires ont montré leurs limites face à la crise des subprimes (la crise des banques grecques). En effet ces crises ont mis en évidence l'absence de mécanismes permettant de gérer les chocs asymétriques ainsi que la difficulté des pays à coordonner les pô budgétaire et monétaire.</p>
<div class="def">
<p><b>Choc symétrique :</b> évènement exogène qui impacte l'ensemble des pays de la zone.</p>
<p><b>Choc asymétrique :</b> évènement exogène qui n'affecte qu'un ou plusieurs pays de la zone.</p></div>
<p>Dans la zone euro un choc asymétrique impacte donc 1/plusieurs pays mais avec des intensités différentes, ce qui pose des problèmes d'ajustement et de coordination. Une zone monétaire est optimale si elle parvient à absorber les chocs conjoncturels asymétriques. <b>Robert Mundell</b> expliquait que pour qu'une zone monétaire soit dite «&nbsp;optimale&nbsp;» il faut qu'il existe des mécanismes d'ajustement alternatifs à la perte d'autonomie. Ces mécanismes pourraient être la parfaite mobilité des facteurs de production, la flexibilité des taux de salaires réels, une pô budgétaire ou de transfert budgétaire au sein de la zone pour ajuster des déséquilibres.</p>
<table>
<tr><th></th><th>Choc symétrique</th><th>Choc asymétrique</th><th>Justification</th></tr>
<tr><td>Arrivée massive de migrants en Allemagne</td><td></td><td>*</td><td>A des externalités sur le marché national et la quantité de facteur travail du marché domestique</td></tr>
<tr><td>Hausse de la valeur de l'€</td><td>*</td><td></td><td>BCE = pô sur tout le monde</td></tr>
<tr><td>Ralentissement de la croissance mondiale</td><td>*</td><td></td><td>Baisses globales des productions</td></tr>
<tr><td>Inondations en France</td><td></td><td>*</td><td>Externalités sur les dettes et assurances</td></tr>
</table>
<div class="exo"><div class="exo-t">Exercice — taux d'inflation et choc asymétrique</div>
<p><b>1.</b> Le document montre que l'Espagne et la Lettonie connaissent des conjonctures économiques très différentes en mai 2023. L'Espagne se caractérise par un faible taux d'inflation (2,9&nbsp;%) mais un taux de chômage très élevé (12,7&nbsp;%). À l'inverse, la Lettonie connaît une inflation très élevée (12,3&nbsp;%) combinée à un chômage modéré (5,7&nbsp;%). Ainsi, l'Espagne fait face à une conjoncture marquée par le chômage, tandis que la Lettonie est confrontée à une forte inflation, ce qui illustre des situations économiques contrastées au sein de la zone euro.</p>
<p><b>2.</b> Un choc asymétrique est un choc économique qui affecte différemment les pays d'une même zone monétaire. Le document illustre clairement ce type de choc : certains pays comme la Lettonie subissent une inflation très forte, tandis que d'autres comme l'Espagne connaissent surtout un chômage élevé. Or, dans la zone euro, la politique monétaire est unique et menée par la Banque centrale européenne (BCE). Cela pose problème car les besoins économiques divergent. Par exemple, face à une forte inflation, la BCE peut relever les taux d'intérêt, ce qui est adapté pour un pays comme la Lettonie. En revanche, cette politique risque d'aggraver le chômage en Espagne en freinant l'investissement et la consommation. De plus, les politiques budgétaires sont contraintes par les règles européennes, ce qui limite la capacité des États à mener des politiques de relance ciblées pour compenser ces chocs. Enfin, l'absence de mécanismes de transferts budgétaires importants entre pays empêche de corriger efficacement les déséquilibres. Ainsi, un choc asymétrique rend difficile la mise en œuvre de politiques économiques efficaces et adaptées à l'ensemble des pays de la zone euro.</p></div>`,

{q:"Pourquoi la coexistence d'une politique monétaire unique et de politiques budgétaires nationales pose-t-elle problème ?",
a:`<p><b>Dans la zone euro, la politique monétaire est unique et conduite de façon indépendante par la BCE, tandis que la politique budgétaire reste du ressort de chaque État membre mais contrainte par les traités : cette situation crée des défauts de coordination.</b></p><p>Car la BCE a pour objectif principal la stabilité des prix (inflation autour de 2&nbsp;%), le regard sur la croissance étant moindre, alors que les États peuvent avoir des intérêts divergents.</p><p>En effet, en l'absence de coopération, chacun a intérêt à adopter un comportement de passager clandestin : laisser les autres assumer le coût d'une politique de relance tout en bénéficiant de ses externalités positives — car une relance isolée profite aux voisins par l'effet de débordement (hausse des importations), tandis qu'elle est partiellement inefficace pour son auteur (dégradation du solde extérieur).</p><p>Illustration : la crise des subprimes et la crise des banques grecques ont mis en évidence l'absence de mécanismes permettant de gérer les chocs asymétriques. Le problème pourrait disparaître avec un budget européen conséquent et une relance au nom de l'UE.</p>`},
{q:"Qu'est-ce qu'un choc asymétrique et pourquoi est-il difficile à gérer en zone euro ?",
a:`<p><b>Un choc asymétrique est un évènement exogène qui n'affecte qu'un ou plusieurs pays de la zone (contrairement au choc symétrique qui touche toute la zone) : il rend le policy-mix inefficace.</b></p><p>Car les objectifs deviennent contradictoires : si un pays subit un choc négatif, il veut mener une politique budgétaire de relance ; mais si au même moment la zone euro globale risque l'inflation, la BCE mène une politique monétaire restrictive (hausse des taux) — la hausse des taux freine l'investissement et la consommation, contrecarrant l'effort de relance du pays.</p><p>En effet, les politiques budgétaires étant contraintes par les règles européennes et en l'absence de mécanismes de transferts budgétaires importants entre pays, les déséquilibres ne peuvent être corrigés efficacement.</p><p>Illustration : en mai 2023, l'Espagne (inflation 2,9&nbsp;%, chômage 12,7&nbsp;%) et la Lettonie (inflation 12,3&nbsp;%, chômage 5,7&nbsp;%) avaient des besoins opposés — relever les taux convenait à la Lettonie mais risquait d'aggraver le chômage espagnol. Exemples du cours : l'arrivée massive de migrants en Allemagne ou des inondations en France sont des chocs asymétriques ; une hausse de l'euro ou un ralentissement mondial sont symétriques.</p>`},
{q:"Quelles règles les traités européens imposent-ils aux politiques budgétaires nationales ?",
a:`<p><b>Deux traités majeurs encadrent la coordination budgétaire : le Pacte de Stabilité et de Croissance (1997) et le Pacte Budgétaire Européen (2012).</b></p><p>Car le PSC impose que le déficit public ne dépasse pas 3&nbsp;% du PIB et que la dette publique ne dépasse pas 60&nbsp;% du PIB ; le Pacte budgétaire de 2012 introduit la «&nbsp;règle d'or&nbsp;» sur le déficit structurel (corrigé de la conjoncture) : il ne doit pas dépasser 0,5&nbsp;% du PIB si la dette est supérieure à 60&nbsp;%, ou 1&nbsp;% si elle est inférieure.</p><p>En effet, ces règles visent à éviter que certains pays ne creusent abusivement leur déficit, ce qui nuirait aux pays voisins : un déficit excessif soulève des doutes sur la soutenabilité de la dette (impact négatif sur les taux d'intérêt) et une relance trop accommodante crée un risque d'inflation obligeant la BCE à une politique de rigueur.</p><p>Le respect est assuré par une surveillance multilatérale : le Conseil ECOFIN et la Commission surveillent les budgets ; en cas de dérapage — recommandation, puis avertissement, puis procédure pour déficit excessif pouvant aboutir à une amende.</p>`},
{q:"Qu'est-ce qu'une zone monétaire optimale selon Mundell ?",
a:`<p><b>Selon Robert Mundell, une zone monétaire est optimale si elle parvient à absorber les chocs conjoncturels asymétriques.</b></p><p>Car l'adoption d'une monnaie unique suppose une perte d'autonomie : il faut donc qu'existent des mécanismes d'ajustement alternatifs.</p><p>En effet, ces mécanismes pourraient être la parfaite mobilité des facteurs de production, la flexibilité des taux de salaires réels, ou une politique budgétaire / de transferts budgétaires au sein de la zone pour ajuster les déséquilibres.</p><p>Application à la zone euro : l'entrée dans l'UEM limite les interventions des États — impossible de dévaluer pour gagner en compétitivité-prix, difficile de relancer en respectant les critères de Maastricht, austérité défavorable à la croissance — et la zone manque précisément de mécanismes de transferts pour gérer les chocs asymétriques.</p>`}
]}

cours:`
<h4>A — Les différentes formes d'engagement politique</h4>
<div class="def">
<p><b>Engagement politique :</b> fait de faire une action individuelle ou de participer à une action collective dans le but de participer au pouvoir ou de le conquérir.</p>
<p><b>Action collective :</b> action commune et concertée des membres d'un grp afin d'atteindre un objectif commun.</p>
<p><b>Bénévolat :</b> travail non-rémunéré en faveur d'une institution / organisation.</p></div>
<div class="exo"><div class="exo-t">Exercice — formes d'engagement politique</div>
<p><b>Q1 : Caractérisez les formes d'engagement politique.</b><br>L'engagement politique est défini comme l'attitude d'une personne visant à participer à la vie politique pour influencer le pouvoir. Il prend quatre formes principales :</p>
<ul><li><b>Le vote :</b> c'est la forme la plus classique d'expression de l'opinion lors des élections.</li>
<li><b>L'engagement associatif :</b> il consiste à défendre volontairement une cause ou une idéologie au sein d'associations, de syndicats ou de partis.</li>
<li><b>Le militantisme :</b> une forme active d'engagement (distribution de tracts, collage d'affiches, réunions) visant à transformer l'organisation de la société.</li>
<li><b>La consommation engagée :</b> le fait d'utiliser ses achats (ou le boycott) pour défendre des causes éthiques ou politiques.</li></ul></div>
<p>L'engagement politique peut prendre différentes formes :</p>
<ul>
<li><b>La consommation engagée :</b> elle correspond au choix de consommation d'un individu qui cherche à être raccord avec ses convictions. C'est la manifestation d'un engagement politique par le biais de la consommation. La consommation engagée implique de renoncer à la posture du consommateur rationnel économiquement pour adopter une position en accord avec des valeurs et donc être prêt à payer plus cher ou avec des contraintes d'usage particulières. Cette forme d'engagement cherche à transformer le fonctionnement des marchés depuis la position de consommateur.</li>
<li><b>Le vote :</b> désigne le fait d'exprimer une opinion lors d'une élection ou d'une prise de décision. Il est considéré comme la forme d'engagement minimale au niveau individuel. Toutefois le vote est considéré comme un engagement politique s'il est suivi d'une pratique régulière et s'accompagne d'autres pratiques telles que des discussions politiques, des infos sur les candidats, etc. De plus il faut que les personnes qui votent aient des attentes quant aux résultats. Les Français considèrent le vote comme une forme d'action politique efficace au moins pour 40&nbsp;% des Français. On peut tout de même noter que chez les jeunes de 18 à 30 ans, l'importance du vote perd en signification.</li>
<li><b>Le militantisme :</b> désigne l'activité d'une personne qui lutte activement pour une cause. Cela peut prendre l'adhésion à un parti politique, syndicat ou encore une association. Le militant se distingue du simple adhérent car il prend part activement aux activités (participation aux réunions, distribution de tracts, manifestations, etc.). Son engagement est durable et impacte sa manière de vivre.</li>
<li><b>L'engagement associatif :</b> constitue le fait d'être membre d'une association, cela peut prendre la forme de dons, bénévolat, service civique. Pour que l'engagement associatif soit un engagement politique il faut que : cet engagement cherche à influencer la désignation des institutions de gouvernement et la compétition d'accès au pouvoir ; que cet engagement ait pour but de politiser une cause ou des intérêts CAD rendre visible dans le débat public, de militer pour qu'elle fasse l'objet d'une prise en charge par les institutions publiques.</li>
</ul>`,
